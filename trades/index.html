/* ---- TAB: my trades -------------------------------------------------------------------------- */
function actingSeat(){
  var s = session();
  if (!s || !s.seat) return null;
  if (s.role === 'commissioner' && S.actingAs){
    var b = S.actingAs.split('|');
    return {div: b[0], seat: b[1], onBehalf: true, by: s.seat};
  }
  return {div: s.div, seat: s.seat, onBehalf: false};
}
/* A LIST IS A DRAFT UNTIL IT IS SUBMITTED. Casey, 10 Sep 2026: "it feels like there needs to be
   a submit button ... owners are going to put this in and then think, oh, I need to submit it,
   because that's how all their websites work." He is right, and the fix is not only a button:
   a form that saves silently gives an owner NO WAY TO TELL whether they are entered. So there
   are two states, they are named on the screen, and only a submitted list goes into Monday.
   Typing still saves as it goes, so a dead phone loses nothing -- but saving is not entering. */
function myReq(){
  var a = actingSeat(); if (!a) return null;
  var r = S.requests[key(a.div, a.seat)];
  return (r && r.week === weekNo()) ? r : null;
}
function myRows(){ var r = myReq(); return r ? r.rows : []; }
function isSubmitted(){ var r = myReq(); return !!(r && r.submitted); }
function setRows(rows){
  var a = actingSeat(); if (!a) return;
  var prev = myReq();
  S.requests[key(a.div, a.seat)] = {week: weekNo(), rows: rows, by: a.by || a.seat,
                                    submitted: prev ? prev.submitted : null};
  save();
}
/* WHAT IS WRONG WITH THIS LIST, in the owner's words. Returned as a list of sentences rather
   than a boolean, because "Submit is greyed out" is not a reason. */
function listProblems(rows){
  var out = [];
  (rows || []).forEach(function(r, i){
    if (!r) return;
    var n = 'Row ' + (i + 1);
    if (!r.pickup) out.push(n + ' has no team to pick up.');
    else if (!(r.drops || []).filter(Boolean).length)
      out.push(n + ' has no team to drop for ' + r.pickup + '.');
  });
  if (!(rows || []).length) out.push('There is nothing on your list yet.');
  return out;
}
function submitList(){
  var rows = myRows(), bad = listProblems(rows);
  if (bad.length){
    showHelp('Not ready to send', '<p>' + bad.map(esc).join('</p><p>') + '</p>');
    return;
  }
  var a = actingSeat();
  S.requests[key(a.div, a.seat)].submitted = now();
  save();
  showHelp('You Are Entered for Monday',
    '<p>Your list is in for week ' + weekNo() + '. Nothing happens until Monday at 4:00pm AZ.</p>'
    + '<p>You can change it any time before then — press <b>Change My List</b>, make the change, '
    + 'and send it again.</p>');
  render();
}
function unsubmit(){
  var a = actingSeat(); if (!a) return;
  var r = myReq(); if (!r) return;
  r.submitted = null; save(); render();
}
function addRow(){
  var rows = myRows().slice();
  if (rows.length >= P.MAX_ROWS) return;
  rows.push({pickup: '', drops: [''], cond: {type: 'always', row: 1}});
  setRows(rows); render();
}
function delRow(i){ var r = myRows().slice(); r.splice(i, 1); setRows(r); render(); }
function editRow(i, field, v, j){
  var rows = myRows().slice(), row = Object.assign({}, rows[i]);
  if (field === 'pickup') row.pickup = v;
  else if (field === 'drop'){ row.drops = row.drops.slice(); row.drops[j] = v;
    row.drops = row.drops.filter(function(x, k){ return x || k === 0; });
    if (row.drops.length < P.MAX_DROPS && row.drops[row.drops.length - 1]) row.drops.push(''); }
  else if (field === 'condtype'){ row.cond = {type: v, row: (row.cond || {}).row || 1}; }
  else if (field === 'condrow'){ row.cond = {type: (row.cond || {}).type || 'always', row: +v}; }
  rows[i] = row; setRows(rows); render();
}
function viewTrades(){
  var s = session();
  if (!s || !s.seat) return '<div class="card"><div class="empty">Sign in first — the seat a '
    + 'trade lands on comes from the key this device is holding, so there is nothing to fill in '
    + 'until there is one.</div></div>';
  var a = actingSeat();
  var k = key(a.div, a.seat);
  var free = freeIn(a.div), mine = (S.rosters[k] || []).slice().sort();
  /* The forms compute each team's standing from the clock themselves, so there is no map to
     carry around and no chance of one going stale between the form and the run. */
  var fcfs = mode() === 'fcfs';

  /* BOTH WAYS OF GETTING A TEAM, ALWAYS ON SCREEN, with the one that is Open Now marked.
     Casey, 10 Sep 2026: "there's nothing on here in terms of the first come first serve process
     ... I don't even see how I would do it currently." The tab showed only whichever half the
     clock was in, so an owner in the Monday-list window had no way to learn the other half
     existed, let alone what to do in it. **A TOOL THAT SHOWS ONLY THE CURRENT STEP CANNOT TEACH
     THE PROCESS** — the reader needs the shape of the week before they need today's form. */
  var h = clockBanner() + twoWays(fcfs);
  if (s.role === 'commissioner'){
    h += '<div class="card"><h2>Commissioner — Entering for Someone Else</h2>'
      + '<p class="note">Same form, same rules, same clock. The only difference is the line in '
      + 'the log saying you entered it, and the email that goes to them saying so.</p>'
      + '<label class="lb" for="ba">Submitting for</label><select id="ba" '
      + 'onchange="S.actingAs=this.value||null;save();render()"><option value="">— myself ('
      + esc(s.seat) + ') —</option>'
      + DATA.seats.map(function(x){
          var kk = key(x.div, x.owner);
          return '<option value="' + esc(kk) + '"' + (S.actingAs === kk ? ' selected' : '') + '>'
            + esc(x.owner) + ' — ' + esc(DATA.div_names[x.div] || x.div) + '</option>';
        }).join('') + '</select></div>';
  }
  /* TELL THEM WHAT TO DO, IN ORDER, BEFORE SHOWING THEM ANY CONTROLS. Casey, 10 Sep 2026:
     "'Rows run in order' doesn't give any sort of instruction to the end user as to what they
     should be doing." He is right — that sentence describes the MECHANISM to somebody who
     already knows what a row is for. An owner opening this tab for the first time needs the
     three things to press, in the order they press them, with the buttons named. */
  h += '<div class="card"><h2>' + (fcfs
      ? 'First come, first served &mdash; Open Now'
      : 'Your List for Monday') + '</h2>'
    + (fcfs
        ? '<p class="note">The coin flips have been run. Anything still unowned is yours if you '
          + 'ask first, until <b>Tuesday at 5:00pm AZ</b>. After that, list-building for next Monday '
          + 'opens again.</p>'
        : '<p class="note">Entry closes at <b>Monday at 3:59pm AZ</b>. First come, first served opens '
          + 'straight afterwards and runs until Tuesday at 5:00pm AZ.</p>')
    + (fcfs
      ? '<ol class="note"><li>Choose the team you want to <b>pick up</b>. Only teams nobody in '
        + esc(DATA.div_names[a.div] || a.div) + ' owns are listed.</li>'
        + '<li>Choose the team you will <b>drop</b> for it. It has to be the same kind of team — '
        + 'college for college, NFL for NFL.</li>'

/* Just the time out of a clock string, with its zone. */

   for a week's worth of games. Both states are printed: an absence is never an answer, so "it is
   really now" has to be said rather than implied by the lack of a warning. */

    + 'count as if it were ' + esc(pretty(now())) + '.</b>'

    + 'open all follow that moment. Really it is ' + esc(pretty(real)) + '.</p>'

function pfilter(id, q){

     depressing, it's not doing anything."

  var p = S.fcp || '', d = S.fcd || '';

/* WHO IS ACTUALLY SIGNED IN, RIGHT NOW. The same three tests `session()` applies, asked of the
   whole key store instead of one device. A status column that reasons differently from the gate
   is a second store of one fact, and one of them would eventually lie.
   THIS REPLACED A PERMANENT `Keys last retired` DATE. Casey, 10 Sep 2026: he retired his keys,
   changed his address, signed back in, and the row still read "Tue 15 Sep 5:01pm AZ" forever after

   not have to be the place it is shown. A column Bob reads before acting should say what is true

function liveSessions(row){
  var n = 0, since = '';
  Object.keys(S.tokens).forEach(function(k){
    var t = S.tokens[k];
    if (t.seat !== row.seat || t.div !== row.div) return;
    /* THE ADDRESS THE KEY WAS ISSUED TO MUST STILL BE THE ONE ON THE SEAT — the same test the
       gate makes, so changing an address drops the count without a retire. */
    if (String(t.email || '').toLowerCase() !== String(row.email || '').toLowerCase()) return;
    if (row.retiredSeq && (t.seq || 0) < row.retiredSeq) return;
    if (!row.retiredSeq && row.validAfter && t.issued < row.validAfter) return;
    /* A KEY NOBODY IS HOLDING IS NOT A SESSION. Signing out leaves the key in the store. */
    var held = false;
    Object.keys(S.devices).forEach(function(d){
      if (S.devices[d] && S.devices[d].token === k) held = true;
    });

    n++;

     a column anybody can paste over; `Retire?` is a request Bob types, so it goes out blank; and
     `Signed in` is written by the script, so pasting a count in would be pasting in a lie. */
  return ['Division,Seat,Email,Status,Role,Retire?,Signed in'].concat(S.access.map(function(r){
    return [r.div, r.seat, r.email, r.status || 'active', r.role || 'owner', '', '']
      .map(q).join(',');
  })).join('\n');
}
function copyCSV(){
  var t = csv();
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t);
  showHelp('Paste this into the Sheet', '<p>Copied, if the browser allowed it. Either way here '
    + 'it is — select it and copy.</p><pre class="mono" style="white-space:pre-wrap;'
    + 'max-height:280px;overflow:auto">' + esc(t) + '</pre>');
}

/* ---- TAB: rosters ------------------------------------------------------------------------------ */
function viewRosters(){
  var h = '<div class="card"><h2>Where the Sandbox Stands</h2>'
    + '<p class="note">Started as a copy of the real rosters. Everything below is the result of '
    + 'what you have done in here, and none of it has left this browser.</p>'
    + '<div class="row"><button class="dang" onclick="doReset()">Put the Real Rosters Back</button>'
    + '</div></div>';
  h += S.log.length ? '<div class="card"><h2>What Has Moved</h2><div class="scr"><table>'
      + '<colgroup><col style="width:24%"><col style="width:22%"><col style="width:22%">'
      + '<col style="width:32%"></colgroup>'
      + '<thead><tr><th>Seat</th><th>In</th><th>Out</th><th>How</th></tr></thead><tbody>'
      + S.log.map(function(e){
          return '<tr><td>' + esc(e.owner) + '</td><td class="g">' + esc(e['in']) + '</td>'
            + '<td class="d">' + esc(e.out) + '</td><td class="d">wk ' + e.week + ' · '
            + esc(e.how) + (e.by ? ' · entered by ' + esc(e.by) : '') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>'
    : '<div class="card"><div class="empty">Nothing has moved yet. Rosters are exactly as '
      + 'drafted.</div></div>';
  h += DATA.divisions.map(function(d){
    return '<div class="card"><h2>' + esc(DATA.div_names[d] || d) + '</h2><div class="scr"><table>'
      + '<colgroup><col style="width:28%"><col style="width:72%"></colgroup><tbody>'
      + DATA.seats.filter(function(s){ return s.div === d; }).map(function(s){
          var k = key(d, s.owner);
          return '<tr><td>' + esc(s.owner) + '</td><td class="d">'
            + esc((S.rosters[k] || []).slice().sort().join(', ') || '—') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
  }).join('');
  return h;
}
/* RESET IS A DIFFERENT THING ON THE TWO PAGES AND IT SAYS SO. In the practice copy it throws
   away made-up trades in one browser. On the real page it throws away the league's trades for
   everybody, which is a sentence that has to be read before the button is pressed. Casey asked
   for this outright on 12 Sep 2026: he wants to run a real week early, check it, and put it all
   back before Monday. */
function doReset(){
  var body = Store.live()
    ? '<p>This throws away <b>every trade the league has run</b> and puts the drafted rosters '
      + 'back. It happens in the league sheet, so it happens for everybody, not only on this '
      + 'device.</p>'
      + '<p>Do it when you have been testing and want a clean start. Do not do it after a week '
      + 'has been settled for real.</p>'
      + '<p>Sign-ins and the access list are kept.</p>'
    : '<p>This throws away every trade you have run in here and reloads the drafted rosters. '
      + 'Sign-ins and the access list are kept.</p>';
  showHelp(Store.live() ? 'Throw away every trade and start again?' : 'Put the real rosters back?',
    body
    + '<div class="row" style="margin-top:10px">'
    + '<button class="dang" onclick="reallyReset()">Yes, Reset the Rosters</button>'
    + '<button onclick="closeHelp()">Leave It Alone</button></div>');
}
function reallyReset(){
  S.rosters = freshRosters(); S.acquiredAt = {}; S.log = []; S.results = null; S.requests = {};
  save(); closeHelp(); render();
}

/* ---- boot -------------------------------------------------------------------------------------- */
function seedAccess(){
  return DATA.seats.map(function(s){
    var mine = (DATA.me && s.div === DATA.me.div && s.owner === DATA.me.seat);
    return {div: s.div, seat: s.owner, email: mine ? (DATA.me.email || '') : '',
            status: 'active', validAfter: '', role: 'owner'};
  });
}
function blank(){
  return {clock: rightNow(), device: 'A', devices: {}, tokens: {}, links: [], seq: 0,
          access: seedAccess(), former: [], requests: {}, rosters: freshRosters(),
          acquiredAt: {}, log: [], accessLog: [],
          results: null, seed: 'RFL-SANDBOX', actingAs: null, autoPeloton: true, autoEmail: true, ranWeeks: {}, claimQueue: [], lastEmail: (DATA.me || {}).email || ''};
}
/* THE SAVE LIGHT. On the real one this is the reader's only way of knowing their trade reached
   the league rather than their own browser, so it says which, in words, at all times. */
function saveLight(st, why){
  var b = el('savechip');
  if (!b) return;
  if (!Store.live()){ b.hidden = true; return; }
  var say = {saving: ['w', 'Saving'], saved: ['g', 'Saved to the League Sheet'],
             offline: ['b', 'Not Saved'], stale: ['b', 'Reloaded'],
             nokey: ['b', 'Key Needed'], ready: ['', '']};
  var m = say[st] || ['', st];
  b.hidden = false;
  b.className = 'chip ' + m[0];
  b.textContent = m[1];
  if (st === 'nokey'){
    b.title = 'This device has not been given the commissioner key yet, so the league sheet will '
            + 'not answer it.';
    return;
  }
  b.title = st === 'offline'
    ? 'The league sheet could not be reached, so this change is still only on this device. '
      + 'It will be sent again by itself. ' + (why || '')
    : (st === 'stale'
        ? 'Somebody else changed this while you had it open, so what you are looking at was '
          + 'reloaded from the league sheet.'
        : 'Everything on this page is stored in the league sheet.');
}

/* ASKING FOR THE KEY. Typed once per device and remembered by that browser. It is never in the
   page, because the page's source can be read by anybody who opens it, and this key is what
   stands between an owner and the whole Access tab. */
function askForKey(){
  showHelp('This Device Needs the Commissioner Key',
    '<p>The league sheet will not answer a device that has not been given its key. That is what '
    + 'stops an owner reading the league\'s email addresses.</p>'
    + '<p>The key is on the <b>Settings</b> tab of the <b>RFL Trades</b> spreadsheet, beside '
    + '<b>Commissioner key</b>. Only you and Bob can open that spreadsheet.</p>'
    + '<label class="lb" for="ck">Commissioner Key</label>'
    + '<input id="ck" autocapitalize="characters" autocorrect="off" spellcheck="false" '
    + 'placeholder="ABCDEF-GHJKLM-NPQRST-UVWXYZ" value="' + esc(Store.key()) + '">'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="pri" onclick="saveKey()">Use This Key</button>'
    + '<button onclick="closeHelp()">Not Now</button></div>'
    + '<p class="note">It is remembered on this device only. Each phone and each computer is '
    + 'told once.</p>');
}
function saveKey(){
  var v = el('ck') ? el('ck').value : '';
  if (!String(v).trim()) return;
  Store.setKey(v);
  closeHelp();
  boot();
}

function boot(){
  Store.boot({
    api: (DATA.api || null),
    get: function(){ return S; },
    set: adopt,
    blank: blank,
    access: adoptAccess,
    status: saveLight,
    needKey: askForKey,
    ready: function(stuck){
      if (!S) adopt(null);
      render();
      if (stuck) showHelp('The League Sheet Could Not Be Reached',
        '<p>This page keeps everything in the league spreadsheet, and it could not reach it just '
        + 'now. Nothing you do here will be saved until it can.</p>'
        + '<p>Check that you are online and reload the page. If it keeps happening, the script '
        + 'on the sheet may need to be deployed again.</p>'
        + '<p class="note">' + esc(Store.why()) + '</p>');
    }
  });
}
buildRulesNote();
boot();
</script>
</body></html>
