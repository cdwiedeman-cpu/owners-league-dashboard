  + 'before any of this existed. Nothing about the league needs all 27 of them to sign in.</p>'

  + '<p><b>A seat needs adding or removing.</b></p>'
  + '<p class="note">That cannot be done here, on purpose. The 27 teams are the league\u2019s and '
  + 'they are fixed for the season. A page where a seat could be deleted by accident is a page '
  + 'that can lose a roster.</p>';

function setAccess(i, f, v){
  if (f === 'email'){
    var old = String(S.access[i].email || '').trim().toLowerCase();
    /* KEPT AUTOMATICALLY, so replacing an owner stays two edits and nobody has to remember to
       write the old address down somewhere. */
    if (old && old !== String(v || '').trim().toLowerCase()){
      S.former = (S.former || []).filter(function(x){ return x.email !== old; });
      S.former.unshift({email: old, seat: S.access[i].seat, div: S.access[i].div, at: now()});
      S.former = S.former.slice(0, 60);
      note(S.access[i], 'address changed from ' + old + ' to '
                        + (String(v || '').trim() || 'nothing'));
    }
  }
  S.access[i][f] = v; save(); render();
}
function nextSeq(){ S.seq = (S.seq || 0) + 1; save(); return S.seq; }
/* RETIRING KEYS DOES NOT REMOVE THE ADDRESS, and it is not meant to. It ends every session that
   exists right now; the address on the row can still ask for a new link. Replacing an owner is
   TWO edits — change the address, then retire — and doing only the second one signs the same
   person out and lets them straight back in, which is exactly what Casey saw. */
/* PRACTISING A RETIREMENT HAS TO PRACTISE THE REAL ONE.
 *
 * Casey, 14 Sep 2026: "shouldn't the access list be on the practice thing as well, so I can
 * practice retiring an owner and issuing a new code, to ensure that works?" It was there. It did
 * something else. The live button is <b>Retire and Issue a New Code</b> and hands the new code
 * back on the spot; this one ended the sessions and left the old code working, under a panel
 * telling him the owner could "ask for a new link" -- a flow that died with the Google account.
 * PRACTISING ON DIFFERENT BUTTONS TEACHES THE WRONG THING, so it does what the real one does.
 */
function bump(i){
  var row = S.access[i];
  /* HOW MANY SESSIONS THIS ACTUALLY ENDED, counted at the moment it happens. A watermark with no
     count reads as a pending state; "1 session ended" reads as something that has finished. */
  var seq = nextSeq(), n = 0;
  Object.keys(S.tokens).forEach(function(k){
    var t = S.tokens[k];
    if (t.seat === row.seat && t.div === row.div && (t.seq || 0) < seq) n++;
  });
  row.validAfter = now();
  row.retiredSeq = seq;
  row.retiredN = n;
  /* THE NEW CODE IS THE POINT OF THE BUTTON. The old one stops working the moment this is set. */
  row.code = code6();
  note(row, (n ? n + ' device' + (n === 1 ? '' : 's') + ' signed out' : 'nothing was signed in')
            + ', new code issued');
  save();
  showHelp('New Code Issued for ' + row.seat,
    '<p>Their new code is <b class="mono">' + esc(row.code) + '</b>. Email or text it to them, on '
    + 'its own.</p>'
    + '<p>' + (n
        ? esc(String(n)) + ' device' + (n === 1 ? '' : 's') + ' signed in to <b>'
          + esc(row.seat) + '</b> ' + (n === 1 ? 'has' : 'have') + ' been signed out.'
        : 'Nothing was signed in to <b>' + esc(row.seat) + '</b>, so nothing was signed out. The '
          + 'old code has stopped working either way, which is what you want if you are about to '
          + 'hand the seat over.') + '</p>'
    + '<p class="note">The old code no longer signs anybody in. The <b>Signed in</b> column reads '
    + '<i>nobody signed in</i> now, and the change is written into <b>Recent Changes</b> with its '
    + 'date.</p>'
    + '<p class="note">To hand the seat to somebody else, change the address first and then press '
    + 'this. Changing the address on its own signs nobody out.</p>');
  render();
}
/* ADD A ROW AND THE DELETE CROSS ARE GONE FROM THE PRACTICE COPY. The real page has neither --
   the 27 seats are the league's and they are fixed for the season -- and a control that exists
   only where it does not matter is a control that teaches a habit the live page will refuse.

/* ---- TAB: rosters ------------------------------------------------------------------------------ */
/* ---------- what a trade costs, and changing it ------------------------------------------ */

/* THE AMOUNT IS RECORDED ON THE LINE, NOT COUNTED FROM THE LINES. Casey, 10 Sep 2026: a
   correction can take two or three roster moves to put one trade right, "and you wouldn't want
   to double or triple charge somebody for their fees." A total that is rows times three cannot
   be corrected -- there is nothing to correct, only rows to delete, and deleting a row loses the
   history that explains the roster. So each row carries its own amount and the total is a sum.

   THE CONTROL DID NOT EXIST UNTIL NOW. The guide described it for days, the data structure
   supported it, and there was no way to do it. Casey, 13 Sep 2026: "rebuild it to fix the gap."
   A CAPABILITY DESCRIBED IN A DOCUMENT AND MISSING FROM THE PAGE IS THE SAME DEFECT AS A COLUMN
   NOBODY WRITES. */
function FEE(){ return DATA.trade_cost == null ? 3 : DATA.trade_cost; }
function money(n){ return (n < 0 ? '\u2212$' : '$') + Math.abs(Number(n)).toFixed(0); }
function feeOfRow(e){ return (e && typeof e.fee === 'number') ? e.fee : FEE(); }

/* A ROW IS FOUND BY WHAT IT IS, NOT BY WHERE IT SITS. `S.log` is unshifted on every settle, so
   an index captured when the panel opened would point at a different trade by the time it was
   saved. */
function feeKeyOf(e){ return [e.when || '', e.div || '', e.owner || '', e['in'] || ''].join('|'); }
function feeRow(k){
  var L = S.log || [];
  for (var i = 0; i < L.length; i++) if (feeKeyOf(L[i]) === k) return L[i];
  return null;
}
function feeCell(e){
  var v = feeOfRow(e), std = v === FEE();
  return '<button class="f" style="padding:3px 8px;font-size:11px" '
    + 'onclick="openFee(' + jq(feeKeyOf(e)) + ')" '
    + 'title="' + esc(std ? 'The standard ' + money(FEE()) + ' transaction fee. Tap to change it.'
        : 'Set to ' + money(v) + ' rather than the standard ' + money(FEE())
          + (e.fee_note ? ': ' + e.fee_note : '. No reason was recorded.') + ' Tap to change it.')
    + '">' + (std ? '' : '<span class="pill gold" style="margin-right:4px">changed</span>')
    + esc(money(v)) + '</button>';
}

/* ---- PUTTING ONE TRADE RIGHT ------------------------------------------------------------
 * Casey, 15 Sep 2026: "all he can do right now is undo all -- well, that undoes every single
 * trade. What if one division's trades are fine versus another he has to undo? Or what if it's
 * just one trade he needs to undo? I need to go in and reverse one trade and input a new one,
 * or just reverse and not do anything."
 * Undo a Week is the right tool for "the whole run was wrong" and the wrong one for everything
 * else, because it takes twenty-six correct trades back to fix one. So: a trade is taken back
 * on its own, and the seat can be given a different team in its place.
 *
 * TAKING A TRADE BACK MEANS IT NEVER HAPPENED. The roster goes back, the line comes off the
 * list, and the charge goes with it -- Casey, 14 Sep 2026, on exactly this: "make sure we can
 * undo it and reprocess it and not overcharge them on the transactions list." The dashboard
 * builds its ownership and its points from this same list, so a line that is gone takes its
 * points with it. That is what makes this the tool for a trade that should not have run.
 *
 * IT REFUSES RATHER THAN HALF-DOING IT. Three things can make a take-back impossible, and each
 * one is said in words instead of being worked around:
 *   - the team that came in has already moved on, so a later trade has to be put right first;
 *   - the team that went out now belongs to somebody else in that division, and one division
 *     may not have a team twice;
 *   - the trade is not on the list any more, because somebody else fixed it while this panel
 *     was open.
 * A correction that silently does half of itself is worse than one that will not start.
 */
function fixRow(k){ return feeRow(k); }

/* WHEN THIS SEAT GOT A TEAM, WORKED OUT FROM THE LIST rather than guessed. The hold counts from
   the day a team changed hands, so putting a team back has to put its old start date back too.
   Deleting the date instead would say the team was DRAFTED, which restarts nobody's hold and
   quietly makes a team droppable that is not. */
function acqFromLog(div, owner, team, before){
  var L = S.log || [];
  for (var i = 0; i < L.length; i++){
    var e = L[i];
    if (e.div !== div || e.owner !== owner || e['in'] !== team) continue;
    if (before && String(e.when || '') >= String(before)) continue;
    return e.effective || String(e.when || '').slice(0, 10) || '';
  }
  return '';                       // never picked up by this seat, so it was drafted
}

/* Why this trade cannot be taken back, or '' if it can. */
function fixBlocked(e){
  var k = key(e.div, e.owner);
  var r = S.rosters[k] || [];
  if (r.indexOf(e['in']) < 0){
    return '<b>' + esc(e['in']) + ' is not on ' + esc(e.owner) + '’s roster any more.</b> '
      + 'A later trade moved it. Put that one right first, then come back to this one.';
  }
  if (e.out){
    if (r.indexOf(e.out) >= 0){
      return '<b>' + esc(e.out) + ' is already back on this roster.</b> There is nothing left to '
        + 'put right here.';
    }
    var holder = '';
    Object.keys(S.rosters).forEach(function(kk){
      if (kk.slice(0, e.div.length + 1) !== e.div + '|') return;
      if (kk === k) return;
      if ((S.rosters[kk] || []).indexOf(e.out) >= 0) holder = kk.split('|')[1];
    });
    if (holder){
      return '<b>' + esc(e.out) + ' now belongs to ' + esc(holder) + '.</b> One division cannot '
        + 'have the same team twice, so ' + esc(holder) + '’s trade has to be put right '
        + 'first.';
    }
  }
  return '';
}

function openFix(k){
  var e = fixRow(k);
  if (!e){ showHelp('That Trade Is Gone', '<p>Somebody else put it right while this was open. '
    + 'The list below is up to date.</p>'); return; }
  var stop = fixBlocked(e);
  var head = '<p><b>' + esc(e.owner) + '</b> \u2014 ' + esc(DATA.div_names[e.div] || e.div)
    + ', week ' + e.week + '.<br>They got: <b class="g">' + esc(e['in'] || 'nothing') + '</b><br>'
    + 'They gave up: <b>' + esc(e.out || 'nothing') + '</b></p>';
  if (stop){
    showHelp('This One Cannot Be Put Right Yet', head + '<p>' + stop + '</p>'
      + '<div class="row" style="margin-top:10px"><button onclick="closeHelp()">Close</button>'
      + '</div>');
    return;
  }
  /* ---- EITHER SIDE OF THE TRADE CAN BE WRONG ----------------------------------------------
   * Casey, 15 Sep 2026: "team to put on instead doesn't really make sense ... it's more like
   * correct the team he wanted. But shouldn't there be an option to correct a team he dropped?
   * Maybe the wrong team was dropped."
   * Yes, and it is the same correction. A trade is a pair, so the panel shows the pair and lets
   * either half be changed. Leaving both as they are and pressing Save changes nothing, which is
   * why Take the Trade Back is a separate button and not a third option in a list.
   * WHAT IS ON OFFER ON EACH SIDE:
   *   they got     -> every team free in that division, plus the one they actually got
   *   they gave up -> every team on their roster now, plus the one they actually gave up
   */
  var k2 = key(e.div, e.owner);
  var inOpts = freeIn(e.div).slice();
  if (e['in'] && inOpts.indexOf(e['in']) < 0) inOpts.push(e['in']);
  inOpts.sort();
  var outOpts = (S.rosters[k2] || []).slice();
  if (e.out && outOpts.indexOf(e.out) < 0) outOpts.push(e.out);
  outOpts = outOpts.filter(function(n){ return n !== e['in']; }).sort();
  var opt = function(list, cur){
    return list.map(function(n){
      return '<option value="' + esc(n) + '"' + (n === cur ? ' selected' : '') + '>' + esc(n)
        + '</option>';
    }).join('');
  };
  showHelp('Put This Trade Right', head
    + '<p class="note"><b>Taking it back undoes this one trade and nothing else.</b> '
    + esc(e.out || 'Nothing') + ' goes back on the roster, ' + esc(e['in'] || 'nothing')
    + ' comes off, the line disappears from the list and nobody is charged for it. The dashboard '
    + 'works out points from that same list, so the points go back with it.</p>'
    + '<label class="lb" style="margin-top:12px" for="fixWhy">Why You Are Changing It</label>'
    + '<input class="search" id="fixWhy" type="text" style="max-width:100%" '
      + 'placeholder="Type why you are changing this trade">'
    + '<p class="note" id="fixErr" style="margin:6px 0 0"></p>'
    + '<div class="row" style="margin-top:12px">'
    + '<button class="dang" onclick="doTakeBack(' + jq(k) + ')">Take the Trade Back</button>'
    + '</div>'
    + '<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">'
    + '<p><b>Or keep the trade and correct it.</b> Change either side, or both. It stays on week '
    + e.week + ' at the same charge, so nobody pays twice for one correction.</p>'
    + '<label class="lb" for="fixNew">The Team They Got</label>'
    + '<select class="search" id="fixNew" style="max-width:100%">'
      + opt(inOpts, e['in']) + '</select>'
    + '<label class="lb" style="margin-top:10px" for="fixOut">The Team They Gave Up</label>'
    + '<select class="search" id="fixOut" style="max-width:100%">'
      + '<option value="">Nothing \u2014 they gave up no team</option>'
      + opt(outOpts, e.out) + '</select>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="pri" onclick="doFixSwap(' + jq(k) + ')">Save the Correction</button>'
    + '</div>');
}

/* The whole of a take-back, so the replacement path cannot do it differently. */
function _takeBack(e){
  var k = key(e.div, e.owner);
  var r = (S.rosters[k] || []).slice();
  r.splice(r.indexOf(e['in']), 1);
  if (e.out) r.push(e.out);
  S.rosters[k] = r.sort();
  S.acquiredAt = S.acquiredAt || {};
  if (S.acquiredAt[k]) delete S.acquiredAt[k][e['in']];
  if (e.out){
    var was = acqFromLog(e.div, e.owner, e.out, e.when);
    if (was) markGot(k, e.out, was);
    else if (S.acquiredAt[k]) delete S.acquiredAt[k][e.out];
  }
  S.log = (S.log || []).filter(function(x){ return x !== e; });
}

/* NOTHING IS PUT RIGHT IN SILENCE. The trade line is gone from the league's list, which is the
   point of it -- so the record that somebody removed it has to live somewhere, with the reason
   and the name of whoever did it. */
function noteFix(what, why){
  S.fixes = S.fixes || [];
  var me = whoIsThis();
  S.fixes.unshift({when: now(), by: (me && me.seat) || '', what: what, why: why});
}

function _fixWhy(){
  var w = el('fixWhy');
  var why = w ? String(w.value).trim() : '';
  if (!why){
    var err = el('fixErr');
    if (err) err.innerHTML = '<b class="b">Say why.</b> This is recorded beside the change so '
      + 'that anybody reading the list later can see what happened.';
    if (w) w.focus();
    return null;
  }
  return why;
}

function doTakeBack(k){
  var e = fixRow(k); if (!e){ closeHelp(); render(); return; }
  var why = _fixWhy(); if (why === null) return;
  var stop = fixBlocked(e);
  if (stop){ var err = el('fixErr'); if (err) err.innerHTML = stop; return; }
  _takeBack(e);
  noteFix('Took back: ' + e.owner + ' — ' + e['in'] + ' in, ' + (e.out || 'nothing')
          + ' out, week ' + e.week, why);
  save(); closeHelp(); render();
  showHelp('Done', '<p><b>' + esc(e.owner) + '</b> has ' + esc(e.out || 'nothing')
    + ' back and ' + esc(e['in']) + ' is off the roster. The trade is off the list and nobody '
    + 'is charged for it.</p>');
}

function doFixSwap(k){
  var e = fixRow(k); if (!e){ closeHelp(); render(); return; }
  var why = _fixWhy(); if (why === null) return;
  var err = el('fixErr');
  var say = function(m){ if (err) err.innerHTML = '<b class="b">' + m + '</b>'; };
  var selIn = el('fixNew'), selOut = el('fixOut');
  var nIn = selIn ? String(selIn.value || '').trim() : '';
  var nOut = selOut ? String(selOut.value || '').trim() : '';
  if (!nIn){ say('Choose the team they got. To leave them with nothing, use Take the Trade Back.'); return; }
  if (nIn === (e['in'] || '') && nOut === (e.out || '')){
    say('Nothing is changed. Pick a different team on one side, or use Take the Trade Back.');
    return;
  }
  var stop = fixBlocked(e);
  if (stop){ if (err) err.innerHTML = stop; return; }
  var was = {owner: e.owner, div: e.div, 'in': e['in'], out: e.out, week: e.week,
             fee: (typeof e.fee === 'number') ? e.fee : null, fee_note: e.fee_note || ''};
  var k2 = key(was.div, was.owner);
  var keepR = (S.rosters[k2] || []).slice();
  var keepA = JSON.parse(JSON.stringify(S.acquiredAt || {}));
  var keepL = (S.log || []).slice();
  _takeBack(e);
  /* CHECKED AGAINST THE ROSTERS AS THEY ARE AFTER THE TAKE-BACK, which is the state the new
     trade actually lands in. A check against the state the panel was drawn in would let a team
     through that somebody claimed in between. If either half fails, EVERYTHING goes back -- a
     correction that half-applies is worse than one that refuses. */
  var undo = function(){
    S.rosters[k2] = keepR; S.acquiredAt = keepA; S.log = keepL;
  };
  if (freeIn(was.div).indexOf(nIn) < 0){
    undo();
    say(nIn + ' is not free in ' + (DATA.div_names[was.div] || was.div) + ' any more. Close this '
        + 'and open it again to see the teams that are.');
    return;
  }
  var r = (S.rosters[k2] || []).slice();
  if (nOut){
    if (r.indexOf(nOut) < 0){
      undo();
      say(nOut + ' is not on ' + was.owner + '\u2019s roster, so it cannot be the team they gave '
          + 'up.');
      return;
    }
    r.splice(r.indexOf(nOut), 1);
    if (S.acquiredAt[k2]) delete S.acquiredAt[k2][nOut];
  }
  r.push(nIn);
  S.rosters[k2] = r.sort();
  markGot(k2, nIn, today());
  var me = whoIsThis();
  /* THE SAME WEEK AND THE SAME CHARGE. This is the trade they should have had, not a second one,
     so it is not a second fee either. */
  S.log.unshift({when: now(), by: (me && me.seat) || null, div: was.div, owner: was.owner,
                 'in': nIn, out: nOut || '', week: was.week,
                 how: 'put right by the commissioner',
                 fee: was.fee, fee_note: was.fee_note});
  noteFix('Corrected: ' + was.owner + ' \u2014 got ' + (was['in'] || 'nothing') + ', now '
          + nIn + '; gave up ' + (was.out || 'nothing') + ', now ' + (nOut || 'nothing')
          + '; week ' + was.week, why);
  save(); closeHelp(); render();
  showHelp('Done', '<p><b>' + esc(was.owner) + '</b> now has <b class="g">' + esc(nIn)
    + '</b> and gave up <b>' + esc(nOut || 'nothing') + '</b>. It is on the list for week '
    + was.week + ' at the same charge as the trade it replaces.</p>');
}

/* ---- MOVING A TEAM BY HAND ---------------------------------------------------------------
 * Casey, 15 Sep 2026: "I thought we were going to have something where Bob can go in and just
 * move rosters." Not every correction is a trade that went wrong. A team recorded on the wrong
 * seat at the draft, or a swap agreed off the page, is a roster that is simply not right, and
 * there is no line to put right.
 * IT IS STILL A LINE ON THE LIST. A roster that changed with nothing on the Transactions tab to
 * explain it is the thing owners argue about. It goes on at no charge, because it is not a
 * trade anybody made.
 */
function handSeats(){
  var out = [];
  DATA.divisions.forEach(function(d){
    DATA.seats.filter(function(s){ return s.div === d; }).forEach(function(s){
      out.push({v: key(d, s.owner), t: (DATA.div_names[d] || d) + ' · ' + s.owner});
    });
  });
  return out;
}
function openHandMove(){
  var opts = ['<option value="">Choose a seat…</option>'].concat(
    handSeats().map(function(o){ return '<option value="' + esc(o.v) + '">' + esc(o.t)
      + '</option>'; })).join('');
  /* WHICH OF THE TWO TOOLS THIS IS, SAID ON ITS FACE. Casey, 15 Sep 2026: "I don't understand
     how that is different from the Put It Right button next to what has been traded. I'm a
     little confused as to why you'd use one versus the other, and I'm certain Bob will be."
     The difference is whether there is a LINE to put right, so that is the sentence. */
  showHelp('Move a Team by Hand',
    '<p><b>Use this only when no trade caused the problem.</b> A team recorded on the wrong seat '
    + 'at the draft, or a swap two owners agreed between themselves and never entered.</p>'
    + '<p class="note"><b>If a trade on the list is wrong, close this and press Fix on that line '
    + 'instead.</b> Fix knows what that trade was: it puts the roster back the way it stood '
    + 'before it, and takes the charge off with it. This one knows none of that. It changes the '
    + 'roster you name, and it charges nothing, because there is no trade behind it.</p>'
    + '<label class="lb" style="margin-top:10px" for="hmSeat">Whose Roster</label>'
    + '<select class="search" id="hmSeat" style="max-width:100%" onchange="handPick()">'
      + opts + '</select>'
    + '<div id="hmRest"></div>'
    + '<p class="note" id="hmErr" style="margin:6px 0 0"></p>'
    + '<div class="row" style="margin-top:12px">'
    + '<button class="pri" onclick="doHandMove()">Save the Change</button></div>');
}
function handPick(){
  var sel = el('hmSeat'), host = el('hmRest');
  if (!host) return;
  var k = sel ? String(sel.value || '') : '';
  if (!k){ host.innerHTML = ''; return; }
  var div = k.split('|')[0];
  var off = (S.rosters[k] || []).slice().sort();
  var on = freeIn(div);
  host.innerHTML =
    '<label class="lb" style="margin-top:10px" for="hmOff">Take Off the Roster</label>'
    + '<select class="search" id="hmOff" style="max-width:100%">'
    + '<option value="">Nothing — only add a team</option>'
    + off.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('')
    + '</select>'
    + '<label class="lb" style="margin-top:10px" for="hmOn">Put On the Roster</label>'
    + '<select class="search" id="hmOn" style="max-width:100%">'
    + '<option value="">Nothing — only take a team off</option>'
    + on.map(function(n){ return '<option value="' + esc(n) + '">' + esc(n) + '</option>'; }).join('')
    + '</select>'
    + '<label class="lb" style="margin-top:10px" for="hmWhy">Why You Are Changing It</label>'
    + '<input class="search" id="hmWhy" type="text" style="max-width:100%" '
      + 'placeholder="Type why you are changing this roster">';
}
function doHandMove(){
  var err = el('hmErr');
  var say = function(m){ if (err) err.innerHTML = '<b class="b">' + m + '</b>'; };
  var sel = el('hmSeat'); var k = sel ? String(sel.value || '') : '';
  if (!k){ say('Choose whose roster this is.'); return; }
  var off = el('hmOff'), on = el('hmOn'), why = el('hmWhy');
  var o = off ? String(off.value || '') : '', n = on ? String(on.value || '') : '';
  var w = why ? String(why.value).trim() : '';
  if (!o && !n){ say('Choose a team to take off, a team to put on, or both.'); return; }
  if (!w){ say('Say why. It is printed beside the change so anybody reading the list later can see what happened.'); return; }
  var div = k.split('|')[0], owner = k.split('|')[1];
  var r = (S.rosters[k] || []).slice();
  if (o && r.indexOf(o) < 0){ say(o + ' is not on that roster.'); return; }
  if (n && freeIn(div).indexOf(n) < 0){
    say(n + ' is not free in ' + (DATA.div_names[div] || div) + '.'); return;
  }
  /* ELEVEN IS THE ROSTER. Casey's league is 3 NFL and 8 college and nothing else, so a move that
     leaves a seat with ten or twelve is a mistake worth stopping rather than a state to save. */
  var after = r.length - (o ? 1 : 0) + (n ? 1 : 0);
  if (after !== r.length && r.length === (DATA.roster_size || 11)){
    say('That would leave ' + owner + ' with ' + after + ' teams. A roster is '
        + (DATA.roster_size || 11) + '. Take one off and put one on together.');
    return;
  }
  if (o) r.splice(r.indexOf(o), 1);
  if (n) r.push(n);
  S.rosters[k] = r.sort();
  S.acquiredAt = S.acquiredAt || {};
  if (o && S.acquiredAt[k]) delete S.acquiredAt[k][o];
  if (n) markGot(k, n, today());
  var me = whoIsThis();
  S.log.unshift({when: now(), by: (me && me.seat) || null, div: div, owner: owner,
                 'in': n || '', out: o || '', week: weekNo(),
                 how: 'moved by hand by the commissioner', fee: 0, fee_note: w});
  noteFix('By hand: ' + owner + ' — ' + (n || 'nothing') + ' on, ' + (o || 'nothing')
          + ' off', w);
  save(); closeHelp(); render();
}

/* AN IN-PAGE PANEL, NEVER prompt(). The file is opened on a phone inside an app that may not
   draw a native dialog at all -- prompt() returns nothing and the change silently does not
   happen. */
function openFee(k){
  var e = feeRow(k);
  if (!e) return;
  var v = feeOfRow(e);
  showHelp('What This Trade Costs',
    '<p>' + esc(e.owner) + ' \u2014 <b>' + esc(e['in']) + '</b> in, ' + esc(e.out || '\u2014')
      + ' out, week ' + e.week + '.</p>'
    + '<div class="row" style="margin-top:8px">'
    + '<button class="f" onclick="setFee(' + jq(k) + ',' + FEE() + ')">Standard '
      + money(FEE()) + '</button>'
    + '<button class="f" onclick="setFee(' + jq(k) + ',0)">No Charge</button>'
    + '<button class="f" onclick="setFee(' + jq(k) + ',' + (-FEE()) + ')">Credit '
      + money(-FEE()) + '</button></div>'
    + '<label class="lb" style="margin-top:10px" for="feeAmt">Or another amount</label>'
    + '<input class="search" id="feeAmt" type="text" inputmode="text" '
      + 'value="' + esc(String(v)) + '" style="max-width:140px">'
    /* THE LABEL IS NOT A STATEMENT ABOUT THE CURRENT AMOUNT. It read "Why it is not the standard
       $3" while the amount on screen still WAS $3, which is a label contradicting the box beside
       it. It names what the box is for instead, and says when it has to be filled in. */
    + '<label class="lb" style="margin-top:10px" for="feeWhy">Why This Amount</label>'
    + '<p class="note" style="margin:0 0 3px">Only needed if you change it from the standard '
      + money(FEE()) + '. It is printed beside the amount on the Trade Fees tab.</p>'
    + '<input class="search" id="feeWhy" type="text" value="' + esc(e.fee_note || '') + '" '
      + 'placeholder="Type why this is not the standard amount" style="max-width:100%">'
    + '<p class="note" id="feeErr" style="margin:6px 0 0"></p>'
    + '<div class="row" style="margin-top:10px">'
    + '<button class="pri" onclick="saveFee(' + jq(k) + ')">Save</button>'
    + '<button onclick="closeHelp()">Cancel</button></div>');
}
function setFee(k, v){
  var amt = el('feeAmt'); if (amt) amt.value = String(v);
  saveFee(k);
}
function saveFee(k){
  var e = feeRow(k); if (!e) { closeHelp(); return; }
  var amt = el('feeAmt'), why = el('feeWhy');
  var raw = amt ? String(amt.value).trim().replace(/[$,\s]/g, '').replace(/\u2212/g, '-') : '';
  var v = Number(raw);
  var err = el('feeErr');
  /* AN EMPTY BOX IS NOT ZERO. "No charge" is a decision somebody makes; a blank field is a
     question nobody answered, and writing 0 for it would be inventing the decision. */
  if (raw === '' || !isFinite(v)){
    if (err) err.innerHTML = '<b class="b">Type an amount.</b> A blank box is not the same as no '
      + 'charge \u2014 there is a No Charge button for that.';
    return;
  }
  var note = why ? String(why.value).trim() : '';
  /* A CHANGED AMOUNT WITHOUT A REASON IS A NUMBER NOBODY CAN DEFEND LATER. The Transactions tab
     prints the reason beside it, and "no reason was recorded" is what it has to say otherwise. */
  if (v !== FEE() && !note){
    if (err) err.innerHTML = '<b class="b">Say why.</b> This is not the standard '
      + money(FEE()) + ', and the reason is printed beside it on the Transactions tab.';
    if (why) why.focus();
    return;
  }
  e.fee = Math.round(v * 100) / 100;
  e.fee_note = (v === FEE()) ? '' : note;
  save(); closeHelp(); render();
}

function viewRosters(){
  /* ---- NO WAY TO THROW THE SEASON AWAY FROM HERE ------------------------------------------
   * Casey, 15 Sep 2026: "Put the Real Rosters Back -- not sure what that means. What are real
   * rosters? As we go along, the real roster is the real roster from last week, not from the
   * beginning of the draft. And I don't think you'd ever want to throw away every trade the
   * league has run for the entire season. I wouldn't even give that as a button."
   * He is right on both counts. The name named nothing a reader could picture, and the action
   * behind it has no honest use once a week has been settled for real. A control whose only
   * correct number of presses is zero should not be on the page.
   * WHAT HE ACTUALLY NEEDS is already built and is deliberately narrow: Undo the Week, on the
   * Run It tab, which only ever offers THIS week -- `canUndo()` refuses once the week has
   * turned. That matches what he asked for: "he can only undo the current week ... if somebody
   * put in a trade that was missed he could add that trade and rerun."
   */
  var h = '<div class="card"><h2>' + (Store.live() ? 'Rosters' : 'Where the Sandbox Stands')
    + '</h2>'
    + (Store.live()
        ? '<p class="note">Every seat and the eleven teams on it, as the league stands now. '
          + 'Settled trades are already in here.</p>'
          + '<p class="note"><b>To put one trade right, use the Fix button on its line below.</b> '
          + 'It takes that one trade back, or swaps the team for a different one, and leaves '
          + 'every other trade alone.</p>'
          + '<p class="note"><b>To run this Monday again from the start, use Undo the Week on the '
          + 'Run It tab.</b> That puts the rosters back to 4:00pm AZ today and keeps every list '
          + 'exactly as the owners typed it. It only ever offers the current week.</p>'
        : '<p class="note">Started as a copy of the real rosters. Everything below is the result '
          + 'of what you have done in here, and none of it has left this browser.</p>'
          + '<div class="row"><button class="dang" onclick="doReset()">Start This Practice Copy '
          + 'Again</button></div>')
    + '</div>';
  var boss = isCommish();
  h += S.log.length ? '<div class="card"><h2>What Has Moved</h2><div class="scr"><table>'
      + '<colgroup><col style="width:20%"><col style="width:18%"><col style="width:18%">'
      + '<col style="width:' + (boss ? '20' : '44') + '%">'
      + (boss ? '<col style="width:12%"><col style="width:12%">' : '') + '</colgroup>'
      + '<thead><tr><th>Seat</th><th>In</th><th>Out</th><th>How</th>'
      + (boss ? '<th class="num">Cost</th><th>Put Right</th>' : '') + '</tr></thead><tbody>'
      + S.log.map(function(e){
          return '<tr><td>' + esc(e.owner) + '</td><td class="g">'
            + esc(e['in'] || '—') + '</td>'
            + '<td class="d">' + esc(e.out || '—') + '</td><td class="d">wk ' + e.week
            + ' · ' + esc(e.how) + (e.by ? ' · entered by ' + esc(e.by) : '') + '</td>'
            + (boss ? '<td class="num">' + feeCell(e) + '</td>'
                + '<td><button class="f" style="padding:3px 8px;font-size:11px" '
                + 'onclick="openFix(' + jq(feeKeyOf(e)) + ')" '
                + 'title="Take this one trade back, or give the seat a different team instead. '
                + 'Every other trade is left alone.">Fix</button></td>' : '') + '</tr>';
        }).join('') + '</tbody></table></div>'
      + (boss ? '<p class="note">Every trade costs ' + money(FEE()) + ' and the total each owner '
          + 'owes is the sum of these lines. Putting one trade right can take two or three moves, '
          + 'and nobody should be charged three times for one mistake, so a line can be set to '
          + 'nothing or turned into a credit. Anything you change says so on the Transactions '
          + 'tab, with the reason you type.</p>' : '')
      + '</div>'
    : '<div class="card"><div class="empty">Nothing has moved yet. Rosters are exactly as '
      + 'drafted.</div></div>';
  if (boss){
    h += '<div class="card"><h2>Move a Team by Hand</h2>'
      + '<p class="note">Use this when there is no trade to put right. A team recorded on the '
      + 'wrong seat at the draft, or a swap the two owners agreed off the page. It goes on the '
      + 'list at no charge, with the reason you type, so the rosters and the list always agree.'
      + '</p><div class="row"><button class="pri" onclick="openHandMove()">Move a Team</button>'
      + '</div></div>';
    if ((S.fixes || []).length){
      h += '<div class="card"><h2>Corrections Made</h2>'
        + '<p class="note">A trade taken back leaves no line on the list above, which is the '
        + 'point of taking it back. This is where those changes are written down.</p>'
        + '<div class="scr"><table>'
        + '<colgroup><col style="width:22%"><col style="width:44%"><col style="width:34%">'
        + '</colgroup><thead><tr><th>When</th><th>What</th><th>Why</th></tr></thead><tbody>'
        + S.fixes.map(function(f){
            return '<tr><td class="d">' + esc(String(f.when || '').slice(0, 16))
              + (f.by ? '<br>' + esc(f.by) : '') + '</td><td>' + esc(f.what) + '</td>'
              + '<td class="d">' + esc(f.why) + '</td></tr>';
          }).join('') + '</tbody></table></div></div>';
    }
  }
  h += DATA.divisions.map(function(d){
    return '<div class="card"><h2>' + esc(DATA.div_names[d] || d) + '</h2><div class="scr"><table>'
      + '<colgroup><col style="width:28%"><col style="width:72%"></colgroup><tbody>'
      + DATA.seats.filter(function(s){ return s.div === d; }).map(function(s){
          var k = key(d, s.owner);
          return '<tr><td>' + esc(s.owner) + '</td><td class="d">'
            + esc((S.rosters[k] || []).slice().sort().join(', ') || '—') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>';
  }).join('');
  return h;
}
/* RESET IS A DIFFERENT THING ON THE TWO PAGES AND IT SAYS SO. In the practice copy it throws
   away made-up trades in one browser. On the real page it throws away the league's trades for
   everybody, which is a sentence that has to be read before the button is pressed. Casey asked
   for this outright on 12 Sep 2026: he wants to run a real week early, check it, and put it all
   back before Monday. */
function doReset(){
  /* PRACTICE ONLY. The live page no longer offers this at all -- see viewRosters(). */
  if (Store.live()) return;
  var body = '<p>This throws away every trade you have run in the practice copy and loads the '
    + 'drafted rosters again. Nothing here has ever reached the real league.</p>'
    + '<p>Your sign-ins and the access list are kept.</p>';
  showHelp('Start This Practice Copy Again?',
    body
    + '<div class="row" style="margin-top:10px">'
    + '<button class="dang" onclick="reallyReset()">Yes, Start Again</button>'
    + '<button onclick="closeHelp()">Leave It Alone</button></div>');
}
function reallyReset(){
  S.rosters = freshRosters(); S.acquiredAt = {}; S.log = []; S.fixes = [];
  S.results = null; S.requests = {};
  save(); closeHelp(); render();
}

/* ---- boot -------------------------------------------------------------------------------------- */
function seedAccess(){
  return DATA.seats.map(function(s){
    var mine = (DATA.me && s.div === DATA.me.div && s.owner === DATA.me.seat);
    /* CASEY'S OWN SEAT STARTS AS A COMMISSIONER IN THE PRACTICE COPY.
       Casey, 13 Sep 2026: "I no longer see the run it or access or roster tabs on the sandbox
       trade app." Every seat was seeded as an owner, so the moment those two tabs became the
       commissioner's, nothing in the practice copy was one -- and the Access List, the one place
       a role can be changed, is itself a commissioner tab. A LOCKOUT. Testing the commissioner's
       side is most of what the practice copy is for, so the seat he signs in on starts as one.
       In the real league the role is the Role column of the spreadsheet and nothing else. */
    /* EVERY SEAT HAS A CODE FROM THE START, because in the real league the commissioner issues
       them all at once and hands them out. There is nothing to request. */
    return {div: s.div, seat: s.owner, email: practiceEmail(s.owner),
            code: code6(), status: 'active', validAfter: '',
            role: mine ? 'commissioner' : 'owner'};
  });
}
function blank(){
  return {clock: rightNow(), device: 'A', devices: {}, tokens: {}, links: [], seq: 0,
          /* THE DIVISION SPELLINGS, CARRIED WITH THE STATE ON PURPOSE. The spreadsheet says
             "Predator" and everything in the program says "PFD". The script on the sheet has to
             agree with this page about which is which, and the only way to guarantee that is for
             the page to say so once rather than for both to keep a list. Same fault this page hit
             on its own Access join; same answer. */
          divCodes: divCodeTable(),
          access: seedAccess(), former: [], requests: {}, rosters: freshRosters(),
          acquiredAt: {}, log: [], accessLog: [], fixes: [],
          results: null, seed: 'RFL-SANDBOX', actingAs: null, autoPeloton: true, ranWeeks: {}, claimQueue: [], lastEmail: ''};
}
/* THE SAVE LIGHT. On the real one this is the reader's only way of knowing their trade reached
   the league rather than their own browser, so it says which, in words, at all times. */
function saveLight(st, why){
  var b = el('savechip');
  if (!b) return;
  if (!Store.live()){ b.hidden = true; return; }
  /* NOTHING WHEN IT IS WORKING. Casey, 13 Sep 2026: "why do we need the Saved to League sheet.
     End users aren't going to understand that and I don't either." He is right: a light that is
     on whenever everything is fine is a light nobody reads, and it raises a question about
     machinery the reader should never have to think about. It appears only when something has
     gone wrong, which is the only time it tells anybody anything. */
  var say = {offline: ['b', 'Not Saved'], stale: ['b', 'Reloaded'], nokey: ['b', 'Sign In Needed']};
  var m = say[st];
  if (!m){ b.hidden = true; b.textContent = ''; return; }
  b.hidden = false;
  b.className = 'chip ' + m[0];
  b.textContent = m[1];
  if (st === 'nokey'){
    b.title = 'This device has not signed in, so the league will not answer it. Ask for a '
            + 'sign-in link on the Sign In tab.';
    return;
  }
  b.title = st === 'offline'
    ? 'The league could not be reached, so this change is still only on this device. '
      + 'It will be sent again by itself. ' + (why || '')
    : (st === 'stale'
        ? 'Somebody else changed this while you had it open, so what you are looking at was '
          + 'reloaded from the league.'
        : 'Everything on this page is stored in the league.');
}

/* ASKING FOR THE KEY. Typed once per device and remembered by that browser. It is never in the
   page, because the page's source can be read by anybody who opens it, and this key is what
   stands between an owner and the whole Access tab. */
/* NOBODY IS SIGNED IN ON THIS DEVICE. SHOW THE SIGN-IN, NOT A DIALOG.
 *
 * This used to open a panel asking for a COMMISSIONER KEY, read off the Settings tab of a Google
 * spreadsheet. There is no spreadsheet and no such key, and an owner never had one to begin with.
 * Casey, 14 Sep 2026, on the live page: "I went to the Trades tab because I thought I should
 * be putting in that code you provided me, and it still asked me for a commissioner key."
 *
 * There is one way in now and it is the same for all 33 people: type the six characters your
 * commissioner gave you. So the answer to "this device is not signed in" is the Sign In tab
 * itself, with the box already on it, rather than a dialog over the top of it asking for
 * something that does not exist.
 */
function askForKey(){
  closeHelp();
  LIVE_ME = null;
  setTab('signin');
}

/* SAYING SO WHEN THE SPREADSHEET AND THE PAGE DO NOT AGREE ABOUT A SEAT. */
function accessWarning(){
  if (!Store.live() || !ACCESS_JOIN) return '';
  if (ACCESS_JOIN.matched >= ACCESS_JOIN.rows) return '';
  return '<div class="card warn"><h2>Some Rows of the Access List Do Not Match a Seat</h2>'
    + '<p>The league has <b>' + ACCESS_JOIN.rows + '</b> people on its access list and <b>'
    + ACCESS_JOIN.matched + '</b> of them line up with a seat in this league. Any row that does '
    + 'not match is ignored, so the email address and the role on it do nothing.</p>'
    + '<p>A row only counts when its division and seat read exactly as the league spells them. '
    + 'Tell Casey which rows do not match and he can correct them.</p></div>';
}

/* THE OPTIONS THE STORE BOOTS WITH, IN ONE PLACE. Reading the access list again after a
   retire has to boot with the SAME options, and a second copy of them is a second copy of
   one fact. */
function bootOpts(){
  return {
    api: (DATA.api || null),
    get: function(){ return S; },
    set: adopt,
    blank: blank,
    access: adoptAccess,
    accessLog: function(L){ LIVE_LOG = L || []; },
    status: saveLight,
    /* THE LOAD ALREADY KNOWS WHO THIS IS, so `refreshMe` is skipped after it. */
    whoami: function(a){ LIVE_ME = {ok: true, me: a.me}; },
    needKey: askForKey,
    ready: function(stuck){
      if (!S) adopt(null);
      render();
      /* THE WEEK'S ANSWER, ONCE THE PAGE KNOWS WHO THIS IS. It has to be after the load, because
         before it there is no seat to look the answer up under. Not shown when the page could not
         be reached -- there would be nothing behind it, and a panel over a broken page is worse
         than the broken page. */
      if (!stuck) { try { offerResult(); } catch (e) {} }
      if (stuck) showHelp('The League Could Not Be Reached',
        '<p>This page keeps everything with the league, and it could not reach it just now. '
        + 'Nothing you do here will be saved until it can.</p>'
        + '<p>Check that you are online, then reload the page. If it keeps happening, tell '
        + 'Casey.</p>'
        + '<p class="note">' + esc(Store.why()) + '</p>');
    }
  };
}

function boot(){
  /* WHO THIS DEVICE IS, ASKED BEFORE ANYTHING IS DRAWN. The tabs depend on the answer, and a
     page that drew an owner's tabs and then added the commissioner's a second later would be
     worse than one that waited. */
  if (Store.live() && Store.key() && LIVE_ME === null){
    refreshMe(function(){ boot(); });
    return;
  }
  Store.boot(bootOpts());
}
buildRulesNote();
/* A LINK FROM AN EMAIL IS HANDLED BEFORE THE PAGE ASKS WHO IT IS, because redeeming the link is
   what makes there be an answer. */
if (!redeemFromUrl()) boot();
/* SAY HELLO TO WHATEVER IS HOLDING THIS PAGE. The dashboard answers with `barhost` and then owns
   the action bar. Nothing answers when this page is opened on its own, or when the dashboard is
   an older copy, and the bar stays here. */
try {
  if (window.parent && window.parent !== window){
    window.parent.postMessage({rfl: 'hello'}, '*');
  }
} catch (e) {}
</script>
</body></html>
