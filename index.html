    none of this touches Live scores, Standings or Slots, which are made of results that happened
    rather than projections.`);
}

function windowPts(team, from, n){
  let pts = 0, gs = 0, first = null;
  for (const g of (team.sched || [])){
    if (g.bye || g.ep == null) continue;
    if (from && g.d <= from) continue;
    if (first === null) first = g.d;
    pts += g.ep; gs++;
    if (n != null && gs >= n) break;
  }
  return {pts: Math.round(pts * 100) / 100, games: gs, first};
}

/* THE "THEN" COLUMN IS A RECOMMENDATION, SO IT HAS TO ANSWER THE QUESTION BEING ASKED.
   Casey, 30 Aug 2026: "you have the Jets THEN column as keep. But currently their gain is
   negative, so should that not say KEEP but instead something AVOID. I read that column as a
   recommendation."

   He read it exactly as it looks, and it was answering a different question: how long a team is
   worth holding ONCE YOU HAVE IT, computed at build time against a generic streaming baseline.
   That is a real quantity and a useless one here — it told him to keep a team all season while
   the column beside it said the swap loses points. Two cells, one row, opposite advice.

   Now it is computed from the same comparison as everything else on the tab: against the team
   he selected, over the same dates, and it recomputes when he changes that selection.
     * If the best achievable gain is not positive, the answer is AVOID — however long the team
       would be "worth keeping" in the abstract, making this swap costs points.
     * Otherwise it names the hold length that maximises the gain, which is the honest answer to
       "how long should I keep it": as long as it out-earns the team I gave up. */
function ptsUpTo(team, from, through){
  let p = 0;
  for (const g of (team.sched || [])){
    if (g.bye || g.ep == null) continue;
    if (g.d <= from || g.d > through) continue;
    p += g.ep;
  }
  return p;
}

/* HAS THIS TEAM EARNED THE BENEFIT OF THE DOUBT YET? Casey, 30 Aug 2026:
   "There is no way I would take that team and keep them at after the first three weeks of the
    season. Only when they have proven themselves about halfway through the season and gotten
    past their tough games against the bigger college teams would I feel comfortable to take
    them and keep them... Only if an available team upsets a favored team or does it more than
    once would I consider that the preseason rankings were wrong."

   So a long hold is a claim about a team's TRUE strength, and in August the only evidence for
   that claim is the same preseason rating that priced the three games — which means a long
   hold is not extra information, it is the same guess extended over more weeks, where it is
   least reliable. This compares points actually banked against what the model expected of the
   same games. Positive means the season has said something the preseason did not. */
const EVID_GAMES = 2;      // one upset is a game; two is a pattern, and he said so
const EVID_EDGE  = 0.5;    // half a league point clear of billing, over those games

function form(t){
  const got = SEASON ? SEASON.get(t.n) : null;
  if (!got || !got.n) return {games: 0, actual: 0, expected: 0, edge: 0, proven: false};
  const cum = t.exp_cum || [];
  const k = Math.min(got.n, cum.length);
  const expected = k ? cum[k - 1] : 0;
  const edge = got.pts - expected;
  return {games: got.n, actual: got.pts, expected, edge,
          proven: got.n >= EVID_GAMES && edge >= EVID_EDGE};
}

/* THREE LIKELY WINS IS NOT A LIKELY 3-0. Casey, 30 Aug 2026: "Why does Harvard only have a 36%
   chance of go 3-0 when I select south carolina to drop. You have harvard with three games where
   each game probability is 69% or above, so I would think the 3-0 percentage would be much
   higher."
   The arithmetic is right and the surprise is real: 0.74 x 0.69 x 0.70 = 0.36. Probabilities
   multiply, so three games that each look comfortable come to about a third. Rather than defend
   the number, the tooltip now SHOWS the multiplication, and says the thing that actually matters
   -- you are not paid for 3-0, you are paid per win, which is what Bank 3 measures. */
/* NOTHING IS CERTAIN. Casey, 31 Aug 2026: "You have Virginia Tech as 100% win probability
   against VMI in the compare tool. Can there really be 100% probability as I would think there
   is always a 1% chance that an upset could happen."
   He is right and the model cannot see it. Win probability here is Phi(margin / sigma) and
   nothing else: it prices ON-FIELD strength and has no term for a hurricane, a bus crash, a
   forfeit, a flu sweeping a roster, or a referee. Two games in this build price at a literal
   1.0000 (Indiana-Howard, Oregon-Portland State) and 44 more round to 100%. A board that prints
   100% is asserting something no projection can support -- and a preseason rating cannot tell
   99.9% from certainty in any case.
   So probabilities are CLAMPED FOR DISPLAY at 1%-99%. The underlying number is untouched: the
   expected-points columns still use the model's own value, because clamping those would move
   real points on the strength of a presentation rule. */
const P_FLOOR = 0.01, P_CEIL = 0.99;
function pctP(p){
  if (p == null) return '—';
  if (p >= P_CEIL) return '>99%';
  if (p <= P_FLOOR) return '<1%';
  return pct(p);
}

function p30Why(t, from, x){
  const w0 = weekOf(t.pool, from);
  const bits = [];
  for (let i = 0; i < (x.weeks || DATA.hold_games); i++){
    const gs = (t.sched || []).filter(g => g.d && !g.bye && g.d > from
                                        && weekOf(t.pool, g.d) === w0 + i);
    bits.push(gs.length ? gs.map(g => pctP(g.p) + ' ' + g.opp).join(' + ')
                        : 'BYE — no game, banks nothing');
  }
  const head = `Three weeks of your roster slot: ${bits.join('  x  ')}.`;
  if (x.byes)
    return `${head}  A bye week cannot be won, so a clean sweep is off the table — this team `
         + `takes ${DATA.hold_games} weeks of the slot and only plays ${x.games} of them. `
         + `It still banks ${x.pts.toFixed(2)}; judge it on that, not on the sweep.`;
  return `${head}  =  ${pctP(x.p)}. Win probabilities MULTIPLY, so three games that each look `
       + `comfortable still come to about a third. You are not paid for a sweep, you are paid `
       + `per win — which is what Bank 3 measures.`;
}

/* HOW MANY WEEKS TO HOLD IT, MEASURED THE SAME WAY THE COLUMNS BESIDE IT ARE.

   Casey, 31 Aug 2026: "For the DO column, this seems to be only tied to a season recommendation
   and not the bank 3."
   He was reading a real inconsistency. This function counted GAMES and compared the candidate's
   next three GAMES against whatever the incumbent happened to play up to that date, while Gain 3
   two columns to its left compared three WEEKS against three WEEKS. All 120 college rows
   disagreed, and California disagreed in SIGN: the advice said "+0.67, hold it 3" beside a
   Gain 3 of -0.29. One row, two windows, opposite answers.

   Now both sides of every comparison are `weekWindow` over the SAME number of weeks, so the
   shortest recommendation's gain is Gain 3 exactly, and every longer one is the same arithmetic
   over a longer span.

   THE LEGAL MINIMUM IS STILL THREE GAMES. A bye does not advance the hold, so a team with one in
   its opening stretch needs FOUR weeks to complete three games -- that is the shortest span this
   may recommend for that team, and the label says how many weeks it is. */
function minHoldWeeks(t, from){
  let games = 0, wk = 0;
  const w0 = weekOf(t.pool, from);
  while (wk < 26){
    const gs = (t.sched || []).filter(g => g.d && !g.bye && g.d > from
                                        && weekOf(t.pool, g.d) === w0 + wk);
    wk++;
    games += gs.length;
    if (games >= DATA.hold_games) return wk;
  }
  return null;                       // cannot complete the hold before the season ends
}

function weeksLeft(t, from){
  let last = 0;
  const w0 = weekOf(t.pool, from);
  for (const g of (t.sched || []))
    if (g.d && !g.bye && g.d > from) last = Math.max(last, weekOf(t.pool, g.d) - w0 + 1);
  return last;
}

function recommend(t, inc, minEdge){
  minEdge = minEdge == null ? 0.15 : minEdge;
  const from = swapFrom(inc);
  const mine = BY.get(inc.n);
  const minW = minHoldWeeks(t, from), maxW = weeksLeft(t, from);
  if (!mine || !minW)
    return {label: '—', cls: 'v-no', gain: null,
            tip: `Not enough games left for ${t.n} to complete the ${DATA.hold_games}-game hold.`};

  const gainAt = w => {
    const a = weekWindow(t, from, w), b = weekWindow(mine, from, w);
    return {w, gain: Math.round((a.pts - b.pts) * 100) / 100,
            games: a.games, byes: a.byes};
  };
  let best = null;
  for (let w = minW; w <= maxW; w++){
    const g = gainAt(w);
    if (best === null || g.gain > best.gain + minEdge) best = g;
  }
  const mand = gainAt(minW);
  const span = x => `${x.w} week${x.w === 1 ? '' : 's'}` +
    (x.byes ? ` (${x.games} game${x.games === 1 ? '' : 's'}, ${x.byes} bye)` : '');

  if (!best || best.gain <= 0)
    return {label: 'AVOID', cls: 'v-avoid', gain: mand.gain,
            tip: `Every length loses points against ${inc.n}. The best this swap ever gets is `
               + `${best ? (best.gain >= 0 ? '+' : '') + best.gain.toFixed(2) : '—'} over `
               + `${best ? span(best) : '?'}, so do not make it.`};

  /* THE EVIDENCE GATE, unchanged in spirit: a hold longer than the legal minimum is a claim that
     this team is better than its preseason rating, and only the season can support that. */
  const f = form(t);
  const longer = best.w > minW;
  if (longer && !f.proven){
    if (mand.gain <= 0)
      return {label: 'AVOID', cls: 'v-avoid', gain: mand.gain, upside: best,
              tip: `Over the ${span(mand)} you must hold it, this swap loses `
                 + `${mand.gain.toFixed(2)} against ${inc.n}. Holding ${span(best)} turns positive `
                 + `(+${best.gain.toFixed(2)}) on PRESEASON ratings alone, and this team has `
                 + `${f.games ? `played ${f.games} and is ${f.edge >= 0 ? '+' : ''}${f.edge.toFixed(2)} `
                    + `against its billing` : 'not played yet'} — no evidence for the longer bet.`};
    return {label: `${minW}w`, cls: 'v-stream', gain: mand.gain, weeks: minW, upside: best,
            capped: true,
            tip: `Bank the ${span(mand)} you have to hold it anyway: ${mand.gain >= 0 ? '+' : ''}`
               + `${mand.gain.toFixed(2)} over ${inc.n} — the same number as Gain 3 when there is `
               + `no bye. Holding ${span(best)} projects +${best.gain.toFixed(2)}, but that rests `
               + `on the SAME preseason rating stretched further out. `
               + `${f.games ? `${f.games} game${f.games === 1 ? '' : 's'} played, `
                  + `${f.edge >= 0 ? '+' : ''}${f.edge.toFixed(2)} against billing`
                  : 'No games played yet'} — needs ${EVID_GAMES}+ games and +${EVID_EDGE.toFixed(2)} `
               + `to be advised as a keeper.`};
  }
  const last = best.w >= maxW;
  return {label: last ? 'KEEP' : `${best.w}w`, weeks: best.w,
          cls: last ? 'v-keep' : (best.w > minW ? 'v-hold' : 'v-stream'),
          gain: best.gain, proven: longer,
          tip: `Hold it ${span(best)}` + (last ? ' — to the end of the regular season' : '')
             + `, where the gain over ${inc.n} peaks at +${best.gain.toFixed(2)}.`
             + (longer ? ` Advised past the minimum because this team has EARNED it on the field: `
                 + `${f.games} games played, ${f.edge >= 0 ? '+' : ''}${f.edge.toFixed(2)} against `
                 + `what the model expected.`
               : ` Both sides of that number are the same ${best.w} weeks, so it is the swap's `
                 + `real worth over the stretch you are committed to.`)};
}

function dropSelector(kind){
  const list = (DATA.my_slots || []).filter(x => (x.pool === 'NFL') === (kind === 'NFL'));
  if (!list.length) return '';
  const sel = slotFor(kind);
  return `<div class="bar"><label class="d" style="align-self:center;font-size:12px">
      I would drop</label>
    <select class="search" data-role="drop" data-pool="${kind}"
      onchange="setDrop('${kind}', this.value)"
      aria-label="Choose which of your teams to compare against">
      ${list.map(x => { const t = BY.get(x.n), f = swapFrom(x);
        const b3 = t && f ? weekWindow(t, f, DATA.hold_games).pts : x.bank3;
        const rs = t && f ? windowPts(t, f, null).pts : x.rest;
        return `<option value="${x.n}" ${sel && sel.n === x.n ? 'selected' : ''}>${x.n} — free after ${x.third_game.slice(5)} · next 3: ${b3.toFixed(2)} · rest: ${rs.toFixed(2)}</option>`; }).join('')}
    </select></div>`;
}

function availTable(kind){
  const want = kind === 'NFL' ? (t => t.pool === 'NFL') : (t => t.pool !== 'NFL');
  const inc = slotFor(kind);
  if (!inc) return '<div class="empty">You hold no team of this kind.</div>';
  const from = swapFrom(inc);              // the Tuesday the trade window closes
  const mine = BY.get(inc.n);
  const HOLD_WKS = DATA.hold_games;        // three games' worth of roster slot = three weeks
  const incB3 = mine ? weekWindow(mine, from, HOLD_WKS) : {pts: 0, games: 0, byes: 0, p: null};
  const incRest = mine ? windowPts(mine, from, null) : {pts: 0, games: 0};

  let list = DATA.teams.filter(t => t.owner == null && want(t) && t.claim_ok)
    .map(t => {
      const b = weekWindow(t, from, HOLD_WKS);
      const r = windowPts(t, from, null);
      /* Both sides of the gain are the SAME three weeks, so a bye on either side costs its
         owner a week and the difference is a like-for-like number. */
      return {t, b, r, p30: b.p,
              gain3: b.weeks ? b.pts - incB3.pts : null,
              gainR: r.games >= DATA.hold_games ? r.pts - incRest.pts : null,
              skipped: (t.sched || []).filter(g => !g.bye && g.ep != null && g.d <= from).length};
    })
    .filter(x => x.gain3 != null)
    .sort((a, b) => b.gain3 - a.gain3);
  if (PQ){ const q = PQ.toLowerCase(); list = list.filter(x => x.t.n.toLowerCase().includes(q)); }
  const shown = list.slice(0, kind === 'NFL' ? 8 : 25);
  if (!shown.length) return `<div class="empty">${PQ
    ? `No available ${kind === 'NFL' ? 'NFL' : 'college'} team matches “${PQ}”.`
    : `No ${kind === 'NFL' ? 'NFL' : 'college'} team can finish a ${DATA.hold_games}-game hold
       from ${from}, which is when ${inc.n}'s slot frees up.`}</div>`;

  /* THE HINT GOES ABOVE THE TABLE, not below it. Casey, 31 Aug 2026: a note at the bottom
     of a long table is only found by the reader who has already scrolled past the thing
     it was meant to explain. It sits ahead of the scroll container so it does not scroll
     sideways with the table it is describing. */
  return `<div class="scrhint"><b>Swipe</b> the table sideways to see Bank 3, Season pts and Season gain.</div>
    <div class="scr" data-avail="${kind}"><table>
    <!-- The Cmp column is a FIXED pixel width, not a percentage: it holds a 26px control and a
         percentage of a narrow phone table is smaller than the button inside it. -->
    <!-- WIDTHS LIVE IN CSS, NOT IN style ATTRIBUTES, because three of these columns are hidden
         on a phone and the eight percentages written for a laptop then do not describe the five
         that survive. An inline width cannot be re-stated by a media query; a class can. This is
         the same trap as "CSS cannot override a colgroup" -- it cannot, so the colgroup itself
         has to change. -->
    <!-- THE CLASSES ARE POSITIONS, NOT COLUMNS, and that is deliberate. A <td> with
         display:none is removed from its row, so on a phone this table draws FIVE cells and
         they map to the first FIVE <col> elements in order. Naming these after columns
         (cg-bank, cg-gain) made the small-screen rules read as if they sized Bank 3 and Gain 3
         when they were really sizing whatever landed in slots 4 and 5. -->
    <colgroup><col class="cg1"><col class="cg2"><col class="cg3"><col class="cg4">
      <col class="cg5"><col class="cg6"><col class="cg7"><col class="cg8"></colgroup>
    <thead><tr><th class="c-cmp" title="Add this team to Side by side, above. Two at a time; tap again to remove.">Cmp</th>
      <th class="c-team">Team</th>
      <th class="num c-p30" title="Probability it wins all three games of the mandatory hold — the same three games Bank 3 adds up, starting from ${from}, the day ${inc.n}'s slot frees up. Changing the team above changes this.">3-0</th>
      <th class="num c-bank" title="Expected league points over its first three games from ${from}. Games it plays before then belong to its current owner and are not counted.">Bank 3</th>
      <th class="num c-gain" title="Bank 3 minus what ${inc.n} earns over its own next three games from the same date — what the swap is worth over the MANDATORY hold. The Do column carries the gain at its own recommended length, which can be larger.">Gain 3</th>
      <th class="num c-season hide-s" title="Expected points from ${from} to the end of the regular season.">Season<br>pts</th>
      <th class="num c-sgain hide-s" title="Season points minus what ${inc.n} earns over the same stretch. Casey, 31 Aug 2026: a column called just Gain beside one called Gain 3 says nothing about which is which.">Season<br>gain</th>
      <th class="c-then" title="How long to hold this team. AVOID means every length loses points against ${inc.n}. Otherwise it is the number of WEEKS where the gain over ${inc.n} peaks — the same weeks Gain 3 measures, so the shortest recommendation and Gain 3 are the same number. A team with a bye in its opening stretch needs 4 weeks to play its 3 games, so its minimum reads 4w. Recomputed when you change the team above.">Advice</th></tr></thead><tbody>` +
    shown.map(x => {
      const t = x.t, rec = recommend(t, inc);
      const g3 = x.gain3, gr = x.gainR;
      /* EVERY ROW CARRIES A +. It used to appear only where the swap was already legal, which
         meant that on a cold open -- comparison defaulting to a college team -- the whole NFL
         list showed inert dots, and the reason was hidden in a tooltip. Casey, 31 Aug 2026:
         "there is no best available listed underneath there for me to compare Cincinnati to."
         A slot is still pool-typed; that is now handled by the TAP switching the comparison to
         his slot of that pool, rather than by refusing it. */
      const cs = cmpSlotOf(t.n);
      const other = cmpMine() && cmpPool(cmpMine()) !== cmpPool(t);
      return `<tr class="clickable" onclick="toggleTeam('${t.n.replace(/'/g, "\\'")}')"
          title="Click for every game, the win probability for each, and which of them you would actually own.">
        <td class="c-cmp"><button class="cbtn ${cs ? 'on' : ''}" data-cmp="${t.n}"
            onclick="event.stopPropagation();cmpPick('${t.n.replace(/'/g, "\\'")}')"
            title="${cs ? 'Remove ' + t.n + ' from Side by side'
              : other ? 'Compare ' + t.n + ' — this is ' + (t.pool === 'NFL' ? 'an NFL' : 'a college')
                        + ' team, so Side by side switches to your ' + (t.pool === 'NFL' ? 'NFL' : 'college')
                        + ' slot (' + (slotFor(t.pool === 'NFL' ? 'NFL' : 'COL') || {n: 'one of yours'}).n + '), because a slot can only be filled by its own kind'
                      : 'Compare ' + t.n + ' against ' + cmpMine().n + ', in Side by side above'}"
            aria-label="${cs ? 'Remove' : 'Add'} ${t.n} ${cs ? 'from' : 'to'} the comparison">${cs || '+'}</button></td>
        <td class="c-team"><span class="pill p-${t.pool.toLowerCase()}">${t.pool}</span> <b>${t.n}</b>
          <span class="d" style="font-size:11px">▸</span></td>
        <td class="num c-p30 ${x.b.byes?'b':x.p30==null?'d':x.p30>=0.5?'g':x.p30>=0.25?'y':'b'}"
            title="${x.p30==null ? 'No games left in this window.' : p30Why(t, from, x)}">${
          x.b.byes ? `<span class="pill v-avoid">BYE</span>` : pctP(x.p30)}</td>
        <td class="num c-bank">${x.b.pts.toFixed(2)}</td>
        <td class="num c-gain"><b class="${g3 > 0.3 ? 'g' : g3 < 0 ? 'b' : 'y'}">${g3 >= 0 ? '+' : ''}${g3.toFixed(2)}</b></td>
        <td class="num d c-season hide-s">${x.r.pts.toFixed(2)}</td>
        <td class="num c-sgain hide-s"><span class="${gr > 0.5 ? 'g' : gr < 0 ? 'b' : 'd'}">${gr == null ? '—' : (gr >= 0 ? '+' : '') + gr.toFixed(2)}</span></td>
        <td class="c-then"><span class="pill ${rec.cls}" title="${rec.tip}">${rec.label}</span>${
          rec.gain != null && rec.label !== 'AVOID' && rec.label !== '—'
            ? `<span class="recg ${rec.gain > 0 ? 'g' : 'b'}" title="LEAGUE POINTS — what the swap is worth over ${inc.n} across the weeks named above, counting both teams over the SAME weeks. Not a percentage and not a rating. When the advice is the minimum hold and there is no bye, this is Gain 3 exactly.">${rec.gain >= 0 ? '+' : ''}${rec.gain.toFixed(2)}</span>`
            : ''}</td></tr>`
        + (OPEN === t.n ? `<tr><td colspan="8">${teamPanel(t, inc)}</td></tr>` : '');
    }).join('') + '</tbody></table></div>'
    + explain('How to read this table', `Every number in it is
        <b>league points</b> — wins 1.0, ties 0.5, a 40+ NFL or 50+ college win 0.5, a shutout
        0.5 — except <b>3-0</b>, which is a probability.
        <b>3-0</b> is the chance this team wins all three games of the mandatory hold.
        <b>Bank 3</b> is the points those same three games are worth on average, which is why it
        can be well above 3-0 would suggest: you score for each win separately, and a team can be
        likely to win two of three without being likely to win all three.
        <b>Gain 3</b> is Bank 3 minus what ${inc.n} earns over the same stretch.
        <b>Advice</b> is how long to hold it, in <b>weeks</b>, and the small number under it is
        the gain over exactly those weeks — both teams measured over the same ones. When the
        advice is the shortest legal hold and there is no bye, that number <b>is</b> Gain 3.
        A team with a bye in its opening stretch needs four weeks to play three games, so its
        shortest advice reads <b>4w</b> and its number covers four weeks rather than three.
        <br><b>Longer holds have to be earned.</b> A recommendation past ${DATA.hold_games} games
        is a claim that this team is better than its preseason rating, so it is only advised once
        the team has played at least ${EVID_GAMES} games and banked at least
        +${EVID_EDGE.toFixed(2)} more than the model expected of it. Until then you see
        <b>${DATA.hold_games}g</b> and the longer figure sits in the tooltip as upside, not
        advice — which is the whole reason a team with an easy October does not get recommended
        as a keeper in August.`)
      + explain(`What dropping ${inc.n} costs you`, ` Its slot frees up
        after its third game on ${inc.third_game.slice(5)}, so a replacement first plays for you
        on <b>${from.slice(5)}</b>. ${inc.n} would earn <b>${incB3.pts.toFixed(2)}</b> over its
        own next three games from that date and <b>${incRest.pts.toFixed(2)}</b> to the end of
        the season — those are what you give up, and <b>Gain</b> is the difference.
        Change the team above and every number here changes with it.`);
}

function toggleTeam(n){ OPEN = (OPEN === n) ? null : n; renderPick(); }
let OPEN_MINE = null;
function toggleMine(n){ OPEN_MINE = (OPEN_MINE === n) ? null : n; renderPick(); }

/* THE GAME-BY-GAME PANEL. Casey, 30 Aug 2026: "can you make it so I can click on the team and
   see the schedule with your probability by game and any game by game analysis that I can click
   into? It would also be good to see vegas lines for each game if available."
   AVAILABLE is load-bearing: there are 97 posted college lines in this build, collected on one
   date and nearly all week 1. Every other game says so rather than showing a blank that reads
   as "even money". */
function teamPanel(t, inc, mode){
  /* WHICH GAMES WOULD I ACTUALLY OWN? Casey, 30 Aug 2026: "it looks like you aren't determining
     the Not Yours correctly. For example, East Carolina only has Alabama marked as Not Yours. I
     won't have a slot available until after 9/19, so the first three games for East Carolina
     should be labeled as not yours."

     He was right twice over. The cut-off was the date of a third game rather than the day AFTER
     it, so it fell a week early; and it was a single league-wide date rather than one that
     follows the team he would actually drop. Both now come from `inc`, the selected team, so
     picking Nebraska instead of South Dakota St moves the line from 19 Sep to 26 Sep and the
     labels move with it.

     "NOT YOURS" is gone as a label. It read as a judgement about the team rather than a
     statement about the calendar. */
  /* AN OWNED TEAM IS NOT A PICKUP. Casey, 30 Aug 2026: "I need to be able to click on my team
     like nebraska and see the schedule with games played and remaining with individual games
     projections like you have on the available team. This way I can see what they have upcoming
     and how they have performed to date to compare to the team I might be picking up."
     Same panel, same numbers, but the two labels that only make sense for a pickup are wrong
     here: every remaining game is already his, and the three MUST HOLD games are behind him or
     fixed by the draft, not by a swap he is about to make. */
  const own = mode === 'mine';
  /* Same date the table uses, or the panel's green/red line contradicts the numbers above it. */
  const from = own ? null : swapFrom(inc);
  const hi = holdIndexFrom(t, from);
  const ownSlot = own ? (DATA.my_slots || []).find(x => x.n === t.n) : null;
  const past = (t.hist || []).map(g => {
    /* Ask the LIVE index before admitting ignorance. Unknown stays a real, printed state --
       but only when the page genuinely does not have the score, not when it has it two tabs
       away in the scoreboard. */
    const sc = g.nc ? '<span class="d">no contest</span>'
      : g.unknown ? scoreOrNot(t.n, g.d)
      : `<span class="fin ${g.won ? 'g' : 'b'}">${g.won ? 'W' : 'L'} ${g.pf}–${g.pa}</span>`;
    /* ONE CELL PER COLUMN. Casey, 31 Aug 2026: "when I expand them under my roster on the
       pickups tab, the win seventy to seven is shifted far left and is not aligned to any
       column... in the compare tool it aligns in the same column. So that actually makes sense.
       So it's just when I'm looking at the roster."
       It was `colspan="3"`, so the score sat at the LEFT edge of a cell three columns wide and
       lined up with nothing. A merged cell is not a column. Each played game now fills the same
       three columns a future game does -- and it can, because the model's PRE-GAME price for a
       played game is kept (`pre_m`, `pre_p`), which is more useful here than a blank: it says
       what was expected of them before they went out and did it. */
    const line = g.pre_m == null ? '<span class="d">—</span>'
      : (g.pre_m > 0 ? '−' : '+') + Math.abs(g.pre_m).toFixed(1);
    const vg = g.vg == null ? '<span class="nolink">not posted</span>'
      : `<span class="vg">${g.vg > 0 ? '−' : '+'}${Math.abs(g.vg).toFixed(1)}</span>`;
    return `<tr class="g-past"><td>${when(g.when, t.pool)}</td>
      <td>${g.loc === 'Home' ? 'vs' : g.loc === 'Away' ? 'at' : 'vs'} ${g.opp}
        <span class="gtag t-past">PLAYED</span></td>
      <td class="num" title="${g.pre_p != null
        ? `The model gave them ${pctP(g.pre_p)} beforehand. This column holds the FINAL SCORE once a game is played and the win probability before it.`
        : 'Final score.'}">${sc}</td>
      <td class="num d c-model" title="What the model made this game before it was played.">${line}</td>
      <td class="num">${vg}</td></tr>`;
  }).join('');

  let owned = 0;
  const rows = (t.sched || []).map((g, i) => {
    if (g.bye) return `<tr><td class="d">${when(g.when, t.pool)}</td>
      <td colspan="4"><span class="pill v-hold">BYE</span> <span class="d">no game — costs a week of the slot without advancing the hold</span></td></tr>`;
    const yours = !from || g.d > from;
    if (yours) owned++;
    const inHold = yours && owned <= DATA.hold_games;
    const vg = g.vg == null ? '<span class="nolink">not posted</span>'
      : `<span class="vg">${g.vg > 0 ? '−' : '+'}${Math.abs(g.vg).toFixed(1)}</span>`;
    const tag = yours ? '' : '<span class="gtag t-before">BEFORE PICKUP</span>';
    const holdEnds = own && ownSlot && g.d === ownSlot.third_game;
    /* THE HOLD MARKER IS A LABEL, NOT A DOT. Casey, 30 Aug 2026: "why do some teams in the
       schedule have a small orange dot next to the team and some do not?" It marked the three
       games of the mandatory hold and the only explanation was a bullet in a paragraph below
       the table. A mark whose meaning has to be looked up is a mark that gets ignored. */
    return `<tr class="gline ${yours ? 'g-yours' : 'g-before'}"
        onclick="event.stopPropagation();toggleWhy('${t.n.replace(/'/g,"\\'")}',${i})">
      <td class="d">${when(g.when, t.pool)}</td>
      <td>${g.loc === 'Home' ? 'vs' : g.loc === 'Away' ? 'at' : 'vs'} ${g.opp} <span class="d">▸</span>${tag}${
        own ? (holdEnds ? '<span class="gtag t-hold" title="This team\'s third game. You must let it play this one; you can drop it afterwards.">HOLD ENDS</span>' : '')
            : (inHold ? '<span class="gtag t-hold" title="One of the three games you are obliged to hold this team for once you pick it up.">MUST HOLD</span>' : '')}</td>
      <td class="num ${g.p>=0.7?'g':g.p>=0.5?'y':'b'}"
          title="${g.p >= P_CEIL ? 'The model prices this above 99%, but it only prices on-field strength — it has no term for weather, injury or a forfeit, so the board never shows 100%.' : ''}">${pctP(g.p)}</td>
      <td class="num d c-model">${g.m == null ? '—' : (g.m > 0 ? '−' : '+') + Math.abs(g.m).toFixed(1)}</td>
      <td class="num">${vg}</td></tr>`
      + (WHY === t.n + '|' + i ? `<tr><td colspan="5"><div class="gwhy">${gameWhy(t, g, yours, inc)}</div></td></tr>` : '');
  }).join('');

  const nBefore = (t.sched || []).filter(g => !g.bye && from && g.d <= from).length;
  const radj = rerateOf(t.n);
  return `<div class="dtl"><h3>${t.n} — full season${own ? ' (yours)' : ''}${
    radj ? ` <span class="gtag ${radj > 0 ? 't-yours' : 't-before'}"
      title="How far this team's rating has moved from its August value, based on how it has actually played. Every game below that has not been played is priced from the adjusted rating.">FORM ${radj > 0 ? '+' : ''}${radj.toFixed(1)}</span>` : ''}</h3>
    <div class="scr"><table>
      <colgroup><col style="width:16%"><col style="width:40%"><col style="width:14%"><col style="width:15%"><col style="width:15%"></colgroup>
      <thead><tr><th>When</th><th>Opponent</th>
        <th class="num" title="Games still to come: this team's probability of winning. Games already played: the final score. Same column, because it is the same question before and after — and a merged cell would leave the score aligned to nothing.">Odds<br>/ result</th>
        <th class="num c-model" title="The model's projected margin as a spread from this team's point of view: −7.0 means favoured by 7. For a game already played this is what the model made it BEFOREHAND, never a re-run.">Model</th>
        <th class="num" title="The posted Vegas line, same sign convention. Most games have none — the collected board is one date, ${DATA.vegas_asof}.">Vegas</th></tr></thead>
      <tbody>${past}${rows}</tbody></table></div>
    <div class="note">
      ${own ? `<b class="g">Green edge</b> — every remaining game is <b>yours</b>: you already
        own this team. ${ownSlot ? `Its hold ends with the game on <b>${ownSlot.third_game.slice(5)}</b>,
        marked <b class="y">HOLD ENDS</b> — you can drop it after that game is played, and
        whatever replaces it first plays for you on ${ownSlot.drop_from.slice(5)}.`
        : ''}` : `<b class="g">Green edge</b> — games you would own, if you drop
      <b>${inc ? inc.n : 'a team'}</b>.`}
      ${own ? '' : (nBefore ? `<b class="b">Red edge, BEFORE PICKUP</b> — ${nBefore} game${nBefore===1?'':'s'}
        this team plays <b>on or before ${from.slice(5)}</b>, which is when
        ${inc.n}'s slot frees up. Somebody else owns it for those, and <b>none of the points
        columns count them</b>.` : `Nothing is excluded: this team's next game falls after
        ${inc ? inc.n + "'s slot frees up" : 'your next opening'}.`)}
      <b class="d">Grey</b> — already played, with the final score so you can see who they beat.
      ${own ? '' : `<b class="y">MUST HOLD</b> marks the three games you are obliged to keep the team for
      once you pick it up — you cannot drop it before those are played.`}
      <br><b>Click any game</b> for the reasoning. ${DATA.vegas_n} posted lines exist in this
      build (${DATA.vegas_asof}); every other game says <b>not posted</b>.</div></div>`;
}

function holdIndexFrom(t, from){
  let g = 0, i = 0;
  for (const x of (t.sched || [])){
    i++;
    if (x.bye) continue;
    if (from && x.d <= from) continue;
    g++;
    if (g === DATA.hold_games) return i;
  }
  return i;
}

let WHY = null;
function toggleWhy(n, i){ const k = n + '|' + i; WHY = (WHY === k) ? null : k; renderPick(); }

/* Every adjustment states its own point value, and a comparison that is not material says so
   rather than being dressed up as a disagreement. */
function gameWhy(t, g, yours, inc){
  const bits = [];
  const edge = g.m == null ? null : g.m;
  if (edge != null) bits.push(`The model rates ${t.n} <b>${Math.abs(edge).toFixed(1)} points
    ${edge >= 0 ? 'better than' : 'worse than'}</b> ${g.opp} ${g.loc === 'Home' ? 'at home'
    : g.loc === 'Away' ? 'on the road' : 'on a neutral field'}, which is where the
    ${pctP(g.p)} comes from: win probability is Φ(margin ÷ σ) and nothing else — which is exactly
    why it is never shown as 100%: that formula prices strength, not the weather, an injury or a
    forfeit.`);
  if (g.vg != null){
    const d = g.m - g.vg;
    bits.push(Math.abs(d) < 1.5
      ? `Vegas has this at ${g.vg > 0 ? '−' : '+'}${Math.abs(g.vg).toFixed(1)}, which is the
         same number to within a point and a half — the model and the market agree here.`
      : `<b class="y">Vegas has this at ${g.vg > 0 ? '−' : '+'}${Math.abs(g.vg).toFixed(1)}</b>,
         ${Math.abs(d).toFixed(1)} points ${d < 0 ? 'MORE' : 'LESS'} favourable to ${t.n} than
         the model. On a disagreement this size the market is usually the thing to believe.
         Line collected ${g.vg_asof || DATA.vegas_asof}.`);
  } else {
    bits.push(`<b>No posted line for this game.</b> The collected board is one date
      (${DATA.vegas_asof}) and nearly all week 1; October lines are not posted yet, and
      FCS-versus-FCS games are never priced anywhere.`);
  }
  if (yours === false) bits.push(`<b class="b">You would not own the team for this game.</b>
    It falls on or before <b>${inc ? inc.drop_from : 'your next opening'}</b>, the day
    ${inc ? inc.n + "'s" : 'your'} slot frees up — so this result goes to whoever holds the team
    now, and none of the points columns include it. Pick a different team to drop and this line
    moves.`);
  bits.push(`The rating behind this is solved from the posted season win total, not from
    results so far — so early in the year it is a preseason opinion, and it stops being one as
    the season is re-solved on each refresh.`);
  return bits.join(' ');
}

function holdIndex(t){
  let g = 0, i = 0;
  for (const x of (t.sched || [])){ i++; if (!x.bye){ g++; if (g === DATA.hold_games) return i; } }
  return i;
}

/* WHEN A WHOLE COLUMN AGREES, THAT IS A FINDING, NOT A BROKEN COLUMN. And when it stops
   agreeing that is a bigger one: a pool that is all rentals in September and has keepers in it
   by October is exactly the change each refresh is looking for. Casey, 30 Aug 2026: "I
   understand that as of today FBS is only streamers, but I assume you will continue to update
   your analysis based on game results and determine if any of these teams turn into a keeper." */
function poolNote(){
  const list = DATA.teams.filter(t => t.owner == null && t.pool !== 'NFL'
    && t.claim_ok && t.verdict !== 'TOO FEW GAMES');
  if (!list.length) return '';
  const top = list.slice().sort((a,b)=>(b.surplus??-99)-(a.surplus??-99)).slice(0, 25);
  const nFbs = list.filter(t=>t.pool==='FBS').length, nFcs = list.filter(t=>t.pool==='FCS').length;
  const keepers = top.filter(t => t.verdict === 'SEASON KEEPER').length;
  const longer  = top.filter(t => t.verdict === 'HOLD LONGER').length;
  if (!keepers && !longer) return `<div class="note">
    <b class="y">Every college team worth listing is a three-week rental right now.</b> That is
    the pool talking, not the teams: ${nFbs} FBS and ${nFcs} FCS teams are free in your
    division, so the slot earns more cycling to the next best every three games than holding
    any one of them. <b>This will change.</b> As results come in, a team winning against a soft
    remaining schedule turns into HOLD LONGER and then into a keeper — that is what each
    refresh is looking for.</div>`;
  return `<div class="note">Of the top ${top.length} college teams available:
    <b class="g">${keepers} season keeper${keepers===1?'':'s'}</b>,
    <b class="y">${longer} worth holding longer</b> than the mandatory ${DATA.hold_games} games,
    and ${top.length-keepers-longer} straight rentals. ${nFbs} FBS and ${nFcs} FCS teams are
    free in your division.</div>`;
}

/* HOW MUCH EVIDENCE IS BEHIND THE LONG-RUN COLUMNS, said as a number rather than as a mood.
   Casey's argument for preferring near-term value is an argument about EVIDENCE, so the page
   states how much there is and how that will change, instead of asserting that keepers are
   risky and leaving him to take it on trust. */
function confidenceLine(){
  const played = DATA.teams.reduce((a, t) => a + (t.played || 0), 0);
  const total = DATA.teams.reduce((a, t) => a + (t.played || 0) + (t.games_left || 0), 0);
  const pctDone = total ? Math.round(100 * played / total) : 0;
  const band = pctDone < 15 ? ['b', 'almost none'] : pctDone < 40 ? ['y', 'some'] : ['g', 'a lot'];
  return `<b class="${band[0]}">${pctDone}% of the season has been played</b> — ${band[1]} of the
    evidence is in. Every rating here is still solved from the posted Vegas <i>win total</i>,
    which is what the market thought in August, ${pctDone < 15
      ? 'not what has happened since. Nothing has happened since.'
      : 'adjusted by what has happened since.'}`;
}

/* ================= SIDE BY SIDE =====================================================
   Casey, 30 Aug 2026: "I would also like an actual compare tool where I can look at my team
   against up to 2 teams that are available that I would select. Similar to the compare tool in
   the draft dashboard."

   The pickup table answers "which of these is best against ONE incumbent". This answers a
   different question: put three specific teams beside each other and read down. Everything is
   computed over the SAME window -- the date the chosen roster team's slot frees up -- because
   comparing a team's next three games against another team's next three games starting a
   fortnight earlier is not a comparison at all.

   NFL and college are never mixed. A slot is pool-typed: an NFL team can only replace an NFL
   team, so offering a college side against an NFL incumbent would be a swap he cannot make. */
/* ONE COMPARISON PER POOL, KEPT SEPARATELY. Casey, 31 Aug 2026: "when I have a compare going on
   college and then switch to NFL, it shows the College Teams as compare options and I have to
   clear them to then select NFL. I should be able to have a compare on College that is separate
   while I do a compare on NFL."
   The state was one pair of slots shared by both lists -- defensible when they lived on one page,
   plainly wrong once they are separate tabs. Switching tab is not abandoning the work and should
   not behave as if it were. Keyed by pool now, so each tab keeps its own.
   `PENDING` (marked) and `CMP` (drawn) are both per pool; `curPool()` is the one place that turns
   the sub-tab into a key, so the two cannot drift apart. */
let CMP     = {COL: {a: null, b: null}, NFL: {a: null, b: null}};
let PENDING = {COL: {a: null, b: null}, NFL: {a: null, b: null}};
function curPool(){ return PICKTAB === 'NFL' ? 'NFL' : 'COL'; }

function cmpPool(t){ return t.pool === 'NFL' ? 'NFL' : 'COL'; }

/* Declared HERE, above everything that reads it. cmpMine() consults PICKTAB and runs during the
   first render, so a `let` further down the file would sit in the temporal dead zone and throw. */
let PICKTAB = 'roster';
function setPickTab(k){
  /* DO NOT MOVE THE PAGE. Casey, 31 Aug 2026: "as soon as I click on one, the page moves down
     versus staying at the top so I can fully see side by side."
     `scrollIntoView({block:'start'})` pulls the panel's top edge to the top of the WINDOW, which
     scrolls the page header and the sub-tab strip off screen -- from a standing start at 0 it
     jumped him to 166. He tapped a control that was already in front of him; the answer should
     appear where he is looking, not somewhere he has to scroll back from.
     So: leave the scroll alone. The one exception is a tap made after scrolling down, where the
     strip itself has gone off the top -- then bring it back, and no further. */
  PICKTAB = k; OPEN = null; OPEN_MINE = null;
  const before = window.scrollY;
  renderPick();
  window.scrollTo({top: before});          // restore first: a shorter panel can clamp the scroll
  const bar = document.querySelector('#pickBody .subtabs');
  if (!bar) return;
  /* Measured AFTER the render and against the scroll position that actually applies. The first
     attempt added the OLD scrollY to a rect taken from the NEW layout; switching to a shorter
     panel clamps the scroll, the two no longer matched, and the strip stayed 457px off screen.
     Reading the rect's own offset needs no arithmetic and cannot drift. */
  const gap = bar.getBoundingClientRect().top;
  if (gap < 0) window.scrollBy({top: gap - 8});
}

/* Toggle a team in or out of the comparison. Two slots, first free wins, and picking a team
   already in the comparison removes it -- so the + is its own undo and there is no state you
   can get stuck in. */
/* Switching the roster team can change the POOL, and a college pick left sitting against an NFL
   incumbent is a comparison of two things that can never trade places. Dropped, not carried. */
/* The single selector: it sets the team the list ranks against AND the team the comparison is
   drawn against, because they were never two decisions. */
function setDrop(kind, name){
  DROP[kind] = name;
  renderPick();
}

/* PICK, THEN COMPARE -- TWO STEPS. Casey, 31 Aug 2026: "It would be better to have button that
   I can click Compare after selecting the teams I want to compare."
   The card used to render on every tap, so the first pick grew a large panel and pushed the
   second + off the screen. A tap now only MARKS the team: the buttons and a small tray update in
   place, the page does not move, and the comparison is drawn when he asks for it.
   PENDING is what he has marked; CMP is what is on screen. Both are declared per pool above. */
function cmpPick(name){
  /* The cross-pool switch that used to live here is GONE, and that is the payoff of the tab
     split: each list is on its own tab, so a tap can only ever be a team of that tab's pool.
     A special case deleted rather than duplicated. */
  const t = DATA.teams.find(x => x.n === name);
  const pool = t ? cmpPool(t) : curPool();
  const P = PENDING[pool];
  if (P.a === name){ P.a = P.b; P.b = null; }
  else if (P.b === name){ P.b = null; }
  else if (!P.a) P.a = name;
  else if (!P.b) P.b = name;
  else P.b = name;                   // both full: replace the second, keep the first
  /* Repaint ONLY the buttons and the tray. A full renderPick() here is what moved the page.
     A pool switch is the exception: it changes which rows carry a + at all, so it has to redraw
     -- and it happens once, on the first cross-pool tap, not on every pick. */
  paintPicks();
}

function paintPicks(){
  const P = PENDING[curPool()];
  for (const b of document.querySelectorAll('#pickBody .cbtn[data-cmp]')){
    const nm = b.getAttribute('data-cmp');
    const slot = P.a === nm ? 1 : P.b === nm ? 2 : null;
    b.textContent = slot || '+';
    b.classList.toggle('on', !!slot);
  }
  for (const id of ['cmptray', 'cmptray2', 'cmptray3']){
    const tray = document.getElementById(id);
    if (tray) tray.innerHTML = trayHTML();
  }
}

/* THE DEAD END. Casey, 31 Aug 2026: "even after I unchecked two teams I was comparing, they stay
   in the table, and I have to now scroll all the way back down to the teams to reselect. But it
   actually... I don't even see a way to clear the compare. It just stays on there permanently."
   He is exactly right and it was mine. Splitting PENDING (marked) from CMP (drawn) fixed the
   page jumping, and created a state with no exit: empty the selection and the tray fell back to
   its hint, which has no button, while the drawn comparison sat there with nothing able to
   dismiss it.
   THE RULE THIS LEAVES: whenever a control's job is to APPLY a state, emptying that state must
   still be applicable. "Nothing selected" is a selection, not the absence of one. */
function cmpDrawn(k){ const C = CMP[k || curPool()]; return !!(C.a || C.b); }

function trayHTML(){
  const k = curPool(), P = PENDING[k], C = CMP[k];
  const names = [P.a, P.b].filter(Boolean);
  const dirty = P.a !== C.a || P.b !== C.b;
  const clear = cmpDrawn()
    ? `<button class="cgo" onclick="cmpClear()" title="Remove the comparison and start again">Clear</button>`
    : '';
  if (!names.length)
    return (cmpDrawn()
        ? `<span class="d">Nothing selected.</span>
           <button class="cgo hot" onclick="cmpClear()"
             title="Take the comparison off the page">Clear comparison</button>`
        : `<span class="d">Tap <b>+</b> beside up to two teams below, then press Compare.</span>`);
  return names.map(nm => `<span class="cchip">${nm}<button class="cx"
      onclick="cmpPick('${nm.replace(/'/g, "\\'")}')" title="Remove ${nm}"
      aria-label="Remove ${nm}">x</button></span>`).join('')
    + `<button class="cgo${dirty ? ' hot' : ''}" onclick="cmpApply()"
        title="Draw the comparison and jump to it">${dirty ? 'Compare' : 'Showing'} ${names.length === 1 ? '1 team' : '2 teams'}</button>`
    + clear;
}

function cmpClear(){
  const k = curPool();
  PENDING[k] = {a: null, b: null};
  CMP[k] = {a: null, b: null};
  renderPick();
}

/* SCROLL SO THE CARD'S OWN HEADING IS VISIBLE, NOT PINNED UNDER THE STICKY ONE. Casey, 31 Aug
   2026: "it scrolls to the headers of the teams that are being compared, but it hides the top of
   it where it says side by side and clear... It should go to that top so that if I need to clear
   it, I can clear it without having to scroll back up."
   `scrollIntoView({block:'start'})` lines an element up with the top of the VIEWPORT, and this
   page has `header{position:sticky;top:0}`. So the card arrived exactly underneath the thing
   that covers the top of the viewport, taking its title and its Clear button with it. Offset by
   the sticky header's real height, measured rather than assumed, so it stays right if the header
   ever grows a row. */
function stickyCover(){
  /* Everything pinned to the top of the viewport, measured rather than assumed: the page header,
     plus the sub-tab strip once it is sticky too. Anything scrolled to must clear the lot. */
  let h = 0;
  for (const sel of ['header', '#pickBody .subtabs']){
    const el = document.querySelector(sel);
    if (el && getComputedStyle(el).position === 'sticky') h += el.getBoundingClientRect().height;
  }
  return h;
}

/* WATCHED, NOT MEASURED ONCE. The header holds the chip row, which WRAPS on a phone -- so its
   height changes after the chips render, changes again when a chip's text changes, and changes
   on rotation. Measuring at load gave 83px for a header that ended up 156px tall, and the sticky
   sub-tabs parked underneath it. A ResizeObserver keeps the variable honest for free. */
function measureHeader(){
  const hdr = document.querySelector('header');
  if (!hdr) return;
  document.documentElement.style.setProperty('--hdrh',
    Math.ceil(hdr.getBoundingClientRect().height) + 'px');
}
function watchHeader(){
  const hdr = document.querySelector('header');
  measureHeader();
  if (hdr && window.ResizeObserver) new ResizeObserver(measureHeader).observe(hdr);
  addEventListener('resize', measureHeader);
  addEventListener('orientationchange', measureHeader);
}

function scrollCardIntoView(card){
  if (!card) return;
  const cover = stickyCover();
  const y = card.getBoundingClientRect().top + window.scrollY - cover - 10;
  window.scrollTo({top: Math.max(0, y), behavior: 'smooth'});
}

function cmpApply(){
  const k = curPool();
  CMP[k] = {a: PENDING[k].a, b: PENDING[k].b};
  renderPick();
  /* Take him TO the answer he asked for, rather than leaving him to find it. */
  scrollCardIntoView([...document.querySelectorAll('#pickBody .card')]
    .find(c => /Side by side/.test(c.querySelector('h2') ? c.querySelector('h2').textContent : '')));
}
function cmpSlotOf(name){
  const t = DATA.teams.find(x => x.n === name);
  const P = PENDING[t ? cmpPool(t) : curPool()];
  return P.a === name ? 1 : P.b === name ? 2 : null;
}
/* ONE TEAM, ONE CONTROL. Casey, 31 Aug 2026: "my team and I would drop are the same things. Los
   Angeles, if I'm on NFL, the Los Angeles Rams are my team, and they'd also be the same team that
   I would drop. Can we somehow combine these two into one table?"
   They were the same thing wearing two controls: `DROP[kind]` drove the pickup table and
   `CMP.mine` drove the comparison, and nothing kept them in step -- so the table could rank
   against Nebraska while Side by side compared Penn State. There is now a single selector and
   `cmpMine()` reads it. `CMP.mine` is gone as a separate store, which also removes the
   possibility of the two disagreeing. Two stores of one fact, again. */
function cmpMine(){
  const want = PICKTAB === 'NFL' ? 'NFL' : 'COL';
  const slot = slotFor(want);
  return slot ? (BY.get(slot.n) || null) : null;
}

function cmpTeams(kind){
  /* Scoped to the pool of the sub-tab it is drawn on. Casey, 31 Aug 2026: "Could we have three
     separate tabs? One tab for my roster, one for the college compare and available teams, and
     another for NFL." Once the page is split by pool, a comparison card on the NFL tab has no
     business offering college teams -- so the pool comes from the tab rather than from whatever
     was picked last. */
  let mineList = DATA.teams.filter(t => t.owner === ME);
  if (kind) mineList = mineList.filter(t => cmpPool(t) === kind);
  if (!mineList.length) return null;
  const mine = cmpMine() || mineList[0];
  const slot = (DATA.my_slots || []).find(x => x.n === mine.n);
  const from = swapFrom(slot);
  const avail = DATA.teams.filter(t => t.owner == null && t.claim_ok
                                    && cmpPool(t) === cmpPool(mine))
                          .sort((a, b) => a.n.localeCompare(b.n));
  const C = CMP[kind || curPool()];
  const pick = k => avail.find(t => t.n === C[k]) || null;
  return {mine, mineList, slot, from, avail, cols: [mine, pick('a'), pick('b')].filter(Boolean)};
}

function cmpRow(label, tip, fn, best){
  const c = cmpTeams();
  const vals = c.cols.map(fn);
  /* Gate the highlight on materiality. Two teams 0.02 apart are not "better" and "worse", and
     colouring one of them green says they are. */
  const nums = vals.map(v => (v && v.v != null) ? v.v : null).filter(v => v !== null);
  const top = nums.length ? Math.max(...nums) : null;
  const material = nums.length > 1 && (top - Math.min(...nums)) >= 0.15;
  return `<tr><th class="c-team" title="${tip}">${label}</th>` + vals.map(v => {
    const win = best && material && v && v.v != null && v.v === top;
    return `<td class="${win ? 'g' : ''}" title="${(v && v.tip) || ''}">${
      win ? '<b>' + v.s + '</b>' : (v ? v.s : '—')}</td>`;
  }).join('') + '</tr>';
}

function compareCard(kind){
  /* NOTHING AT ALL UNTIL THERE IS SOMETHING TO COMPARE. Casey, 31 Aug 2026: "I'm just wondering
     if the side by side needs to be an entire screen above the best available... couldn't the
     best available just come up to the top of the screen without having this big side by side
     box above it?"
     It was a full card of empty state sitting above the thing he came to read. It now lives
     BELOW the list and appears only once he has picked teams -- the tray beside the + buttons is
     what tells him the feature exists, which is where he is looking when he wants it. */
  if (!cmpDrawn(kind)) return '';
  const c = cmpTeams(kind);
  if (!c) return '';
  /* CHOSEN FROM THE RANKED TABLE, NOT FROM A LIST OF 135. Casey, 30 Aug 2026: "The drop down
     boxes for the available teams in the compare tool are not ideal. I would prefer to select
     directly from the table where you have the available teams ranked instead sifting through a
     long list in a drop down menu."
     He is right about more than the ergonomics: an alphabetical dropdown throws away the
     ranking, which is the only reason the table exists. The picks are made where the evidence
     is, and shown here as removable chips so it is always clear what is being compared. */

  if (!c.from) return `<div class="card"><h2>Side by side</h2>
    <div class="empty">${c.mine.n} has no drop date yet, so there is no window to compare over.</div></div>`;

  const incWin = weekWindow(c.mine, c.from, DATA.hold_games);
  const incRest = windowPts(c.mine, c.from, null);
  const games = t => (t.sched || []).filter(g => !g.bye && g.d > c.from).slice(0, 6);
  const maxG = Math.max(...c.cols.map(t => games(t).length), 0);

  /* The heading and everything under it share one column model and one alignment. */
  const head = `<tr><th class="c-team">Measured from ${c.from.slice(5)}</th>` +
    c.cols.map((t, i) => `<th>${i === 0 ? '<span class="mytag">YOURS</span> ' : ''}<span
      class="pill p-${t.pool.toLowerCase()}">${t.pool}</span> ${t.n}</th>`).join('') + '</tr>';

  const rows =
      cmpRow('Sweep the 3 weeks', 'Winning every game in the next three weeks of the roster slot. A bye week cannot be won, so a team with one cannot sweep.',
             t => { const w = weekWindow(t, c.from, DATA.hold_games);
                    return {v: w.p, s: w.byes ? '<span class="pill v-avoid">BYE</span>'
                                              : pctP(w.p),
                            tip: p30Why(t, c.from, w)}; }, true)
    + cmpRow('Next 3 weeks (pts)', 'Expected league points over the next three weeks. A bye banks nothing and still spends one of the three.',
             t => { const w = weekWindow(t, c.from, DATA.hold_games);
                    return {v: w.pts,
                            s: w.pts.toFixed(2) + (w.byes ? ` <span class="d">(${w.games}g)</span>` : ''),
                            tip: w.byes ? `${w.games} game${w.games === 1 ? '' : 's'} in three weeks — ${w.byes} bye week.` : ''}; }, true)
    + cmpRow('Rest of season', 'Expected league points from this date to the end of the regular season.',
             t => { const w = windowPts(t, c.from, null);
                    return {v: w.pts, s: w.pts.toFixed(2)}; }, true)
    + cmpRow('Gain vs ' + c.mine.n, 'Next three weeks minus what ' + c.mine.n + ' earns over the SAME three weeks. Yours is zero by definition.',
             t => { const w = weekWindow(t, c.from, DATA.hold_games);
                    const d = w.pts - incWin.pts;
                    return {v: d, s: (d >= 0 ? '+' : '') + d.toFixed(2)}; }, true)
    + cmpRow('Played so far', 'Games finished, and how the points compare with what the model expected of them.',
             t => { const f = form(t);
                    return {v: null, s: f.games ? `${f.games}g, ${f.edge >= 0 ? '+' : ''}${f.edge.toFixed(2)}` : '—',
                            tip: f.games ? `${f.actual.toFixed(2)} banked against ${f.expected.toFixed(2)} expected.`
                                         : 'No games counted yet.'}; })
    + cmpRow('Do', 'The recommendation, measured against your team above. Yours is the team being dropped, so it has no verdict of its own.',
             (t, i) => {
               if (i === 0) return {v: null, s: '<span class="d">the team you would drop</span>'};
               const r = recommend(t, c.slot);
               return {v: null, s: `<span class="pill ${r.cls}">${r.label}</span>`, tip: r.tip};
             });

  /* THE WHOLE SEASON, ALIGNED BY WEEK. Casey, 30 Aug 2026: "I wanted you to also put the teams
     schedules side by side in the compare tool. Including the games played and the results of
     those games. You tried to do this with the next games in order, but I need to see the dates
     of the games and if there is a bye."
     "Game 1, game 2, game 3" was the wrong axis: three teams' third games can be a fortnight
     apart, a bye has no game number at all, and a team that has already played two is three
     rows out of step with one that has played none. The LEAGUE WEEK is the axis they actually
     share -- so a bye shows as a blank week beside the opponent the other team is playing that
     same weekend, which is the comparison he is making. */
  const cell = (t, wk) => {
    const past = (t.hist || []).filter(g => g.d && weekOf(t.pool, g.d) === wk);
    const fut = (t.sched || []).filter(g => g.d && !g.bye && weekOf(t.pool, g.d) === wk);
    const bye = (t.sched || []).some(g => g.bye && g.d && weekOf(t.pool, g.d) === wk);
    if (past.length){
      const g = past[0];
      const res = g.nc ? '<span class="d">no contest</span>'
        : g.unknown ? scoreOrNot(t.n, g.d)
        : `<span class="fin ${g.won ? 'g' : 'b'}">${g.won ? 'W' : 'L'} ${g.pf}–${g.pa}</span>`;
      return `<td class="cmpg g-past"><span class="d">${g.d.slice(5)}</span>
        ${g.loc === 'Away' ? 'at' : 'vs'} ${g.opp}<br>${res}</td>`;
    }
    if (fut.length){
      const g = fut[0];
      const mine = !c.from || g.d > c.from;
      return `<td class="cmpg ${mine ? 'g-yours' : 'g-before'}"
          title="${mine ? 'You would own this game.' : 'Played on or before ' + c.from.slice(5) + ' — not yours, and not in any of the numbers above.'}">
        <span class="d">${g.d.slice(5)}</span> ${g.loc === 'Away' ? 'at' : 'vs'} ${g.opp}<br>
        <b class="${g.p >= 0.7 ? 'g' : g.p >= 0.5 ? 'y' : 'b'}">${pctP(g.p)}</b>${
        mine ? '' : ' <span class="gtag t-before">NOT YOURS</span>'}</td>`;
    }
    if (bye) return '<td class="cmpg"><span class="pill v-hold">BYE</span></td>';
    return '<td class="cmpg d">—</td>';
  };
  const allWeeks = new Set();
  for (const t of c.cols){
    for (const g of (t.hist || [])) if (g.d) allWeeks.add(weekOf(t.pool, g.d));
    for (const g of (t.sched || [])) if (g.d) allWeeks.add(weekOf(t.pool, g.d));
  }
  const weeks = [...allWeeks].sort((a, b) => a - b);
  const gameRows = weeks.map(wk => {
    const any = c.cols.map(t => cell(t, wk));
    if (any.every(x => x.includes('cmpg d">—'))) return '';   // a week none of them plays
    const d0 = new Date((c.cols[0].pool === 'NFL' ? DATA.calendar.nfl_week1_anchor
                                                  : DATA.calendar.cfb_week1_anchor) + 'T00:00:00Z');
    const start = new Date(d0.getTime() + (wk - 1) * 6048e5);
    return `<tr><th class="c-team d">Wk ${wk}<br><span style="font-weight:400">${
      String(start.getUTCMonth() + 1).padStart(2, '0')}-${
      String(start.getUTCDate()).padStart(2, '0')}</span></th>` + any.join('') + '</tr>';
  }).join('');

  return `<div class="card"><h2>Side by side${cmpDrawn(kind)
      ? ` <button class="cgo hd" onclick="cmpClear()" title="Remove this comparison">Clear</button>`
      : ''}</h2>
    <div class="bar" data-role="cmpchips"><label class="d" style="align-self:center;font-size:12px">
      Compared with</label><span id="cmptray" class="tray">${trayHTML()}</span></div>
    ${c.cols.length < 2 ? `<div class="empty">Nothing to compare <b>${c.mine.n}</b> against yet.
      <b>Tap the + beside any team in the ranked list below</b> — the table is sorted best-first,
      which a dropdown of ${c.avail.length} names in alphabetical order is not. Two at a time.
      Only ${c.mine.pool === 'NFL' ? 'NFL' : 'college'} teams carry a +, because an
      ${c.mine.pool === 'NFL' ? 'NFL' : 'college'} slot can only be filled by one.</div>`
    : /* ONE TABLE, NOT TWO. Casey, 30 Aug 2026: "The columns on the top of the compare table
         where is says measured from don't align with the columns below by team." They did not:
         the summary rows were right-aligned numbers and the schedule rows were left-aligned
         blocks, in two separate <table> elements inside two separate scrollers. Equal computed
         widths are not alignment when the content sits against opposite edges, and two
         scrollers can be scrolled to different offsets on a phone. A single table cannot
         disagree with itself. */
      `<div class="scr"><table class="cmptbl">
      <colgroup><col style="width:28%">${c.cols.map(() => '<col>').join('')}</colgroup>
      <thead>${head}</thead>
      <tbody>${rows}
        <tr class="cmpsec"><th class="c-team">Every week, side by side</th>${
          c.cols.map(() => '<td></td>').join('')}</tr>

    ${explain('How to read Side by side', `<b>Everything here starts on ${c.from.slice(5)}</b> — the day
      <b>${c.mine.n}</b>'s slot frees up. Games any of these teams play before then are excluded
      from every number, for all three columns, because none of them would be yours. Change the
      team on the left and the whole window moves.
      <b>Green marks the best in a row</b>, and only when the spread is at least 0.15 — two teams
      a hundredth apart are not better and worse.
      ${c.cols.length > 1 ? `<b>${c.mine.n}</b> earns <b>${incWin.pts.toFixed(2)}</b> over its own
      next three games from that date and <b>${incRest.pts.toFixed(2)}</b> to the end of the
      season; those are what a swap gives up.` : ''}`)}</div>`;
}

/* THE SEARCH BOX COULD NOT BE TYPED IN. Casey, 31 Aug 2026: "When I type into the pickup search
   box it does work and immediately just takes me to the top of the page. I can't even type into
   it."
   `oninput` called renderPick(), which rewrites the whole tab -- destroying the input element
   mid-keystroke. The browser then has nothing focused, the caret is gone and the page jumps to
   the top, so the second character never lands. The fix is not a debounce: a debounce still
   destroys the box, just later. Re-render, then put the SAME state back -- focus, caret position
   and scroll offset -- so the element the user is typing into survives the redraw. */
function pickSearch(el){
  PQ = el.value;
  const caret = el.selectionStart, y = window.scrollY;
  renderPick();
  const again = document.getElementById('pq');
  if (again){
    again.focus({preventScroll: true});
    try { again.setSelectionRange(caret, caret); } catch (e) {}
  }
  window.scrollTo({top: y});
}

function renderPick(){
  const mine = DATA.teams.filter(t => t.owner === ME)

      changed.</b> Your sheet is the record and normally wins, but ${corr.length===1?'this row was':'these rows were'}
      impossible on ${corr.length===1?'its':'their'} own terms — an owner with four NFL teams, or one
      team on two rosters in the same division — and the draft record named exactly one
      replacement. Leaving ${corr.length===1?'it':'them'} alone would have shown a team somebody owns as a

    </div>` : '';
