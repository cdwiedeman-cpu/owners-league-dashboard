<!doctype html><html lang="en"><head><meta charset="utf-8"><script>/* Casey, 31 Aug 2026: iOS home-screen apps often don't reload the page when tapped -- they wake a FROZEN, already-running copy from memory, so a script that only runs on initial load never runs again and never notices anything changed. Fixed same day: the check runs on load AND every time iOS wakes the page back up (pageshow, and the page becoming visible again), which is the actual moment a resumed home-screen app needs it. version.txt is a hash of the file's own content (computed at staging, not baked into this HTML), compared against what THIS BROWSER last saw in localStorage; a mismatch reloads once under a URL the phone has never cached (the '?v=' guard makes this a one-shot, never a loop). */(function(){function checkVersion(){if(location.search.indexOf('v=')!==-1){return;}fetch('version.txt',{cache:'no-store'}).then(function(r){return r.text();}).then(function(v){v=v.trim();if(!v){return;}var seen=null;try{seen=localStorage.getItem('dashboard_version');}catch(e){}if(seen&&seen!==v){try{localStorage.setItem('dashboard_version',v);}catch(e){}location.replace(location.pathname+'?v='+encodeURIComponent(v));return;}try{localStorage.setItem('dashboard_version',v);}catch(e){}}).catch(function(){});}checkVersion();window.addEventListener('pageshow',checkVersion);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){checkVersion();}});})();if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function(){}); }</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owners League — Season Dashboard</title>
<style>
:root{--bg:#0b1119;--pan:#111a24;--pan2:#16212e;--line:#1e2a37;--ink:#e6edf5;--dim:#93a4b8;
 --faint:#5f7080;--good:#4ade80;--bad:#f87171;--gold:#fbbf24;--blue:#60a5fa;--mine:#a78bfa;
 --tv:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 -webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0}
h1{font-size:16px;margin:0 0 6px;letter-spacing:.02em}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chip{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.chip-action{font:inherit;font-size:11px;font-weight:600;color:var(--bg);background:var(--blue);border:none;cursor:pointer;min-height:24px}
.chip-action:active{opacity:.8}
.chip.warn{color:var(--gold);border-color:#4a3a10}
.chip.bad{color:var(--bad);border-color:#4a1f1f}
.tabs{display:flex;gap:4px}
.tab{appearance:none;background:transparent;border:1px solid var(--line);border-bottom:none;color:var(--dim);
 font:600 13px inherit;padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;min-height:38px}
.tab[aria-selected=true]{background:var(--pan);color:var(--ink);border-color:var(--line)}
main{padding:12px 14px 60px;max-width:1100px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
/* Every clickable mark is at least 12x12px and carries hover text -- standing rule. */
.cbtn{min-width:26px;min-height:26px;width:26px;border-radius:7px;border:1px solid var(--line);
  background:var(--pan2);color:var(--ink);font:600 13px/1 inherit;cursor:pointer;padding:0}
.cbtn.on{background:var(--accent-soft,rgba(90,140,255,.18));border-color:var(--accent,#5a8cff);
  color:var(--accent,#5a8cff)}
.cchip{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;
  background:var(--pan2);border:1px solid var(--line);font-size:13px}
.cchip.empty-chip{color:var(--dim,#8a8f98);border-style:dashed}
/* A RESERVED HEIGHT. The tray swaps a one-line hint for chips plus a button, and the height
   difference pushed the page 19px every time he tapped + -- a small version of exactly the
   jump he complained about. The row keeps its size whether it is empty or full. */
.tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;
  min-height:34px;width:100%}
.cgo{min-height:32px;padding:0 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--pan2);color:var(--dim);font:600 13px/1 inherit;cursor:pointer}
.cgo.hot{border-color:var(--blue);color:var(--blue);background:rgba(96,165,250,.08)}
/* On the card's own heading, so the control that removes the comparison is where the comparison
   is -- not only in a tray he has to find. */
.cgo.hd{float:right;min-height:28px;font-size:12px;font-weight:600}
.cx{min-width:20px;min-height:20px;border:0;border-radius:5px;background:transparent;
  color:inherit;cursor:pointer;font:600 13px/1 inherit;padding:0}
.cx:hover{background:var(--line)}
/* A schedule cell holds a date, an opponent and a result, so it wraps and is left aligned --
   the numeric alignment used elsewhere would centre a two-line cell against a one-line one. */
.c-cmp{padding-left:4px;padding-right:4px;text-align:center}
/* Sub-tabs inside the Pickups tab. Visually secondary to the main tab strip -- they divide one
   tab's contents, they do not compete with it. */
.subtabs{margin:0 0 12px;flex-wrap:wrap}
/* THE SUB-TABS STICK BELOW THE PAGE HEADER. Casey, 31 Aug 2026: "the tabs under pickups for my
   roster college and NFL should lock at the top when scrolling, so that it's easy to filter on
   those three if desired without having to scroll back to the top."
   `top` is a measured variable rather than a guess: the page header is itself sticky at top:0 and
   its height changes with the number of chips, which wraps on a phone. A hard-coded offset would
   be wrong on exactly the screen he uses. */
.subtabs{position:sticky;top:var(--hdrh,58px);z-index:15;background:var(--bg);
  padding:6px 0;margin-bottom:10px}

/* The projection-basis control. Both options visible, the live one marked, and a sentence saying
   what the choice does -- readable by someone who has never seen this page before. */
.rrgroup{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding-left:8px}
.rrlab{font-size:11px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase;
  cursor:help;white-space:nowrap}
.rrbtn{border-radius:7px;border:1px solid var(--line);border-bottom:1px solid var(--line);
  min-height:30px;padding:0 9px;font-size:12px;white-space:nowrap}
.rrbtn.on{color:var(--blue);border-color:var(--blue);background:rgba(96,165,250,.08)}
/* Says outright when the two options cannot differ. A choice that makes no difference should say
   so rather than leaving him to wonder which one he is looking at. */
.rrsame{font-size:10.5px;color:var(--faint);font-style:italic;white-space:nowrap;cursor:help}
/* On a phone the strip wraps; the group goes to its own line rather than squeezing the tabs. */
@media (max-width:560px){ .rrgroup{margin-left:0;padding-left:0;width:100%;
  border-top:1px solid var(--line);margin-top:6px;padding-top:6px} }
/* Only shown where the table is actually wider than the screen -- a hint about scrolling that
   appears when nothing needs scrolling is noise. */
/* MATCHES THE "Tap + beside..." LINE ABOVE IT, deliberately. Casey, 31 Aug 2026: the hint was
   11.5px italic --faint, which reads as a footnote somebody left behind rather than an
   instruction. Two instructions on one screen that are equally worth following should not be
   styled as if one of them mattered less. Same 13px, same --dim, upright, with the ACTION word
   bolded the way the + is bolded in the other line. */
.scrhint{display:none}
@media (max-width:760px){ .scrhint{display:block;font-size:13px;color:var(--dim);
  margin:11px 0 7px;line-height:1.4} }
.pick-tab{border-radius:8px;border-bottom:1px solid var(--line);min-height:38px;padding:0 14px;
  font-size:13px}
.pick-tab.on{color:var(--blue);border-color:var(--blue);background:rgba(96,165,250,.08)}
.c-div{white-space:nowrap}
/* NOT called .mine. A suite check forbids a `.mine { color: }` rule, because ownership colouring
   a scoreboard team once collided with the win colour and made both unreadable. That guard is
   correct and blunt, and this pill is a different thing in a different table — so it takes a
   different name rather than the check taking an exception. */
.pill.p-div{background:var(--sunk);border:1px solid var(--line);color:var(--dim)}
.pill.p-div.own{border-color:var(--blue);color:var(--blue)}
/* A real disclosure control: 44px of tap target, and it keeps its own open/closed state. */
details.how{margin:0}
details.how>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  min-height:44px;font:600 15px/1.3 inherit;color:var(--ink)}
details.how>summary::-webkit-details-marker{display:none}
details.how>summary::before{content:'?';display:inline-flex;align-items:center;
  justify-content:center;width:22px;height:22px;flex:none;border-radius:50%;
  border:1px solid var(--line);font-size:12px;color:var(--dim)}
details.how[open]>summary::before{content:'x'}
details.how>summary:hover::before{border-color:var(--blue);color:var(--blue)}
/* One table for the whole comparison, so a heading can never sit over a different edge from the
   values beneath it. Everything in it is left aligned, including the numbers: they are read
   across a row against each other, not down a column of decimals. */
.cmptbl th, .cmptbl td{text-align:left;vertical-align:top}
.cmptbl tr.cmpsec th{padding-top:16px;border-top:1px solid var(--line)}
.cmptbl tr.cmpsec td{border-top:1px solid var(--line)}
td.cmpg{vertical-align:top;font-size:12.5px;line-height:1.45;white-space:normal}
.f{appearance:none;background:var(--pan);border:1px solid var(--line);color:var(--dim);border-radius:8px;
 padding:7px 13px;font:600 12px inherit;cursor:pointer;min-height:34px}
.f[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#06121f}
.f.me[aria-pressed=true]{background:var(--mine);border-color:var(--mine)}
.card{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 10px;font-weight:700}
.note{font-size:12px;color:var(--dim);line-height:1.5;margin-top:10px}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* COLOUR MEANS ONE THING AT A TIME — AND THE THING IT MEANS CHANGED ON 31 AUG 2026.
   The first build painted "my team" purple and "won this game" green in the SAME cell, so a
   purple team playing a green team looked like two categories of team. Casey, 30 Aug 2026:
   "Why do you have some teams as green and some as purple on My Teams... which doesn't make
   sense." The fix then was to strip the colour off ownership and use a MINE badge.
   Casey, 31 Aug 2026: "Instead of putting MINE next to each of my teams can you just make the
   team name red or some other good color."
   BOTH REQUESTS ARE THE SAME RULE, and they are satisfied by SEPARATING THE TWO FACTS ONTO TWO
   ELEMENTS rather than by picking which one gets colour:
     the TEAM NAME is coloured for OWNERSHIP and nothing else;
     the SCORE is coloured for WHO WON and nothing else.
   The collision is impossible now — they are different elements — so ownership gets its colour
   back and the badge is gone. Purple, not red: red is `--bad` everywhere else on this page and
   means a number went the wrong way. Your own team is not a bad number. */
.mine{font-weight:700;color:var(--mine)}
/* The badge survives in the two places it still earns its keep — the "YOURS" column head in the
   comparison and "YOU" in the standings — where there is no second fact competing for the same
   line and a word is clearer than a colour. */
.mytag{display:inline-block;font:700 9px inherit;letter-spacing:.06em;padding:1px 5px;
  border-radius:3px;border:1px solid var(--mine);color:var(--mine);margin-left:5px;
  vertical-align:1px}
.own{font-size:11px;color:var(--faint);display:block;margin-top:1px}
.own b{color:var(--dim);font-weight:600}
.own .dv{display:inline-block;min-width:2.1em;color:var(--faint)}
.own .isme{color:var(--mine);font-weight:700}
/* WHICH MODE AM I IN? Casey, 30 Aug 2026: "where will it say live scores vs showing the
   schedule. Will the name of the tab change?" It did not say, anywhere obvious -- you had to
   read a paragraph inside a card. A page that behaves in two very different ways has to state
   which one is running, permanently and in the same place every time. */
.status{display:inline-flex;align-items:center;gap:6px;font:700 11px inherit;letter-spacing:.04em;
  border:1px solid;border-radius:999px;padding:4px 11px;min-height:26px;white-space:nowrap}
.st-live{color:var(--good);border-color:#14532d;background:rgba(74,222,128,.07)}
.st-off{color:var(--gold);border-color:#4a3a10;background:rgba(251,191,36,.07)}
.st-wait{color:var(--dim);border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st-live .dot{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.search{background:var(--pan2);border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 11px;font:13px inherit;min-height:34px;min-width:150px;flex:1 1 170px;max-width:280px}
/* Casey, 30 Aug 2026: "Can you widen the I would drop box so I can see the full text
   without have to click the drop down to see the text for the first team that is currently
   selected." A <select> is sized by CSS, never by its content, so a max-width silently
   truncates the ONE option a closed select exists to show. It now takes the width it needs and
   only shrinks when the screen makes it. */
select.search{max-width:100%;flex:1 1 380px;min-width:0}
.bar > label{white-space:nowrap}
.dtl{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.dtl h3{margin:0 0 8px;font-size:14px}
.gline{cursor:pointer}
.gwhy{font-size:12px;color:var(--dim);line-height:1.5;background:rgba(148,163,184,.07);
  border-left:2px solid var(--line);padding:7px 9px;margin:2px 0 6px}
.vg{color:var(--gold)}
.nolink{color:var(--faint)}
/* THREE STATES, THREE COLOURS, ONE MEANING EACH.
   played  = grey, it is history and it is not yours either way
   before  = red left edge, the team plays it for somebody else
   yours   = green left edge, this is the part you are actually buying */
tr.g-past td{background:rgba(148,163,184,.06);color:var(--dim)}
tr.g-before td:first-child{border-left:3px solid var(--bad)}
tr.g-yours  td:first-child{border-left:3px solid var(--good)}
tr.g-before td{opacity:.72}
.gtag{display:inline-block;font:700 9px inherit;letter-spacing:.05em;padding:0 4px;
  border-radius:3px;border:1px solid;margin-left:5px;vertical-align:1px}
.t-past{color:var(--dim);border-color:var(--line)}
.t-before{color:var(--bad);border-color:#4a1f1f}
.t-yours{color:var(--good);border-color:#14532d}
.t-hold{color:var(--gold);border-color:#4a3a10}
.fin{font-variant-numeric:tabular-nums;font-weight:700}
tr.slot-head td{border-bottom:none}
.caret{color:var(--faint);font-size:10px;margin-right:3px}
tr.slot-head:hover td{background:rgba(96,165,250,.06)}
tr.slot-kid td{font-size:12px;padding-top:1px;padding-bottom:3px;border-bottom:none}
/* A COLLAPSED slot has no child rows, so its head row has to close its own border. The old
   rule hung the divider on the last child and left collapsed rows running into each other. */
tr.slot-head.closed td{border-bottom:1px solid var(--line)}
tr.slot-kid.last td{border-bottom:1px solid var(--line)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(96,165,250,.07)}
.g{color:var(--good)}.b{color:var(--bad)}.y{color:var(--gold)}.d{color:var(--dim)}
.pill{display:inline-block;font:700 10px inherit;letter-spacing:.06em;padding:1px 6px;border-radius:4px;border:1px solid}
.p-nfl{color:#7dd3fc;border-color:#1e4a63}.p-fbs{color:#fdba74;border-color:#5c3a1a}.p-fcs{color:#c4b5fd;border-color:#3d3163}
.v-stream{color:var(--blue);border-color:#1e3a5f}
.v-hold{color:var(--gold);border-color:#4a3a10}
.v-keep{color:var(--good);border-color:#14532d}
.v-no{color:var(--faint);border-color:var(--line)}
.v-avoid{color:var(--bad);border-color:#4a1f1f;background:rgba(248,113,113,.08)}
.recg{display:block;font-size:10px;font-variant-numeric:tabular-nums;margin-top:2px}
.empty{color:var(--dim);font-size:13px;line-height:1.55;padding:6px 0}
/* Each team is a FULL-WIDTH row of the game block. Without grid-column:1/-1 the two .t
   children land in the grid's two columns side by side, and the away team renders inside the
   score column -- which is what the first build actually did. */
.grp{font:700 10px inherit;letter-spacing:.09em;text-transform:uppercase;padding:12px 0 4px;
  border-bottom:1px solid var(--line);margin-bottom:2px}
/* MORE GAMES ON SCREEN AT ONCE. Casey, 30 Aug 2026: "can you organize the games so I can see
   more games at once. So maybe 3 or 4 columns of games." A single column of forty fixtures is a
   lot of scrolling on a Saturday. The grid is auto-fill so it becomes one column on a phone and
   three or four on a laptop without a breakpoint per width — and each game keeps its own card
   so nothing is read across a gap. */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.games .gm{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--pan2)}
a.gml{text-decoration:none;color:inherit;display:grid}
a.gml:hover{border-color:var(--blue);background:rgba(96,165,250,.06)}
a.gml:hover .gc{color:var(--blue)}
.gc{float:right;font-size:10px;color:var(--faint);letter-spacing:.03em}
.grp{grid-column:1/-1}
.gm{display:grid;grid-template-columns:1fr;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.gm .t{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.gm .s{font-variant-numeric:tabular-nums;font-weight:700;min-width:2.2em;text-align:right}
.gm .st{grid-column:1/-1;font-size:11px;color:var(--faint)}
.win{color:var(--good)}
/* THE NETWORK GETS ITS OWN COLOUR because it answers a different question from anything else on
   the card: not who is winning, not who owns them, but where to watch. Cyan is used nowhere else
   on the page, so it can never be read as the win green, the ownership purple, the live gold or
   the link blue. Casey, 31 Aug 2026: "make the tv network a color that stands out." */
.tv{color:var(--tv);font-weight:700;letter-spacing:.02em}
.notv{color:var(--faint)}
details>summary{cursor:pointer;color:var(--dim);font-size:12px;padding:4px 0;min-height:22px}
details>summary::marker{color:var(--faint)}
.scr{overflow-x:auto}
/* The available-teams table at laptop width, where all eight cells render, so position N is
   column N: Cmp, Team, 3-0, Bank 3, Gain 3, Season, Gain, Do. */
.cg1{width:46px} .cg2{width:23%} .cg3{width:10%} .cg4{width:11%}
.cg5{width:11%} .cg6{width:12%} .cg7{width:11%} .cg8{width:15%}
@media (max-width:560px){
  .hide-s{display:none}
  /* THE AVAILABLE-TEAMS TABLE KEEPS ALL EIGHT COLUMNS ON A PHONE AND SCROLLS SIDEWAYS INSTEAD.
     Casey, 31 Aug 2026: "on the college and NFL pickup tabs it looks like only part of the table
     is displayed... even if I had to scroll to the right, I would be fine with doing that to see
     all the necessary information that's on the desktop version."
     This overturns the earlier decision to drop columns HERE, on his say-so, and it does not
     overturn the standing rule: the PAGE still never scrolls sideways. The table scrolls inside
     its own `.scr` container, which is the documented way to carry wide content.
     A happy side effect: with no cells hidden, the eight <col> elements map one-to-one again, so
     the desktop widths apply unchanged and the column-RENUMBERING trap that hiding cells created
     (see START_HERE 2.34) simply does not arise on this table any more. */
  [data-avail] table{min-width:660px}
  [data-avail] .hide-s{display:table-cell}
  [data-avail] .c-bank{display:table-cell}
  main{padding:10px 10px 60px}
  /* THE BEST-AVAILABLE TABLE ON A PHONE. Casey, 30 Aug 2026: "The best available tables are
     not rendering properly on the iphone. The verdict column has vertical text which makes it
     hard to read." It did: seven columns sized by a desktop colgroup left the last one about
     twenty pixels wide, and `overflow-wrap:anywhere` -- which exists so long team names wrap --
     then broke KEEP into four stacked letters.
     Fixed by dropping to the columns a decision actually needs (the rest are in the team panel
     a tap away) and forbidding a mid-word break anywhere except the team name.

     THE WIDTHS USED TO BE SET ON THE CELLS with !important, because CSS cannot override a
     colgroup written as inline style attributes. They summed to 100% across FOUR columns, so
     adding the Cmp column squeezed Gain 3 to zero width and clipped it -- a fix from one week
     silently breaking the next feature. The colgroup now carries CLASSES instead of inline
     widths, so it can simply be restated for this width (above), and the per-cell overrides are
     gone. One place decides column widths. */
  .c-bank{display:none}
  td.c-then{padding-left:2px;padding-right:2px}
  /* The roster table above it has the same problem in miniature: a wrapped team name makes the
     row tall, and its number columns must not also break mid-value. */
  /* DATA cells only. A multi-word HEADER is allowed to wrap onto two lines -- that is normal
     and readable; forcing it onto one just clips it. It is the VALUES that must never break. */
  #pickBody table td.num{white-space:nowrap;overflow-wrap:normal}
  #pickBody table th{white-space:normal;overflow-wrap:break-word;hyphens:auto}
  th.c-p30, td.c-p30, th.c-gain, td.c-gain, th.c-then, td.c-then,
  th.c-bank, td.c-bank{white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
  .pill{white-space:nowrap}
  /* A five-column game table does not fit a phone. The MODEL spread goes -- it is the same
     information as the win probability beside it, expressed differently -- and "not posted"
     becomes a dash with the explanation on the row's own tap-through. Win probability and the
     Vegas line are the two a decision actually turns on, so those stay. */
  .dtl th.c-model, .dtl td.c-model{display:none}
  .dtl .nolink{font-size:0}
  .dtl .nolink::after{content:'—';font-size:13px}
  header{padding:8px 10px 0}
  h1{font-size:15px}
  /* A chip may not be wider than the phone. nowrap keeps a LABEL intact, which is right, but
     it also let one chip run 34px past the viewport once the results chip grew a clock. Wrapping
     at spaces keeps every word whole and the page still does not scroll sideways. */
  .chip{font-size:10px;white-space:normal;max-width:100%}
}
</style></head><body>
<header>
  <h1>Owners League — Season Dashboard</h1>
  <div class="chips" id="chips"></div>

/* namefix.norm, in JavaScript. The Python build and this page must agree on what "the same
   team" means or the ESPN join silently loses games. Kept character-for-character equivalent
   to namefix.norm() rather than "close enough". */
function norm(s){
  s = String(s).replace(/^vs /,'').replace(/^at /,'').trim().replace(/&/g,'and');
  s = s.replace(/\bState\b/g,'St').replace(/\bSaint\b/g,'St')
       .replace(/['’]/g,'').replace(/[.\-()]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  return s;
}
/* RESOLVED WITHIN THE POOL THE GAME CAME FROM. ESPN identifies an NFL team by its LOCATION --
   "Minnesota", "Cincinnati", "Houston" -- and eight of those strings are also the whole name of
   a college team. A flat map put the Vikings' game under college Minnesota, which is what
   Casey saw: his college Minnesota appeared on the NFL scoreboard and his Bengals did not. */
const ESPN = {NFL: new Map(Object.entries(DATA.espn.NFL)),
              COL: new Map(Object.entries(DATA.espn.COL))};
function resolve(espnTeam, pool){
  const m = ESPN[pool === 'NFL' ? 'NFL' : 'COL'];
  const tries = pool === 'NFL'
    ? [espnTeam.displayName, espnTeam.location + ' ' + espnTeam.name, espnTeam.location]
    : [espnTeam.location, espnTeam.shortDisplayName, espnTeam.displayName, espnTeam.name];
  for (const k of tries){ if (!k) continue; const hit = m.get(norm(k)); if (hit) return hit; }
  return null;
}
/* Casey, 30 Aug 2026: "there could be three owners attached to the same team. So you also need
   to label the division with the owner next to each team." Only HIS division decides whether a
   team is available; the other two are labels. */
function labelsOf(name){ return (BY.get(name) || {}).labels || []; }
function ownerOf(name){
  const t = BY.get(name);
  if (!t || t.owner == null) return null;
  return OWNERS[t.owner];
}
const MY_DIV = 'PFD';
function ownerHTML(name){
  const ls = labelsOf(name);
  if (!ls.length) return '<span class="own nolink">free agent in all three divisions</span>';
  return '<span class="own">' + ls.map(l =>
    `<span class="dv">${l.div}</span> <b class="${l.div===MY_DIV && l.owner===OWNERS[ME] ? 'isme':''}">${l.owner}</b>`
  ).join(' · ') + '</span>';
}

/* WHAT TIME IS IT WHERE CASEY IS. He asked on 31 Aug 2026 for the time in ARIZONA next to the
   results stamp. Arizona does not observe daylight saving, so it is UTC-7 all year and is NOT
   the same as Pacific for half of it -- which is exactly why naming the zone matters more here
   than in most places. Formatted from the IANA zone rather than an offset so it cannot drift. */
/* A short weekday-and-month form reads better in a sentence than an ISO date, and he reads
   these on a phone. (Deliberately no example here: a suite forbids a date-shaped string outside
   season_calendar.py, and it is right to be blunt about that even in a comment.) */
function pretty(iso){
  if (!iso) return '';
  const d = new Date(iso + 'T12:00:00Z');
  return d.toLocaleDateString('en-US', {timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric'});
}

function azNow(){
  try {
    return new Date().toLocaleString('en-US', {timeZone: 'America/Phoenix',
      hour: 'numeric', minute: '2-digit'}) + ' AZ';
  } catch (e) { return null; }
}

/* ONE PATTERN FOR EVERY EXPLANATION ON THE PAGE. Casey, 31 Aug 2026: "where you have a bunch of
   text following a table or before a table, it makes the page kinda difficult to read and longer
   than it needs to be. So can we do something like we did on the standings page where we have a
   question mark and it can push the button and it'll expand."
   The standings explainer proved the shape; this makes it reusable so the tables are the page and
   the prose is one tap away. Deliberately NOT applied to warnings -- a workbook correction, a
   trade that cannot be dated, "nothing can be dropped yet" -- because a warning nobody opens is a
   warning nobody reads. Explanations collapse; problems stay on the page. */
function explain(title, html){
  return `<details class="how"><summary>${title}</summary><div class="note">${html}</div></details>`;
}

function renderChips(){
  const c = [];
  /* Casey, 31 Aug 2026: "please capitalize words. It looks terrible when the first word in this
     is a lowercase, it looks sloppy." Every chip now starts with a capital. */
  c.push(`<span class="chip" title="When this file was made. It is not the same as how current the scores in it are — that is the Results chip. Arizona time, which does not change for daylight saving.">Built ${DATA._built}</span>`);
  // Casey, 31 Aug 2026: "it makes it sound like I need to press refresh to get live scores." Right call -- live scores already update on their own (see the LIVE chip). This button is only for pulling down a NEWER BUILD of the page itself (new rosters, features, fixes), so it sits right next to the Built time, not implying anything about scores.
  c.push(`<button type="button" class="chip chip-action" title="Checks for a newer BUILD of this page (rosters, features, fixes) and loads it if one exists. Live scores already update on their own every minute -- this has nothing to do with those." onclick="location.href=location.pathname+'?v='+Date.now();">&#8635; Check for update</button>`);
  const src = DATA.owner_source === 'draft'
    ? `<span class="chip warn" title="${DATA.owner_note}">Rosters: draft day</span>`
    : `<span class="chip" title="${DATA.owner_note}">Rosters from your workbook</span>`;
  c.push(src);
  const ages = (DATA.inputs||[]).filter(x=>x.age!=null);
  if (ages.length){
    const oldest = ages.reduce((a,b)=>b.age>a.age?b:a);
    const worst = oldest.age;
    /* "You also have an inputs current date, but that is unclear as to what inputs." -- Casey,
       31 Aug 2026. It meant three hand-typed things that nothing in the pipeline refreshes:
       Vegas win totals for the NFL, the same for FBS, and the injury sweep. Ownership is NOT
       among them -- that has its own chip -- which is what made the label ambiguous. Naming them
       on the chip itself, rather than only in a tooltip nobody hovers on a phone. */
    /* No clock on this one, and that is the honest answer rather than an omission: the sources
       publish a DATE and no time. Vegas win totals are a daily figure; the injury sweep is dated
       to the day it was done. Printing "12:00 AM" would be inventing precision. */
    c.push(`<span class="chip ${worst>=14?'bad':worst>=7?'warn':''}" title="${
      ages.map(x=>`${x.label}: ${x.when} (${x.age} days old) — from ${x.where}`).join('\n')
      }\n\nThese are typed in by hand and go stale quietly — rebuilding does not refresh them. They carry a date and no time, because that is all the sources give. Your rosters are NOT one of these; they have their own chip.">${
      worst>=7 ? `Win totals & injuries: ${oldest.when} (${worst} days old)`
               : `Win totals & injuries: ${oldest.when}`}</span>`);
  }
  /* RESULTS COVERAGE IS ITS OWN CHIP. The build date says when the file was made; it does not
     say how far the RESULTS in it run, and those are different dates whenever a game finishes
     after the build. Saturday's slate is the case that matters. */
  if (DATA.results_through){
    const stale = DATA.asof > DATA.results_through;
    /* Casey, 31 Aug 2026: "Why do you have a separate built date from results known through
       date. I would think they would be the same and you would refresh results every time you
       build." They ARE refreshed every build -- but the build runs in a sandbox that cannot
       reach ESPN, so what it can bake is whatever has been verified by hand at that moment. The
       PAGE reaches ESPN itself and goes further, which is why the two dates exist and why this
       chip says which one you are looking at right now. */
    /* Guarded: renderChips runs during init, and these two are declared further down the
       file. A bare read would sit in the temporal dead zone and throw on first paint. */
    /* Casey, 31 Aug 2026: "I don't understand what you mean by results baked to eight twenty
       nine. I told you to refresh it today. Today was eight thirty."
       The old chip compared the last result we hold against TODAY'S DATE and warned that the
       31 Aug slate was missing. Nothing was played on 30 or 31 August -- the next kickoff is
       3 September. It was warning him about games that do not exist. What matters is whether a
       GAME has been played that we do not have, so that is what it counts now. */
    const live = (typeof SEASON_LIVE !== 'undefined') && SEASON_LIVE === true
              && (typeof LAST_SEASON_MERGE !== 'undefined') && LAST_SEASON_MERGE;
    const missing = ((DATA.games_since_results || {}).n) || 0;
    const label = live
      ? `Scores live from ESPN · ${azNow() || 'just now'}`
      : missing
        ? `Scores through ${pretty(DATA.results_through)} · ${missing} game${missing === 1 ? '' : 's'} played since are missing`
        : `Scores complete through ${pretty(DATA.results_through)} · no games since`;
    c.push(`<span class="chip ${live ? '' : missing ? 'warn' : ''}" title="${live
      ? 'This page asked ESPN for scores and got them. These are up to the minute.'
      : missing
        ? 'These scores were checked by hand when the file was made. Games played since are not in the projections yet — ask for a refresh.'
        : 'Every game played so far is in. Nothing has been played since this date, so nothing is missing. The page also asks ESPN for scores itself when it can reach it.'}">${label}</span>`);
  }
  /* Never silent. A model that quietly re-rates behind a number he is acting on would be worse
     than one that does not re-rate at all. */
  /* THE RE-RATING SWITCH USED TO LIVE HERE AND DOES NOT ANY MORE. Casey, 31 Aug 2026: "if
     anybody were to just come into the page, what would they understand it for? they wouldn't
     know what that means, and it appears like you have to click on it to change it to August
     ratings only."
     Two faults, both mine. The chip row is a row of DATE STAMPS -- when the file was built, how
     old the win totals are, how current the scores are. A model setting sitting among them reads
     as another stamp. And it was a toggle with no affordance: nothing said it could be clicked,
     and its label named a state without naming what the state was about. A control has to say
     what it controls. It now lives on the Pickups tab, next to the projections it governs, as a
     labelled pair of buttons where both options are visible at once. */
  el('chips').innerHTML = c.join('');
}

/* ---------------- SCORES ---------------- */
/* ESPN is fetched HERE, in the browser, not baked at build time. A score frozen when the file
   was made is wrong by kickoff, and Casey asked for live scores. The trade is that this needs
   wi-fi: when the fetch fails the page says so and falls back to the fixtures it was built
   with, because a blank list reads as "no games today" and that is a different statement. */
const EP = {
  NFL: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
  FBS: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300',
  FCS: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=81&limit=300',
};
/* OPENS ON HIS OWN TEAMS. Casey, 31 Aug 2026: "have it default to be filtered on my teams."
   On a Saturday the board carries 130 college games and eleven of them are his. The filter row
   shows "My teams" pressed, so the state is visible rather than mysterious, and an empty result
   says so and offers the way out. */
let FILTER = 'ME';
let GAMES = null, FETCH_ERR = null, UNMATCHED = [];

/* WHERE TO WATCH IT. ESPN publishes the broadcaster two different ways depending on the sport
   and how far out the game is: `geoBroadcasts` (structured, one entry per outlet, with a type of
   TV or Web) and a flatter `broadcasts` list of names. Read the structured one first and fall
   back to the flat one, because either can be the only one present.
   STREAMING COUNTS. ESPN+ and ESPNU carry most of the FCS slate, and "where can I watch this"
   is answered by a streaming service just as well as by a channel — filtering Web out would
   leave dozens of his games looking untelevised when they are not. */
function tvOf(c){
  const out = [];
  for (const b of (c.geoBroadcasts || [])){
    const nm = ((b.media || {}).shortName || '').trim();
    if (nm) out.push(nm);
  }
  if (!out.length)
    for (const b of (c.broadcasts || []))
      for (const nm of (b.names || [])) if (nm) out.push(String(nm).trim());
  return [...new Set(out)].join(' / ');
}
/* AN EMPTY LISTING IS NOT A MISSING FEATURE, and it must not read as one. A game ESPN lists no
   broadcaster for says so in words. */
function tvHTML(tv){
  return tv
    ? `<span class="tv" title="Where this game is being shown, as ESPN lists it. Includes streaming — ESPN+ and ESPNU carry most of the FCS slate.">${tv}</span>`
    : `<span class="notv" title="ESPN publishes no broadcaster for this game. That is ESPN's listing being empty, not this page failing to look — check back closer to kickoff.">TV not listed</span>`;
}

async function loadScores(){
  const out = [], errs = [], unmatched = new Set();
  await Promise.all(Object.entries(EP).map(async ([pool, url]) => {
    try {
      const r = await fetch(url, {cache:'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      for (const ev of (j.events || [])){
        const c = (ev.competitions || [])[0]; if (!c) continue;
        const cs = c.competitors || [];
        const side = w => {
          const t = cs.find(x => x.homeAway === w) || {};
          const nm = resolve(t.team || {}, pool);
          if (!nm && (t.team||{}).location) unmatched.add((t.team||{}).displayName || t.team.location);
          return {espn: (t.team||{}).displayName || '?', name: nm, owner: nm ? ownerOf(nm) : null,
                  mine: nm ? (BY.get(nm)||{}).owner === ME : false,
                  score: t.score == null ? null : Number(t.score), winner: !!t.winner};
        };
        const st = (ev.status || {}).type || {};
        out.push({pool, home: side('home'), away: side('away'), tv: tvOf(c),
                  state: st.state, detail: st.shortDetail || st.detail || '',
                  done: st.state === 'post', live: st.state === 'in',
                  date: ev.date,
                  // ESPN's own event id, so a game can open its Gamecast. Casey, 30 Aug 2026:
                  // "make it so when I click on a matchup on the scoreboard for each game that
                  // takes me to the gamecast page on ESPN."
                  id: ev.id});
      }
    } catch (e) { errs.push(`${pool}: ${e.message}`); }
  }));
  GAMES = out; FETCH_ERR = errs.length ? errs : null; UNMATCHED = [...unmatched];
  LAST_FETCH = new Date();
  renderFilters(); renderScores();
  if (applyLiveToSeason()){ renderStandings(); renderSlots(); }
}

/* Casey, 30 Aug 2026: "Do I have to refresh the page to see the scores update or is it live
   with no page refresh needed." It was reload-only. It now re-asks ESPN every 60 seconds while
   any game is in progress, and every 5 minutes otherwise, so a Saturday afternoon updates
   itself. The clock is shown, because "live" with no timestamp is a claim the reader cannot
   check -- and if the network drops, the page must not keep showing an old score as current. */
/* THE LIVE OVERLAY. The scoreboard poll already fetches the current week for all three pools,
   which is exactly the set of games whose result can still change. After each refresh those
   FINAL games are folded into the season totals, replacing whatever that week previously held,
   and the Standings and Slots tabs re-render. A game in progress contributes NOTHING: a lead is
   not a win, and crediting one would make the standings jump around and then take it back. */
/* EVERY FINAL SCORE THE PAGE FETCHES, KEYED BY TEAM AND DATE, so the schedule panels and the
   compare table can show a result the FILE does not have. Casey, 31 Aug 2026: "South Dakota
   State shows no results for their first game that they have played. There is either a bug or
   you haven't refreshed."
   Both, in effect. The build sandbox cannot reach ESPN, so SDSU's 29 Aug game was baked as
   `unknown` -- but the page HAD the score, in GAMES, and was using it for the standings while
   the schedule panel two tabs away still said "no result yet". One store of a fact updated and
   the other did not. */
const LIVE_SCORES = new Map();          // "Team|YYYY-MM-DD" -> {pf, pa, won}
function liveScore(team, iso){
  return LIVE_SCORES.get(team + '|' + iso) || null;
}
/* One renderer for "the file did not have this score": show ESPN's if the page fetched it, and
   otherwise say so plainly. An absence is never an answer, and a blank cell beside a game marked
   PLAYED reads as nil-nil. */
function scoreOrNot(team, iso){
  const lv = liveScore(team, iso);
  if (!lv) return '<span class="nolink" title="This game was played, but no verified score was in the file when it was built and ESPN has not been reached from this page. It is unknown, not nil.">result not in this build</span>';
  return `<span class="fin ${lv.won ? 'g' : lv.tied ? 'y' : 'b'}" title="From ESPN, live on this page — later than anything baked into the file.">${
    lv.won ? 'W' : lv.tied ? 'T' : 'L'} ${lv.pf}–${lv.pa}</span>`;
}
function indexLiveScores(){
  if (!GAMES) return;
  for (const g of GAMES){
    if (!g.done || !g.date) continue;
    const iso = String(g.date).slice(0, 10);
    for (const [a, b] of [[g.home, g.away], [g.away, g.home]]){
      if (!a.name || a.score == null || b.score == null) continue;
      /* `name` is already the BOARD name here -- the scoreboard resolves ESPN's naming when it
         builds GAMES, and the standings look SEASON up by exactly this key. Resolving twice
         would be a second place for the two namespaces to disagree. */
      LIVE_SCORES.set(a.name + '|' + iso,
        {pf: a.score, pa: b.score, won: a.score > b.score, tied: a.score === b.score});
    }
  }
}

function applyLiveToSeason(){
  indexLiveScores();
  if (SEASON === null || !GAMES) return false;
  const touched = new Set();
  const wk = {};
  for (const g of GAMES){
    if (!g.done) continue;
    const w = weekOf(g.pool, g.date);
    for (const [me_, other] of [[g.home, g.away], [g.away, g.home]]){
      if (!me_.name || me_.score == null || other.score == null) continue;
      const k = me_.name + '|' + w;
      wk[k] = {team: me_.name, w, pool: g.pool,
               pts: pointsFor(g.pool, me_.score, other.score),
               won: me_.score > other.score, tied: me_.score === other.score,
               bl: (me_.score - other.score) >= (DATA.scoring.blowout_margin[g.pool] || 50),
               so: other.score === 0 && me_.score > other.score};
      touched.add(me_.name);
    }
  }
  let changed = false;
  for (const v of Object.values(wk)){
    const cur = SEASON.get(v.team)
      || {pts: 0, w: 0, l: 0, t: 0, bl: 0, so: 0, n: 0, wk: {}};
    const had = cur.wk[v.w];
    if (had === v.pts) continue;              // already counted, nothing to redo
    if (had != null) cur.pts -= had; else cur.n++;
    cur.pts += v.pts;
    cur.wk[v.w] = v.pts;
    if (had == null){
      if (v.won) cur.w++; else if (v.tied) cur.t++; else cur.l++;
      if (v.bl) cur.bl++;
      if (v.so) cur.so++;
    }
    SEASON.set(v.team, cur);
    changed = true;
  }
  if (changed){
    SEASON_LIVE = true; LAST_SEASON_MERGE = new Date();
    /* A new final score is new evidence, so the ratings move with it and every projection on the
       page follows. This is the whole point: the model gets smarter as the season goes on. */
    computeRerate(); renderPick();
    /* The chip says whether results are live; it has to be redrawn when that becomes true, or
       it keeps advertising the baked date over live numbers. */
    try { renderChips(); } catch (e) {}
  }
  return changed;
}
let LAST_SEASON_MERGE = null;

let LAST_FETCH = null, POLL = null;
function schedulePoll(){
  if (POLL) clearTimeout(POLL);
  const live = (GAMES || []).some(g => g.live);
  POLL = setTimeout(() => loadScores().then(schedulePoll), live ? 60000 : 300000);
}

/* IN-PROGRESS GAMES FIRST. Casey, 30 Aug 2026: "can you put the games that are still in
   progress at the top of the scoreboard." On a Saturday the live games are the only ones being
   watched, and they were buried in kickoff order among forty finals. Live, then upcoming, then
   finished — and by kickoff within each group, so the order inside a group never jumps around
   between refreshes. Defined here rather than inside renderScores because the sort runs before
   any local const would exist. */
const rank = g => g.live ? 0 : (g.done ? 2 : 1);

function renderScores(){
  const b = el('scoreBody');
  if (GAMES === null){ b.innerHTML = `<div class="card"><div class="empty">Loading scores from ESPN…</div></div>`; return; }
  let list = GAMES.slice();
  if (FILTER === 'ME') list = list.filter(g => g.home.mine || g.away.mine);
  else if (FILTER !== 'ALL') list = list.filter(g => g.pool === FILTER);
  list = list.filter(g => matchQ([g.home.name || g.home.espn, g.away.name || g.away.espn]));
  list.sort((a, b2) => rank(a) - rank(b2) || (a.date||'').localeCompare(b2.date||''));

  /* THE FALLBACK. When ESPN cannot be reached the page shows the FIXTURES it was built with:
     who plays whom, when, and who owns them. It does NOT show scores, because the build
     environment cannot reach ESPN either and a baked score would be an invented one. Saying
     which of those two things you are looking at is the whole point — a schedule presented as
     a scoreboard is worse than no scoreboard. */
  if (FETCH_ERR){
    const fx = fallbackList();
    const side = (nm, ow, mine, score, won) => `<div class="t">
        <span><span class="${mine?'mine':''}" ${mine?'title="On your Predator roster."':''}>${nm}</span>${ownerHTML(nm)}</span>
        <span class="s ${won?'win':''} ${score==null?'d':''}">${score==null?'—':score}</span></div>`;
    /* A game with a score is FINAL, a past game with no score is played-but-unknown here, and
       a future game is scheduled. Three different statements, never collapsed into one. */
    const when = g => g.nc ? 'NO CONTEST — abandoned, no win, no loss'
      : g.hs != null ? 'final'
      : g.done ? 'played — result not in this file' : 'scheduled';
    const body = fx.length ? fx.map(g => `<div class="gm">
        ${side(g.home, g.ho, g.hm, g.hs, g.won === g.home)}
        ${side(g.away, g.ao, g.am, g['as'], g.won === g.away)}
        <div class="st"><span class="pill p-${g.pool.toLowerCase()}">${g.pool}</span>
          <span class="d">${g.wk?('Wk '+g.wk+' · '):''}${g.when} · ${when(g)}</span></div>
        <div class="st"><span class="notv" title="Broadcasters come from ESPN's live scoreboard, which this page cannot reach right now. They are not stored in the file.">TV — needs a connection</span></div></div>`).join('')
      : `<div class="empty">${emptyWhy()}${escapeHatch()}</div>`;
    b.innerHTML = `<div class="card"><h2 class="y">Showing the schedule, not live scores</h2>
      <div class="empty"><p>This page asks ESPN for scores directly and could not reach it
      (${FETCH_ERR.map(e=>e.split(':')[0]).join(', ')} failed). Live scores need an internet
      connection.</p>
      <p>Below is what this file was built with on <b>${DATA._built}</b>: the fixtures, plus a
      score for every game whose result was verified at build time. A past game showing dashes
      is one this file does not have the result for — the build cannot reach ESPN either, and an
      invented score is worse than a dash. Reload once you are online.</p>
      </div></div>
      <div class="card"><div class="games">${body}</div>
      ${ownerKey()}</div>`;
    return;
  }
  let head = '';
  if (!list.length){
    b.innerHTML = head + `<div class="card"><div class="empty">${emptyWhy(true)}${escapeHatch()}</div></div>`;
    return;
  }
  let lastRank = null;
  const groupName = {0: '● In progress', 1: 'Upcoming', 2: 'Final'};
  const rows = list.map(g => {
    const r = rank(g);
    const hdr = r === lastRank ? '' :
      `<div class="grp ${r === 0 ? 'y' : 'd'}">${groupName[r]}</div>`;
    lastRank = r;
    /* The NAME carries ownership, the SCORE carries the result. Never the same element, which
       is what makes it safe for ownership to be a colour again. */
    const t = s => {
      const w = g.done && s.winner;
      const nm = s.name || s.espn;
      return `<div class="t">
        <span><span class="${s.mine?'mine':''}" ${s.mine?'title="On your Predator roster."':''}>${nm}</span>
          ${s.name ? ownerHTML(s.name) : '<span class="own nolink">not matched to the board</span>'}</span>
        <span class="s ${w?'win':''}" ${w?'title="Winner."':''}>${s.score==null?'':s.score}</span></div>`;
    };
    const cls = g.live ? 'y' : (g.done ? 'd' : 'd');
    /* THE WHOLE CARD IS THE LINK. A small "gamecast" word would be a 30px tap target on a
       phone; the card is already the thing being pointed at. It opens in a new tab so the
       dashboard — which is polling, and holds the standings you were reading — is never
       navigated away from and reloaded. */
    const url = g.id ? `https://www.espn.com/${g.pool === 'NFL' ? 'nfl' : 'college-football'}/game/_/gameId/${g.id}` : null;
    const body = `${t(g.home)}${t(g.away)}
      <div class="st"><span class="pill p-${g.pool.toLowerCase()}">${g.pool}</span>
        <span class="${cls}">${g.live?'● LIVE · ':''}${g.detail}</span>${
        url ? '<span class="gc">Gamecast ↗</span>' : ''}</div>
      <div class="st">${tvHTML(g.tv)}</div>`;
    return hdr + (url
      ? `<a class="gm gml" href="${url}" target="_blank" rel="noopener noreferrer"
           title="Open this game's Gamecast on ESPN in a new tab">${body}</a>`
      : `<div class="gm">${body}</div>`);
  }).join('');
  const un = UNMATCHED.length ? `<div class="note"><b class="y">${UNMATCHED.length} ESPN team name${
      UNMATCHED.length===1?'':'s'} could not be matched to the board</b>, so no owner is shown for
      ${UNMATCHED.length===1?'it':'them'}: ${UNMATCHED.slice(0,12).join(', ')}${UNMATCHED.length>12?'…':''}.
      The games are still listed — a name I cannot match is a gap in my table, not a reason to hide a game.</div>` : '';
  b.innerHTML = head + `<div class="card"><div class="games">${rows}</div>${un}
    <div class="note"><b>Tap any game</b> to open its Gamecast on ESPN in a new tab — this page
    keeps polling behind it. Scores come from ESPN's public scoreboard. The page re-asks on its own —
    every minute while a game is live, every five otherwise — so you do not need to reload.
    ${LAST_FETCH ? `Last updated <b>${LAST_FETCH.toLocaleTimeString()}</b>.` : ''}</div>
    ${ownerKey()}</div>`;
}

/* SAYING WHY IT IS EMPTY IS HALF THE JOB; THE OTHER HALF IS THE WAY OUT. The board now OPENS
   filtered to his eleven teams, so on a Tuesday the first thing he sees could be an empty panel.
   A panel with nothing in it says why it is empty AND what can be done instead. */
function escapeHatch(){
  if (FILTER === 'ALL') return '';
  return `<div style="margin-top:12px"><button class="f" onclick="setFilter('ALL')"
    title="Drop the filter and list every game ESPN is showing">Show all games</button></div>`;
}

/* AN EMPTY LIST IS NOT AN ANSWER. "No games" and "the NFL has not started yet" and "you own
   nobody playing today" are three different statements, and the reader cannot tell them apart
   from a blank panel. Each one is said. */
function emptyWhy(live){
  const src = live ? 'ESPN is not listing' : 'This file was built without';
  if (FILTER === 'ME')
    return `None of your eleven teams appear in ${live ? 'the games ESPN is listing right now'
      : 'the fixture window this file was built with'}.`;
  if (FILTER === 'NFL'){
    const opens = DATA.nfl_week1;
    if (DATA.asof < opens)
      return `The NFL season has not started. Week 1 opens on ${opens}, so there is nothing to
        show yet — this is not a broken filter.`;
    return `${src} any NFL games right now.`;
  }
  if (FILTER === 'ALL')
    return live ? `ESPN is not listing any games right now. Its scoreboard shows the current
      week, so between the last game of one week and the first of the next it is legitimately
      empty.` : `No fixtures in the window this file was built with (${DATA.asof}).`;
  return `${src} any ${FILTER} games in this window.`;
}

function fallbackList(){
  const me = n => (BY.get(n)||{}).owner === ME;
  let fx = (DATA.fixtures||[]).map(g => ({...g, hm: me(g.home), am: me(g.away)}));
  if (FILTER === 'ME') fx = fx.filter(g => g.hm || g.am);
  else if (FILTER !== 'ALL') fx = fx.filter(g => g.pool === FILTER);
  fx = fx.filter(g => matchQ([g.home, g.away]));
  // Upcoming before finished here too: the fallback is read for the same reason as the live
  // board, and burying tonight's fixtures under last week's results is the same mistake.
  return fx.sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0)
    || (a.when || '').localeCompare(b.when || ''));
}

let Q = '', OWNQ = '';
/* One chip, always in the same place, that says which of the two things you are looking at.
   LIVE means the scores on screen came from ESPN just now and will keep updating on their own.
   SCHEDULE ONLY means ESPN could not be reached and these are the fixtures built into the file
   -- which is what you get on a hosted link and on a phone, and is not a failure so much as a
   different mode. Never both, never neither, and never silent. */
function statusChip(){
  if (GAMES === null)
    return `<span class="status st-wait"><span class="dot"></span>CHECKING…</span>`;
  if (FETCH_ERR)
    return `<span class="status st-off" title="This page asks ESPN for scores directly and could not reach it. What you see below is the fixture list built into this file on ${DATA._built}, with verified final scores where the build had them — not live.">
      <span class="dot"></span>SCHEDULE ONLY</span>`;
  return `<span class="status st-live" title="Scores came straight from ESPN and refresh on their own — every minute while a game is in progress, every five otherwise. No need to reload.">
    <span class="dot"></span>LIVE${LAST_FETCH ? ' · ' + LAST_FETCH.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}</span>`;
}
/* The owner line is three rows deep, so it needs a key. Casey plays in PFD only; VFD and SFD
   are labels on the same team, because all three divisions draft the same pool separately. */
function ownerKey(){
  return `<div class="note"><b class="mine">Purple</b> is a team on your Predator roster.
    <b class="win">Green</b> is the winning SCORE of a finished game. They are two different
    facts on two different parts of the line — the name never says who won and the score never
    says who owns them — which is why both can be coloured at once without confusing each other.
    <b class="tv">Cyan</b> is the network showing the game, as ESPN lists it.
    ${FILTER === 'ME' ? `<br><b>This board opens on your teams only.</b> Tap <b>All</b> above for
    every game.` : ''}
    Under each team are its owners in all three divisions:
    <b>PFD</b> Predator (yours), <b>VFD</b> Viper, <b>SFD</b> Scorpion. Only PFD decides whether
    you can pick a team up. Ownership read from
    <b>${DATA.owner_source === 'draft' ? 'the draft board' : DATA.owner_source}</b>.</div>`;
}

function renderFilters(){
  const fs = [['ALL','All'],['NFL','NFL'],['FBS','FBS'],['FCS','FCS'],['ME','My teams']];
  const owners = [];
  for (const [dv, list] of Object.entries(DATA.division_owners || {}))
    for (const o of list) owners.push(dv + ' · ' + o);
  el('sfilters').innerHTML = statusChip() +
    fs.map(([k,l]) => `<button class="f ${k==='ME'?'me':''}" aria-pressed="${FILTER===k}"
      onclick="setFilter('${k}')">${l}</button>`).join('')
    + `<input class="search" id="q" type="search" placeholder="Search team…" value="${Q}"
        oninput="Q=this.value;renderScores()" aria-label="Search for a team">`
    + `<select class="search" id="ownq" onchange="OWNQ=this.value;renderScores()"
        aria-label="Filter by owner"><option value="">Any owner…</option>`
      + owners.map(o => `<option value="${o}" ${OWNQ===o?'selected':''}>${o}</option>`).join('')
      + `</select>`;
}
function setFilter(k){ FILTER = k; renderFilters(); renderScores(); }
function matchQ(names){
  if (Q){ const q = Q.toLowerCase();
    if (!names.some(n => n && n.toLowerCase().includes(q))) return false; }
  if (OWNQ){ const [dv, ow] = OWNQ.split(' · ');
    if (!names.some(n => labelsOf(n).some(l => l.div === dv && l.owner === ow))) return false; }
  return true;
}

/* ---------------- PICKUPS ---------------- */
const V = {
  'SEASON KEEPER': ['v-keep', 'Worth holding to the end of the season, postseason included.'],
  'HOLD LONGER':   ['v-hold', 'Worth keeping past the mandatory hold, but not all year.'],
  'STREAM':        ['v-stream','Worth exactly the three games you are forced to hold. Flip it after.'],
  'TOO FEW GAMES': ['v-no',   'Cannot complete a 3-game hold from here.'],
};
const pct = p => p == null ? '—' : Math.round(p*100) + '%';
/* MM-DD, not YYYY-MM-DD. On a 390px phone the full date wrapped onto two lines in every row
   of the panel, which is where Casey said he wants to use this. The year is in the header. */
const when = (w, pool) => pool === 'NFL' ? ('Wk ' + w)
  : (String(w).length === 10 ? String(w).slice(5) : String(w));

/* THE HOLD COLUMN REPORTS THE HOLD BEING RECOMMENDED, not always the 3-game minimum.
   Casey, 30 Aug 2026: "The hold column say 3 weeks for every team, but should it provide more
   weeks for the teams that are season keepers." He is right, and it was worse than cosmetic:
   the column sat beside Pts·hold and Pts·season and appeared to be the duration BOTH of those
   were measured over, so a keeper looked like it earned 9.63 points in three weeks. It now
   shows the weeks the verdict actually asks for, with the mandatory minimum on hover. */
function holdLine(t){
  const wks = t.keep_weeks || t.hold_weeks;
  const byes = t.hold_byes ? ` <span class="y" title="A bye does not advance the hold — the hold is 3 GAMES — but it still costs a week of the roster slot.">+${t.hold_byes} bye</span>` : '';
  const min = t.keep_games > DATA.hold_games
    ? ` <span class="d" title="The league minimum is ${DATA.hold_games} games, which for this team is ${t.hold_weeks} week${t.hold_weeks===1?'':'s'}. The larger figure is what the verdict recommends.">(min ${t.hold_weeks})</span>`
    : '';
  return `${wks} wk${wks===1?'':'s'}${byes}${min}`;
}

let PQ = '', OPEN = null;

/* ONE COLLEGE LIST. Casey, 30 Aug 2026: "Don't break up FCS vs FBS. That should be one list
   with the top ranked pickups across both." They compete for the same eight college slots, so
   splitting them made him compare two rankings by eye. Surplus is in league points for both,
   so they are directly comparable and the pool pill says which is which.
   The NFL stays separate because it is a different slot: an NFL team can only replace one of
   his three NFL teams, never a college one. */
/* RANKED ON WHAT THE SWAP GAINS, against the team it would actually replace.
   Casey, 30 Aug 2026: "Even though you have teams that are season long keepers, these keepers
   are not better than what I already have." The old ranking measured every pickup against a
   generic streaming baseline, which answers "is this better than the waiver wire" -- a question
   nobody has to decide. The decision is a SWAP, so the incumbent is the baseline.

   AND IT RANKS ON THE NEXT THREE GAMES, NOT THE SEASON. Also his, and he is right about why:
   "Until we see more actual results it seems safer to go with a 3 week team to bank points
   where teams have an easy schedule." A rest-of-season number this early is a preseason opinion
   compounded over ten games; a three-game number is the same opinion over three. Both are
   shown, the season column is labelled for what it is, and the default order is the one you can
   actually act on. That changes as results accumulate -- see the confidence line. */
/* WHICH OF MY TEAMS WOULD I DROP? Everything on this tab hangs off that one choice.
   Casey, 30 Aug 2026: "there will be weeks where I want to drop more than one team. It looks
   like it only compares my drop first team to the available team. I need the ability to pick
   one of my teams and have the gain columns update based on my team that I select."

   And it is not only the Gain columns. The team he drops decides WHEN the swap happens, which
   decides WHICH GAMES he would own, which decides every number in the table and every row in
   the schedule panel. He caught the consequence exactly: "If I select Nebraska, then I won't be
   able to pick up East Carolina until after 9/26." So the whole tab is recomputed from the
   selection, in the page, rather than baked once per team in the build. */
let DROP = {NFL: null, COL: null};

function slotFor(kind){
  const list = (DATA.my_slots || []).filter(x => (x.pool === 'NFL') === (kind === 'NFL'));
  const chosen = DROP[kind] && list.find(x => x.n === DROP[kind]);
  return chosen || list[0] || null;   // my_slots is sorted weakest-first
}

/* Points a team earns over the games strictly AFTER `from`, in date terms.
   `n` limits it to the first n games (the mandatory hold); null runs to the end of the season.
   Games on or before `from` belong to somebody else and are never counted for either side. */
/* THE 3-0 COLUMN MUST DESCRIBE THE SAME GAMES AS THE COLUMN NEXT TO IT.
   Casey, 30 Aug 2026: "Miami OH is now the top team, but their next 3 games are 10%
   probability. Yet your Bank 3 is 2.67. That makes it sound like they are going to have a good
   chance of get 3 points, but how is that possible if their 3-0 probability for those 3 games
   is 10%?"
   It was not possible, and both numbers were right about different things. Bank 3 moved with the
   team he had selected to drop; 3-0 was `t.p30`, baked at build time over the team's first three
   games from the EARLIEST opening in its pool. For Miami (OH) that was 19 Sep at Cincinnati
   (18.8%), UConn, Bowling Green -> 10.2%. Drop a team that frees up on 3 Oct instead and the
   three games are Bowling Green, UMass, Akron -> 70.1%, and 2.67 expected points is exactly what
   that looks like. The tooltip even claimed it counted "only games from" the selected date. It
   did not. One window, computed once, used by both. */
function windowP30(team, from, n){
  let p = 1, gs = 0;
  for (const g of (team.sched || [])){
    if (g.bye || g.p == null) continue;
    if (from && g.d <= from) continue;
    p *= g.p; gs++;
    if (gs >= (n || DATA.hold_games)) break;
  }
  return gs >= (n || DATA.hold_games) ? p : null;
}

/* ================= WHEN THE REPLACEMENT ACTUALLY STARTS PLAYING =====================
   `drop_from` on a slot is the INCUMBENT'S next scheduled game after its third. That was being
   used as the moment the replacement takes over, and it is not the same thing -- it is the wrong
   team's calendar. Worse, the filter was `g.d <= from` (exclusive) while the note underneath said
   "a replacement first plays for you on ${from}" (inclusive). South Dakota St's third game is
   12 Sep and its next is 19 Sep, so Villanova at Long Island on 19 Sep and Harvard vs New
   Hampshire on 19 Sep were both thrown away -- a whole week of every candidate's window, gone,
   with a label beside it claiming otherwise.

   The right date comes from Casey's own trade rule, 30 Aug 2026: "Our trade window starts every
   Sunday night and ends on Monday or Tuesday... Games after that Tuesday/trade window will go to
   the acquiring owner." So: take the incumbent's third game, find the next Tuesday, and every
   game after that Tuesday is the new team's. That reproduces `drop_from` exactly for all eleven
   of his slots and fixes the case where it was a week late. */
function swapFrom(inc){
  if (!inc || !inc.third_game) return null;
  const d = new Date(inc.third_game + 'T00:00:00Z');
  /* The next Tuesday STRICTLY after the third game. A third game played on a Tuesday still has
     to be played before the team can go, so that same day's window does not count. */
  do { d.setUTCDate(d.getUTCDate() + 1); } while (d.getUTCDay() !== 2);
  return d.toISOString().slice(0, 10);
}

/* ================= THE WINDOW IS THREE WEEKS, AND A BYE IS A LOSS ===================
   Casey, 30 Aug 2026: "for Villanova, when selecting south dakota state there is a bye in the 3
   games for Villanova. But you are including Fordham in the 3 game probability and should not
   because that is basically the 4th game." And, asked directly: "Effectively villanova should
   not be considered 3-0. The bye is a loss so they are 2-1 for that 3 game span and that is how
   the pts and gain should be calculated for that 3 game span. For the rest of season pts that
   bye should not be considered as a loss."

   So the near-term window counts WEEKS, not games. Three weeks of roster slot is the thing being
   spent, and a bye spends one of them for nothing. Skipping the bye and reaching forward to the
   next game -- which is what counting games did -- compared a team's three games across four
   weeks against another team's three across three, and quietly flattered every team with a bye.

   Rest of season is deliberately NOT computed this way: there a bye costs nothing, it is simply
   a week with no game, and penalising it would be inventing a loss. */
function weekWindow(team, from, nWeeks){
  if (!from) return {pts: 0, games: 0, byes: 0, weeks: 0, p: null, last: null};
  /* BOTH week calendars are anchored on a TUESDAY (season_calendar.py), and the swap date IS a
     Tuesday, so `from` begins its own week -- it does not sit in the week before. Writing +1
     here skipped the first week of every window, which is a whole game per candidate. */
  const w0 = weekOf(team.pool, from);
  const wks = [];
  for (let i = 0; i < nWeeks; i++) wks.push(w0 + i);
  let pts = 0, games = 0, byes = 0, p = 1, last = null;
  for (const wk of wks){
    const gs = (team.sched || []).filter(g => g.d && !g.bye && g.ep != null
                                           && weekOf(team.pool, g.d) === wk && g.d > from);
    if (!gs.length){
      byes++; p = 0;                               // no game banks nothing and cannot be a win
      continue;
    }
    for (const g of gs){
      pts += g.ep; games++; p *= (g.p == null ? 0 : g.p);
      if (!last || g.d > last) last = g.d;
    }
  }
  return {pts: Math.round(pts * 100) / 100, games, byes, weeks: nWeeks, p, last};
}

/* ============================ IN-SEASON RE-RATING ==========================================
   Casey, 31 Aug 2026: "your model should update and get smarter as the season goes on based upon
   what happens during the regular season itself. So if for some reason there's a big upset...
   and a team suddenly looks a lot better than expected, then that team should carry more value
   going forward... Let's say Arizona starts out three and o and beats BYU, which would be heavily
   favored against that game. If they beat BYU, all of a sudden Arizona is a much more intriguing
   team going forward... That should be factored into your gain of the next three games against
   Washington State, Cincinnati and West Virginia as well as your season model."

   He is right, and until now the answer was no: every number on this page came from the August
   ratings and stayed there. This is the fix.

   HOW IT WORKS, in one line: for each game a team has played we know what the model expected the
   margin to be (`pre_m`, kept for exactly this purpose) and what the margin actually was. The
   difference is the surprise. A team's rating moves by the AVERAGE surprise, shrunk hard while
   the sample is small.

       adj = 0.5 * (n / (n + K)) * mean(actual_margin - expected_margin)

   THE TWO FACTORS, because neither is decoration:

   * `n / (n + K)` is shrinkage toward the preseason rating. One game is mostly noise -- the
     residual on a single game has a standard deviation of about a converted touchdown and a
     half -- so believing it whole would swing a team four touchdowns on one Saturday and swing
     it back the next. K is sigma^2 / tau^2, where tau is how wrong a preseason rating typically
     is. K = 5 means: after 1 game trust 17% of the surprise, after 3 games 37%, after 6 games
     55%, after 10 games 67%. THE VALUE OF tau IS AN ASSUMPTION AND IS NOT SOURCED -- it is a
     single named constant here so it can be measured against real seasons in the backtest and
     replaced.

   * `0.5` splits the surprise between the two teams. A 17-point upset says the winner is better
     AND the loser is worse, and both of those teams are re-rated from their own games. Giving
     each the whole residual would count every game twice the moment those two meet again -- or
     meet common opponents, which in a conference schedule is constantly.

   WHAT IT DOES NOT DO. It does not touch the draft model, which is frozen and correct as a
   preseason artifact. It re-prices GAMES from adjusted ratings: a future game's margin becomes
   `m + adj(me) - adj(them)`, and the win probability and expected points follow from that margin
   through the same curve `bonus.py` uses. Games already played are never re-priced -- they are
   facts. */
const RERATE_K = 5.0;          // sigma^2 / tau^2, tau ~ 7.4 pts of preseason rating error
const RERATE_SPLIT = 0.5;      // half the surprise is the opponent's
/* TWO CUT-OFFS, ONE FORMULA. Casey, 31 Aug 2026: "So why as of today is live different from last
   built? Last built should have included the scores from this past weekend, so would they be the
   same as of today?"
   They should be, and they were not. The build KNEW about 24 teams' results -- it has their
   scores baked in -- and applied nothing to the ratings, so "as last built" was really "preseason
   ratings, ignoring everything, including the results in this very file". The button was
   comparing the wrong two things.
   Fixed by cutting the SAME calculation at two dates rather than running it once: the built view
   counts games up to the date the build's own knowledge stops; the live view counts everything
   the page can see. One implementation, two windows -- which also avoids a second copy of the
   formula in Python, the duplication this project keeps being bitten by. Today the two sets are
   identical, so the buttons give identical numbers, which is the correct answer. */
let RERATE = new Map();        // team -> adjustment from EVERY result the page can see
let RERATE_BUILT = new Map();  // team -> adjustment from results the LAST BUILD already had
let RERATE_ON = true;

function _phi(z){              // standard normal CDF, Abramowitz-Stegun 7.1.26
  const t = 1 / (1 + 0.2316419 * Math.abs(z));
  const d = 0.3989422804014327 * Math.exp(-z * z / 2);
  const p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937
          + t * (-1.821255978 + t * 1.330274429))));
  return z >= 0 ? 1 - p : p;
}

/* The same curve as bonus.py, from constants shipped in the payload rather than retyped. */
function epOfMargin(pool, m){
  const C = DATA.curve; if (!C) return null;
  const sg = C.sigma[pool], bl = C.blowout[pool], st = C.so_thresh[pool], sc = C.so_scale[pool];
  return _phi(m / sg) + 0.5 * (_phi((m - bl) / sg) + sc * _phi((m - st) / sg));
}

/* Every finished game we can price, optionally stopping at a date. `through` = the build's own
   cut-off gives what the last refresh knew; no cut-off gives everything the page can see. */
function playedResiduals(t, through){
  const out = [];
  for (const g of (t.hist || [])){
    if (g.pre_m == null || g.nc) continue;
    if (through && g.d && g.d > through) continue;
    let pf = g.pf, pa = g.pa;
    if (pf == null || pa == null){
      const lv = liveScore(t.n, g.d);
      if (!lv) continue;
      pf = lv.pf; pa = lv.pa;
    }
    out.push((pf - pa) - g.pre_m);
  }
  return out;
}

function adjFrom(residuals){
  if (!residuals.length) return 0;
  const mean = residuals.reduce((a, b) => a + b, 0) / residuals.length;
  const w = residuals.length / (residuals.length + RERATE_K);
  return Math.round(RERATE_SPLIT * w * mean * 100) / 100;
}

function computeRerate(){
  RERATE = new Map(); RERATE_BUILT = new Map();
  if (!DATA.curve) return;
  const through = DATA.results_through || null;
  for (const t of DATA.teams){
    const all = adjFrom(playedResiduals(t));
    const built = adjFrom(playedResiduals(t, through));
    if (all) RERATE.set(t.n, all);
    if (built) RERATE_BUILT.set(t.n, built);
  }
  applyRerate();
}

/* How many results the page has that the last build did not -- the ONLY thing the two views can
   differ by. Zero means the buttons agree, and the page says so instead of implying a difference
   that does not exist. */
function resultsSinceBuild(){
  const through = DATA.results_through || null;
  if (!through) return 0;
  let k = 0;
  for (const t of DATA.teams)
    for (const g of (t.hist || []))
      if (g.d && g.d > through && (g.pf != null || liveScore(t.n, g.d))) k++;
  return k;
}

/* Re-price every UNPLAYED game in place, keeping the August numbers alongside so the panels can
   show both and so turning this off is exact rather than approximate. */
function applyRerate(){
  const src = () => (RERATE_ON ? RERATE : RERATE_BUILT);
  for (const t of DATA.teams){
    const adj = src().get(t.n) || 0;
    for (const g of (t.sched || [])){
      if (g.bye || g.m0 === undefined && g.m == null) continue;
      if (g.m0 === undefined){ g.m0 = g.m; g.p0 = g.p; g.ep0 = g.ep; }
      if (g.m0 == null) continue;
      const opp = src().get(g.opp) || 0;
      const m = g.m0 + adj - opp;
      g.m = Math.round(m * 100) / 100;
      g.p = Math.round(_phi(m / DATA.curve.sigma[t.pool]) * 10000) / 10000;
      g.ep = Math.round(epOfMargin(t.pool, m) * 1000) / 1000;
      g.radj = Math.round((adj - opp) * 100) / 100;
    }
  }
}

function rerateOf(name){
  return ((RERATE_ON ? RERATE : RERATE_BUILT).get(name)) || 0;
}

function setRerate(on){
  if (RERATE_ON === on) return;
  RERATE_ON = on;
  applyRerate();
  renderPick();
}

/* A LABELLED CHOICE, NOT A HIDDEN TOGGLE. Casey, 31 Aug 2026: "if anybody were to just come into
   the page, what would they understand it for? They wouldn't know what that means."
   So: a label that names WHAT is being decided ("Projections are based on"), both options shown
   at once so the alternative is visible rather than hidden behind a click, the live one marked,
   and a plain sentence underneath that says what the choice does and how many teams it currently
   affects. Nothing here needs prior knowledge of the feature to be read. */
/* IN THE SUB-TAB STRIP, APPLYING TO ALL THREE. Casey, 31 Aug 2026: "I don't know what it truly
   represents. I don't think it has anything to do with the live scores tab or the standings tab
   or the slots tab. If that is true, then it should apply only to college and NFL pickups. But if
   it also applies to My Roster, then it should be there too? I would put it to the right of the
   My Team, NFL, and College tabs as a button that can be selected and apply to all three."

   CHECKED, and the answer is: Pickups only, but ALL THREE of its sub-tabs. Live scores, Standings
   and Slots are built from results that happened -- there is no projection in them to adjust. My
   Roster's Next 3 and Rest ARE projections and belong to it (they were reading baked values and
   have been made live in the same pass, which is what made the question worth checking rather
   than answering from memory).
   So it sits at the right of the strip, applies to all three, and the explanation lives behind
   the same ? disclosure as everything else rather than taking a block of the page. */
function rerateControl(){
  if (!DATA.curve) return '';
  const n = RERATE.size;
  const since = resultsSinceBuild();
  const big = [...RERATE.entries()].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
  const opt = (on, label, tip) => `<button class="tab rrbtn${RERATE_ON === on ? ' on' : ''}"
      data-rerate="${on}" onclick="setRerate(${on})" aria-pressed="${RERATE_ON === on}"
      title="${tip}">${label}</button>`;
  return `<span class="rrgroup">
    <span class="rrlab" title="Which ratings every projected number on these three tabs is built from. No effect on Live scores, Standings or Slots — those are made of results that happened, not projections.">Ratings</span>
    ${opt(true, '+ live scores',
          `The ratings from your last refresh (${DATA._built}), plus an automatic adjustment for every game finished since. ${since === 0 ? 'Nothing has finished since, so this is currently identical to the other option.' : since + ' game(s) have finished since.'} Applies to all three tabs here.`)}
    ${opt(false, 'as last built',
          `The ratings exactly as they were at your last refresh (${DATA._built}) — including the results it already knew about. ${since === 0 ? 'Currently identical to the other option.' : ''}`)}
    ${since === 0 ? '<span class="rrsame" title="Nothing has been played since your last refresh, so both options give the same numbers.">same today</span>' : ''}
  </span>`;
}

function rerateNote(){
  if (!DATA.curve) return '';
  const n = RERATE.size;
  const since = resultsSinceBuild();
  const big = [...RERATE.entries()].sort((a, b) => Math.abs(b[1]) - Math.abs(a[1]))[0];
  /* Casey, 31 Aug 2026: "if I've done a rebuild, then that also includes results so far, and it
     includes all the things you said that your model would update for that the ESPN live stuff
     does not update for. So when I look at the button now, I don't know what... it's not clear."
     He is right and the old label was wrong by construction: it said "August ratings" for
     something that stops being August's the first time the file is rebuilt. The two options do
     not differ by "preseason vs results" -- they differ by WHERE THE RATINGS STOP. One is the
     file as last built; the other adds the automatic nudge from games finished since. Labelled
     that way, the words stay true after every future rebuild. */
  return explain('What the Ratings buttons are choosing between', `Every projected number on these
    three tabs — win probability, 3-0, Bank 3, Season pts, Gain, Advice, and your roster's Next 3
    and Rest — is built from a set of team ratings. The two buttons choose <b>where those ratings
    stop</b>.
    <br><br><b>as last built</b> — the ratings exactly as they were at your last refresh,
    <b>${DATA._built}</b>. That refresh is the thorough one: verified results, current Vegas
    lines, moved win totals, injuries and quarterback news, and a check of whether the model
    itself is off. It only happens when you ask for it.
    <br><b>+ live scores</b> — the same ratings, plus one automatic adjustment: for every game
    finished since that refresh, each team is moved by how it played against what the model
    expected. <b>This needs no rebuild.</b> The page asks ESPN for scores each time you open it
    and again while games are running, and every new final moves the ratings straight away.
    ${since === 0
      ? `<br><br><b>Right now the two buttons give exactly the same numbers.</b> Nothing has been
         played since your last refresh, so there is nothing for the live half to add. They will
         start to differ the first Saturday after a refresh.`
      : `<br><br><b>${since} game${since === 1 ? '' : 's'} finished since that refresh</b> and
         ${since === 1 ? 'is' : 'are'} in the live view only.`}
    ${n === 0 ? '' : `<br><b>${n} team${n === 1 ? ' has' : 's have'} played this season.</b>${big
        ? ` The biggest rating change is <b>${big[0]}</b>, ${big[1] >= 0 ? 'better' : 'worse'} than
          expected by ${Math.abs(big[1]).toFixed(1)} points a game.` : ''}`}
    <br><br><b>What the live part cannot do.</b> It only knows final scores. It cannot see a new
    Vegas line, a win total that has moved, an injury, a quarterback change, or a fault in the
    model's own logic. Those need a refresh — which is why both exist rather than one.
    <br><b>What neither does.</b> Games already played are never re-priced; they are facts. And
