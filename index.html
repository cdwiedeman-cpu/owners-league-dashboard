      delivers. <b>Every per-game number on this page — the 3-0 figure, Bank 3, Season pts — comes
      from the preseason ratings and does NOT yet re-rate itself from results.</b> Three things do
      change every refresh: games already played leave the window, because they are facts and not
      forecasts; the schedule ahead shortens; and the <b>Played so far</b> figure compares what a
      team has actually banked against what the model expected of it, which is the evidence the
      Advice column gates a long hold on. So the three-week and season columns both improve in the
      same way and to the same degree — by having less left to guess about — and neither becomes
      a different opinion about how good a team is.</p>
      <p><b>Making the ratings themselves learn from results is a real change and has not been
      built.</b> It would re-rate the available pool on actual form instead of August priors, and
      it is the single thing that would most improve this page after a few weeks of football. Ask
      for it and it gets built; until then, treat every projection here as a preseason one that is
      simply running out of unplayed games.</p>
      <p><b>A rental is not a worse asset, it is a shorter one.</b> Three easy games banked, then
      the slot comes back and you choose again with better information. That option has value
      the points columns cannot show.</p>`)}
      ${explain('How to read the Advice column', `
      <p>The <b>Do</b> column is the recommendation, and it is measured against the team you
      chose to drop — change that and every label can change.</p>
      <p><b class="b">AVOID</b> — <b>no hold length beats the team you would give up.</b> The
      swap loses points however long you keep it, so do not make it. This overrides everything
      else: a team can be excellent in the abstract and still be a downgrade on your roster.</p>
      <p><b style="color:var(--blue)">3g</b> — take it for the mandatory three games and hand
      the slot back. That is where the gain peaks.</p>
      <p><b class="y">6g</b> (or any number) — keep it that many games. The small figure under
      the label is the gain <i>at that length</i>, and it is often bigger than <b>Gain 3</b>.
      <b>A row can lose over the mandatory three games and win over five</b> — that is precisely
      when holding longer is the point, and it is why the two numbers can disagree in sign
      without either being wrong. Hover for the date it runs to.</p>
      <p><b class="g">KEEP</b> — the gain is still growing at the end of the season, so hold it
      all the way. Bowl, playoff and final-poll points go to whoever owns the team in January.</p>
      <p><b>Why a HOLD LONGER team can rank below a STREAM team.</b> You asked this about
      Rutgers. The ranking is total expected points against the same alternative, over the same
      horizon: a team you can hold six games earns for six, but a team whose next three are
      excellent can earn more in three and hand the slot back. Both are measured against
      streaming, so they are directly comparable and the STREAM team really is worth more
      <i>in points</i>.<br>
      What the ranking does <b>not</b> price is your point about certainty — that flipping a
      slot means winning a coin flip you might lose. That is partly in there already: the
      streaming rate is the average of the <b>top nine</b> available teams, not the best one,
      precisely because nine owners fish in the same pool and you get one of the good ones
      rather than the one you wanted. What is <i>not</i> in there is the risk of getting nobody
      useful at all. So if two teams are close on surplus, <b>take the longer hold</b> — the
      column is there to be read, not just sorted on.</p>
      <p>Every probability is a model number: Φ((my rating − their rating + home field) ÷ σ),
      from the ratings the draft board used. <b>Nothing in the 3-0 or points columns is a Vegas
      line.</b> Posted lines appear inside a team's panel where they exist, and say
      <b>not posted</b> where they do not.</p>
      <p><b>Points columns are future-only.</b> Games already played contribute nothing to any
      of them — you cannot buy points that have already been scored. A team that has already
      lost is neither penalised nor credited here.</p>
      <p><b>Late in the season this changes.</b> A team needs at least ${DATA.claim_min} games
      left to be claimed, so the list already excludes anyone who cannot finish a hold.</p>`)}
    </div></div>`,
  };
  el('pickBody').innerHTML = bar + rerateNote() + (panels[PICKTAB] || panels.roster);
}


/* ============================ STANDINGS ====================================================
   Casey, 30 Aug 2026: "I have to open that spreadsheet and run macros. It doesn't work on my
   mac or iphone, so I need this dashboard to do it."

   So the page computes the standings itself. It asks ESPN for EVERY WEEK PLAYED SO FAR, scores
   each finished game against the league's own rules, and rolls the result up by owner and by
   division. No macro, no spreadsheet, no refresh from me.

   WHAT IS AND IS NOT IN THESE TOTALS, and the distinction is not a detail:
     IN  — wins (1.0), ties (0.5), a 40+ NFL / 50+ college win (0.5), a shutout (0.5). Every
           one of those is readable off a final score, which is why the page can do it.
     OUT — division titles, playoff and bowl points, final-poll finishes, the undefeated and
           one-loss bonuses. Those are settled at the END of the season and cannot be known in
           October. A running total that silently included a guess at them would not be a
           standings table, it would be a projection wearing one.
   The page says this on its face rather than leaving it to be discovered. */
let SEASON = null, SEASON_ERR = null, SEASON_PROGRESS = '';

/* ONE SCORING FUNCTION, ONE WEEK FUNCTION. The season load and the live overlay must agree
   exactly or a game would be worth one thing on Saturday morning and another on Saturday night.
   Casey, 30 Aug 2026: "Can you also make the standings and slots update live based on the
   scoreboard. So a teams score is final then it also refreshes the standings and slots." */
function pointsFor(pool, pf, pa){
  const m = pf - pa;
  let p = 0;
  if (m > 0) p += DATA.scoring.win;
  else if (m === 0) p += DATA.scoring.tie;
  if (m >= (DATA.scoring.blowout_margin[pool] || 50)) p += DATA.scoring.blowout;
  if (pa === 0 && m > 0) p += DATA.scoring.shutout;
  return p;
}
function weekOf(pool, iso){
  const C = DATA.calendar || {};
  const d0 = new Date((pool === 'NFL' ? C.nfl_week1_anchor : C.cfb_week1_anchor) + 'T00:00:00Z');
  return Math.max(0, Math.floor((new Date(iso) - d0) / 6048e5) + 1);
}

function weeksSoFar(){
  /* ESPN indexes college and NFL weeks separately. College week 1 contains 29 Aug 2026; the
     NFL opens 9 Sep. Asking for a week that has not happened is harmless -- it returns an
     empty event list -- but asking for forty of them is not, so the range stops at today. */
  const today = new Date();
  /* Both anchors come from season_calendar.py via the payload. They were hard-coded here and
     in three Python files, and two of the copies already disagreed. */
  const C = DATA.calendar || {};
  const colW1 = new Date(C.cfb_week1_anchor + 'T00:00:00Z');
  const nflW1 = new Date(C.nfl_week1_anchor + 'T00:00:00Z');
  const wk = (d0) => Math.max(0, Math.floor((today - d0) / 6048e5) + 1);
  return {COL: Math.min(16, wk(colW1)), NFL: Math.min(18, wk(nflW1))};
}

async function loadSeason(){
  const {COL, NFL} = weeksSoFar();
  const jobs = [];
  for (let w = 1; w <= COL; w++){
    jobs.push(['FBS', w, `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300&seasontype=2&week=${w}&dates=2026`]);
    jobs.push(['FCS', w, `https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=81&limit=300&seasontype=2&week=${w}&dates=2026`]);
  }
  for (let w = 1; w <= NFL; w++)
    jobs.push(['NFL', w, `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${w}&dates=2026`]);

  SEASON_PROGRESS = `asking ESPN for ${jobs.length} week-scoreboards…`;
  renderStandings();
  const pts = new Map(), rec = new Map(), errs = [];
  let ok = 0;
  await Promise.all(jobs.map(async ([pool, w, url]) => {
    try {
      const r = await fetch(url, {cache: 'no-store'});
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      ok++;
      for (const ev of (j.events || [])){
        const c = (ev.competitions || [])[0]; if (!c) continue;
        const st = (ev.status || {}).type || {};
        if (st.state !== 'post') continue;               // only finished games score
        const cs = c.competitors || [];
        const sides = cs.map(x => ({
          name: resolve(x.team || {}, pool),
          score: Number(x.score), won: !!x.winner}));
        if (sides.length !== 2 || sides.some(x => isNaN(x.score))) continue;
        for (let i = 0; i < 2; i++){
          const me_ = sides[i], other = sides[1 - i];
          if (!me_.name) continue;
          const margin = me_.score - other.score;
          const lim = DATA.scoring.blowout_margin[pool] || 50;
          const p = pointsFor(pool, me_.score, other.score);
          const cur = pts.get(me_.name)
            || {pts: 0, w: 0, l: 0, t: 0, bl: 0, so: 0, n: 0, wk: {}};
          cur.pts += p; cur.n++;
          if (margin > 0) cur.w++; else if (margin < 0) cur.l++; else cur.t++;
          if (margin >= lim) cur.bl++;
          if (other.score === 0 && margin > 0) cur.so++;
          /* PER WEEK, not just a season total. A slot is only credited for the weeks it
             actually held the team, so a total is the wrong granularity: it would hand a
             streamed slot every point its old team scored after being dropped. */
          cur.wk[w] = (cur.wk[w] || 0) + p;
          pts.set(me_.name, cur);
        }
      }
    } catch (e) { errs.push(`${pool} wk${w}: ${e.message}`); }
  }));
  /* IF ESPN COULD NOT BE REACHED AT ALL, fall back to the results baked in at build time
     rather than showing nothing. That is the only thing a hosted page can ever show -- the
     claude.ai sandbox blocks outside sites, and an iPhone cannot run a local file at all -- so
     without this the Standings and Slots tabs would be permanently blank there. The page says
     which of the two it is showing; it never presents a stale total as a live one. */
  if (ok === 0){
    SEASON = bakedSeason();
    SEASON_LIVE = false;
  } else {
    SEASON = pts;
    SEASON_LIVE = true;
  }
  SEASON_ERR = errs.length ? errs : null;
  SEASON_PROGRESS = '';
  renderStandings(); renderSlots();
}

let SEASON_LIVE = null;
function bakedSeason(){
  const m = new Map();
  for (const [team, wks] of Object.entries(DATA.baked_points || {})){
    let pts = 0;
    for (const v of Object.values(wks)) pts += v;
    m.set(team, {pts, w: 0, l: 0, t: 0, bl: 0, so: 0, n: 0, wk:
      Object.fromEntries(Object.entries(wks).map(([k, v]) => [+k, v]))});
  }
  return m;
}

/* WHO OWNED THIS TEAM IN THIS WEEK. Casey, 30 Aug 2026: "What will happen after they make a
   trade. I assume you will add the new team with that teams points in addition to keeping the
   old team since they are both needed to get to the total points."
   Right, and the old code could not do it: it multiplied CURRENT ownership by WHOLE-SEASON
   points, so the first trade would both delete the points an owner had already earned with the
   team he sent away and credit him with points somebody else earned with the team he got. */
function ownersInWeek(team, wk){
  const snaps = (DATA.owner_history || {}).snapshots || [];
  let best = null;
  for (const s of snaps) if (s.week <= wk && (best === null || s.week >= best.week)) best = s;
  return best ? (best.labels[team] || []) : null;
}

function ownerTotals(){
  /* A team owned in three divisions scores for all three owners -- that is the league, not a
     bug. What is NOT the league is one owner scoring another owner's weeks. */
  const out = {};
  const snaps = (DATA.owner_history || {}).snapshots || [];
  const seat = (div, owner) => {
    const key = div + '|' + owner;
    return out[key] || (out[key] = {div, owner, pts: 0, teams: []});
  };
  /* Weeks the team was owned by somebody OTHER than whoever holds it now still have to land
     somewhere, and the owner who earned them may no longer hold any team on this list. So the
     walk is over WEEKS, not over current labels. */
  if (snaps.length){
    for (const t of DATA.teams){
      const got = SEASON ? SEASON.get(t.n) : null;
      const wks = (got && got.wk) ? got.wk : {};
      const per = {};                       // div|owner -> points earned with THIS team
      /* A total with no week breakdown cannot be split, and dropping it would report a zero
         the owner did not earn -- the same unknown-vs-zero mistake this page fixes elsewhere.
         Both live and baked results carry `wk`; anything else falls back to today's owners. */
      if (got && got.pts && !Object.keys(wks).length){
        for (const l of (t.labels || [])) per[l.div + '|' + l.owner] = got.pts;
      }
      for (const [wk, pts] of Object.entries(wks)){
        for (const [div, owner] of (ownersInWeek(t.n, +wk) || []))
          per[div + '|' + owner] = (per[div + '|' + owner] || 0) + pts;
      }
      /* Current holders appear even on zero, or a team you own but that has not played looks
         like a team you do not own. */
      for (const l of (t.labels || [])) per[l.div + '|' + l.owner] = per[l.div + '|' + l.owner] || 0;
      for (const [key, pts] of Object.entries(per)){
        const [div, owner] = key.split('|');
        const o = seat(div, owner);
        const now = (t.labels || []).some(l => l.div === div && l.owner === owner);
        o.pts += pts;
        const g = got || {w: 0, l: 0, t: 0, bl: 0, so: 0, n: 0};
        o.teams.push({team: t.n, pool: t.pool, pts, w: g.w, l: g.l, t: g.t,
                      bl: g.bl, so: g.so, games: g.n, held: now,
                      partial: pts !== (got ? got.pts : 0)});
      }
    }
    return Object.values(out);
  }
  /* No ownership history at all -- fall back to current labels and whole-season points, which
     is exactly right until the first trade and is what this page did before. */
  for (const t of DATA.teams){
    const got = SEASON ? SEASON.get(t.n) : null;
    for (const l of (t.labels || [])){
      const key = l.div + '|' + l.owner;
      const o = out[key] || (out[key] = {div: l.div, owner: l.owner, pts: 0, teams: []});
      o.pts += got ? got.pts : 0;
      /* A KEY COLLISION, AND A NASTY ONE. `n` is the TEAM NAME on a board row and the NUMBER OF
         GAMES on a results row, and spreading the second over the first replaced every team
         name with a count. Casey saw "FCS 1" where the team should be. Named explicitly now, so
         neither object can silently overwrite the other's meaning. */
      const g = got || {pts: 0, w: 0, l: 0, t: 0, bl: 0, so: 0, n: 0};
      o.teams.push({team: t.n, pool: t.pool, pts: g.pts, w: g.w, l: g.l, t: g.t,
                    bl: g.bl, so: g.so, games: g.n, held: true, partial: false});
    }
  }
  return Object.values(out);
}

const DIVNAME = {PFD: 'Predator', VFD: 'Viper', SFD: 'Scorpion'};
let OPEN_OWNER = null;

function ownerBlock(o, rank, lead, showDiv){
  const nTrade = ((DATA.owner_history || {}).changes || []).length;
  const mine = o.div === MY_DIV && o.owner === OWNERS[ME];
  const key = o.div + '|' + o.owner;
  const teams = o.teams.slice().sort((a, b) => b.pts - a.pts);
  const detail = OPEN_OWNER === key ? `<tr><td colspan="${showDiv ? 5 : 4}"><div class="dtl">
    <div class="scr"><table>
      <colgroup><col style="width:44%"><col style="width:18%"><col style="width:19%"><col style="width:19%"></colgroup>
      <thead><tr><th>Team</th><th class="num">Rec</th><th class="num hide-s">Bonus</th><th class="num">Pts</th></tr></thead>
      <tbody>${teams.map(t => `<tr${t.held === false ? ' class="g-before"' : ''}>
        <td><span class="pill p-${t.pool.toLowerCase()}">${t.pool}</span> ${t.team}${
          t.held === false ? ' <span class="gtag t-before" title="No longer on this roster. The points shown are the ones earned while it was.">NO LONGER HELD</span>' : ''}${
          t.held && t.partial ? ' <span class="gtag t-hold" title="Picked up mid-season. Only the weeks since then are counted here; the earlier ones belong to the previous owner.">PART SEASON</span>' : ''}</td>
        <td class="num d">${t.w}-${t.l}${t.t ? '-' + t.t : ''}</td>
        <td class="num d hide-s">${t.bl?`${t.bl} blowout `:''}${t.so?`${t.so} SO`:''}${!t.bl&&!t.so?'—':''}</td>
        <td class="num"><b>${t.pts.toFixed(1)}</b></td></tr>`).join('')}</tbody></table></div>
    <div class="note">Bonus counts a 40+ NFL / 50+ college win and a shutout, 0.5 each.
    A team with no games yet shows 0-0 and scores nothing — not a zero it earned.
    ${nTrade ? `<br><b>Points follow ownership week by week.</b> A team that changed hands is
      listed under <b>both</b> owners, each with the weeks they held it, so the two halves add
      back to the team's season total. <b>Rec</b> and <b>Bonus</b> are the team's whole season
      either way — they are the team's record, not a share of it.` : ''}</div>
    </div></td></tr>` : '';
  return `<tr class="clickable" onclick="toggleOwner('${key.replace(/'/g,"\\'")}')">
      <td class="num d">${rank}</td>
      <td>${o.owner}${mine ? ' <span class="mytag">YOU</span>' : ''} <span class="d">▸</span></td>
      ${showDiv ? `<td class="c-div"><span class="pill p-div${o.div === MY_DIV ? ' own' : ''}"
        title="${DIVNAME[o.div] || o.div} division">${DIVNAME[o.div] || o.div}</span></td>` : ''}
      <td class="num d hide-s">${lead == null ? '—' : (lead === 0 ? '—' : '−' + lead.toFixed(1))}</td>
      <td class="num"><b>${o.pts.toFixed(1)}</b></td></tr>` + detail;
}

function toggleOwner(k){ OPEN_OWNER = OPEN_OWNER === k ? null : k; renderStandings(); }

function standTable(rows, title, note, showDiv){
  /* Casey, 31 Aug 2026: "On the standings page for the overall standings, can you include a
     column for division to the right of the owner column." Only on the OVERALL table -- inside
     a division table every row carries the same value, which is a column answering a question
     nobody asked. */
  rows = rows.slice().sort((a, b) => b.pts - a.pts);
  const top = rows.length ? rows[0].pts : 0;
  return `<div class="card"><h2>${title}</h2>
    <div class="scr"><table>
      <colgroup><col style="width:10%"><col style="${showDiv ? 'width:38%' : 'width:52%'}">${
        showDiv ? '<col style="width:16%">' : ''}<col style="width:16%"><col style="width:20%"></colgroup>
      <thead><tr><th class="num">#</th><th>Owner</th>
        ${showDiv ? '<th class="c-div" title="Which division this owner drafts and trades in. All three compete for the overall title.">Div</th>' : ''}
        <th class="num hide-s" title="Points behind the leader.">Behind</th>
        <th class="num">Pts</th></tr></thead>
      <tbody>${rows.map((o, i) => ownerBlock(o, i + 1, top - o.pts, showDiv)).join('')}</tbody></table></div>
    ${note || ''}</div>`;
}

/* WHAT THE TRANSACTION LOG COULD NOT ANSWER ON ITS OWN.
   Casey, 30 Aug 2026: "If the dates don't fall between those dates that flag it to me when you
   do the refresh and then I can tell you the actual date of each trade. So if that happens
   prompt me with the teams and owners that made trades that you cannot align to the correct
   date." An absence is never an answer: a trade that could not be dated is named here with its
   owner and both teams, and it is stated where its points are sitting meanwhile. */
function tradeNote(){
  const tx = DATA.transactions || {}, hist = DATA.owner_history || {};
  const und = tx.undated || [], diffs = hist.diffs || [], un = tx.unresolved || [];
  const nT = (tx.trades || []).length, nCh = (hist.changes || []).length;
  if (!nT && !und.length && !diffs.length && !un.length)
    return `<div class="note"><b>No trades are logged yet.</b> The workbook's Transactions tab
      is empty, so every team still sits with the owner who drafted it. Once it fills in, the
      trade window dates it there — not the date you happened to upload the file.</div>`;
  const rows = t => `<tr><td>${t.div} <b>${t.owner}</b></td><td>${t.old} → ${t.new}</td>
    <td class="d">${t.window || '—'}</td><td class="d">${t.why || ''}</td></tr>`;
  return `<div class="note">
    <b>${nT} trade${nT === 1 ? '' : 's'} in the log</b>, ${nCh} ownership move${nCh === 1 ? '' : 's'}
    applied. ${und.length
      ? `<b class="y">${und.length} of them cannot be dated.</b>`
      : 'All of them are dated.'}
    ${und.length ? `<p><b>These need a date from you.</b> Their window is not a Monday-to-Tuesday
      range, so the points are still sitting with the <b>previous</b> owner — under-crediting the
      buyer rather than moving points to somebody who had not got the team yet.</p>
      <div class="scr"><table>
        <colgroup><col style="width:30%"><col style="width:34%"><col style="width:16%"><col style="width:20%"></colgroup>
        <thead><tr><th>Owner</th><th>Trade</th><th>Window</th><th>Why not</th></tr></thead>
        <tbody>${und.map(rows).join('')}</tbody></table></div>` : ''}
    ${diffs.length ? `<p><b class="y">${diffs.length} team${diffs.length === 1 ? '' : 's'} where
      the log and the Season Summary disagree.</b> The <b>Season Summary wins</b> — it is the
      roster of record — but the difference is worth knowing about, because one of the two is
      wrong: ${diffs.slice(0, 6).map(d => `<b>${d.team}</b> (log says
      ${d.from_transactions.map(x => x[1]).join(', ') || 'nobody'}; sheet says
      ${d.from_sheet.map(x => x[1]).join(', ') || 'nobody'})`).join('; ')}${
      diffs.length > 6 ? ` and ${diffs.length - 6} more` : ''}.</p>` : ''}
    ${un.length ? `<p><b class="y">${un.length} team name${un.length === 1 ? '' : 's'} in the log
      could not be matched</b> to a team on the board: ${un.join(', ')}. Those trades were not
      applied. An ambiguous abbreviation is never guessed — moving a real team between two real
      owners on a coin flip is worse than leaving it where it was.</p>` : ''}</div>`;
}

function renderStandings(){
  const b = el('standBody');
  if (SEASON === null){
    b.innerHTML = `<div class="card"><div class="empty">
      ${SEASON_PROGRESS || 'Working out the standings from every week played so far…'}
      <p>This page computes the standings itself from ESPN's results — no spreadsheet and no
      macro. It asks for one scoreboard per week per pool, so the first load takes a few
      seconds.</p></div></div>`;
    return;
  }
  if (SEASON.size === 0){
    b.innerHTML = `<div class="card"><h2 class="y">No results to work from</h2><div class="empty">
      <p>ESPN could not be reached and this build has no verified results baked in, so there is
      nothing to compute. A table of zeros is not shown, because a zero you did not earn looks
      exactly like a zero you did.</p>
      <p class="d">${(SEASON_ERR || []).slice(0, 4).join(' · ')}</p></div></div>`;
    return;
  }
  const all = ownerTotals();
  const byDiv = {};
  for (const o of all) (byDiv[o.div] = byDiv[o.div] || []).push(o);
  const scored = [...SEASON.values()].reduce((a, x) => a + x.n, 0);
  const wbNote = (() => {
    const sd = DATA.standings;
    if (!sd || !sd.overall || !sd.overall.length) return '';
    const mineWb = sd.overall.find(r => r.owner && r.owner.replace(/\s/g,'').toLowerCase()
      .startsWith('palma'));
    const mineNow = all.find(o => o.div === MY_DIV && o.owner === OWNERS[ME]);
    if (!mineWb || !mineNow) return '';
    const d = Math.abs(mineWb.total - mineNow.pts);
    return `<div class="note"><b>Cross-check.</b> Your workbook last put you on
      <b>${mineWb.total.toFixed(1)}</b> when its macro was run; this page computes
      <b>${mineNow.pts.toFixed(1)}</b> from ESPN. ${d < 0.5
        ? 'They agree.'
        : `<b class="y">They differ by ${d.toFixed(1)}.</b> The likely reason is the workbook has
           not been run since — but if it has, one of us is wrong and it is worth a look.`}</div>`;
  })();

  /* THE TABLE FIRST, THE ESSAY BEHIND A BUTTON. Casey, 31 Aug 2026: "On the iphone version,
     there is a bunch of explanation text above the standings so I have to scroll a good bit.
     Can you put the explanation text into a button or something so I have a way to look at it
     if needed but not every time I open the page."
     A <details> element, not a hand-rolled panel: it is a real disclosure control, it is
     keyboard reachable, it needs no state of ours, and it survives a re-render because the DOM
     carries the open flag. Closed by default -- he has read it. */
  b.innerHTML =
    `<div class="card"><details class="how"><summary>How these are worked out${
      SEASON_LIVE === false ? ' <span class="chip warn">not live</span>' : ''}</summary><div class="note">
      ${SEASON_LIVE === false ? `<p><b class="y">These are the results built into this file on
        ${DATA._built}, not live ones.</b> ESPN could not be reached — which is always the case
        on a hosted link, and on a phone. Worked out from
        <b>${SEASON.size} teams' finished team-games</b>, results through
        <b>${DATA.results_through}</b>; ask for a refresh to bring them forward.</p>`
        : `<p>Computed here, live, from <b>${scored} finished team-games</b> ESPN reports as
        final — no spreadsheet and no macro.</p>`}
      <p><b>In these totals:</b> a win 1.0, a tie 0.5, a 40+ point NFL win or 50+ point college
      win 0.5, a shutout 0.5. All four are readable off a final score.</p>
      <p><b>Not in them:</b> division titles, playoff and bowl points, final-poll finishes and
      the undefeated / one-loss bonuses. Those are settled at the end of the season, so a
      running total cannot contain them without guessing.</p>
      <p><b>Trades:</b> points go to whoever owned the team <b>that week</b>. A team that
      changes hands appears under both owners — the weeks before the move under the old owner,
      the weeks after under the new one — so the two add back to the team's season total.
      ${((DATA.owner_history||{}).changes||[]).length
        ? `<b>${((DATA.owner_history||{}).changes||[]).length} ownership move(s)</b> are on
           record so far.`
        : 'No ownership has changed yet, so every team sits with the owner who drafted it.'}
      <b class="y">The limit worth knowing:</b> a move is dated to the workbook that first
      shows it, not to the day it happened${(((DATA.owner_history||{}).snapshots||[]).length>1)
        ? ''
        : ' — and only one roster snapshot exists so far, from the draft'}. If two workbooks are
      a fortnight apart, a trade inside that fortnight is recorded at the later one and up to
      two weeks of points sit with the previous owner. Uploading more often narrows it; nothing
      else can, because the league publishes no transaction log.</p>
      ${SEASON_ERR ? `<p><b class="y">${SEASON_ERR.length} week-scoreboard(s) failed to
        load</b>, so these totals may be short: ${SEASON_ERR.slice(0,3).join(' · ')}. Reload
        once you have a steadier connection.</p>` : ''}
      ${wbNote}${tradeNote()}</div></details></div>`
    + standTable(all, 'Overall — all 27 owners',
        `<div class="note">All three divisions compete for the overall title. Tap any owner for
         their eleven teams.</div>`, true)
    + Object.keys(byDiv).sort((a, b2) => a === MY_DIV ? -1 : b2 === MY_DIV ? 1 : a.localeCompare(b2))
        .map(dv => standTable(byDiv[dv], `${DIVNAME[dv] || dv} division`,
          dv === MY_DIV ? '<div class="note">Your division.</div>' : '')).join('');
}

/* ============================ SLOTS ========================================================
   Casey, 30 Aug 2026: "Can you also include something where we can track the points we have
   earned in each slot throughout the year. I think this will help us understand if our
   approach is working or not."

   THE UNIT OF THE STRATEGY IS THE SLOT, NOT THE TEAM. One of eleven roster positions may hold
   four different teams across a year, and a season total cannot tell you whether the churn was
   worth it. So points are attributed to the SLOT, week by week, and only for the weeks that
   slot actually held that team.

   AND POINTS ALONE STILL DO NOT SETTLE IT. Two points in a slot is good if the alternative was
   one and bad if it was five. So every slot is also scored against the counterfactual: what
   the DRAFTED team would have earned in the same weeks had it simply been held. The drafted
   team keeps playing whether Casey owns it or not, so that number is real, not a model. The
   difference between the two is the only honest answer to "is the approach working". */
const slotPts = (team, fromWk, toWk) => {
  /* null means UNKNOWN (the results have not been loaded); 0 means the team genuinely has not
     scored. Once SEASON is loaded, a team with no entry has played no finished games, and that
     IS zero -- returning null there put "0.0 earned" beside "— if held" on the same row, two
     different claims about the same missing fact. */
  if (SEASON === null) return null;
  const g = SEASON.get(team);
  if (!g || !g.wk) return 0;
  let p = 0;
  for (const [w, v] of Object.entries(g.wk)){
    const wk = +w;
    if (wk >= fromWk && (toWk == null || wk < toWk)) p += v;
  }
  return p;
};

function slotRows(){
  const sl = DATA.slots;
  if (!sl || !sl.lineage) return null;
  return sl.lineage.map(l => {
    const spells = l.spells.map(sp => ({
      ...sp, pts: slotPts(sp.team, sp.from_week, sp.to_week)}));
    const actual = spells.reduce((a, x) => a + (x.pts || 0), 0);
    /* The counterfactual runs from the FIRST week of the slot to now, because that is the
       period the decision covers. Held slots have actual === held by construction, which is
       correct and is why they read 0.0 rather than being hidden. */
    const held = slotPts(l.drafted, l.spells[0].from_week, null);
    return {...l, spells, actual, held, edge: held == null ? null : actual - held,
            streamed: spells.length > 1};
  });
}

let OPEN_SLOTS = new Set();
function toggleSlot(n){
  if (OPEN_SLOTS.has(n)) OPEN_SLOTS.delete(n); else OPEN_SLOTS.add(n);
  renderSlots();
}
function toggleAllSlots(){
  const rows = slotRows() || [];
  if (OPEN_SLOTS.size === rows.length) OPEN_SLOTS = new Set();
  else OPEN_SLOTS = new Set(rows.map(r => r.slot));
  renderSlots();
}

function renderSlots(){
  const b = el('slotsBody');
  if (!DATA.slots){
    b.innerHTML = `<div class="card"><div class="empty">No slot history yet. It is written on
      each build from your workbook, so it starts the first time a roster change appears.</div></div>`;
    return;
  }
  if (SEASON === null){
    b.innerHTML = `<div class="card"><div class="empty">${SEASON_PROGRESS ||
      'Working out what each slot has earned…'}<p>Slot points come from the same live results
      as the standings, so this needs a connection the first time you open it.</p></div></div>`;
    return;
  }
  const rows = slotRows();
  const txn = (DATA.slots.transactions || []);
  const anyPts = rows.some(r => r.actual > 0);
  const streamed = rows.filter(r => r.streamed);
  const edgeKnown = rows.filter(r => r.edge != null && r.streamed);
  const totalEdge = edgeKnown.reduce((a, r) => a + r.edge, 0);

  /* THE HEADLINE IS A VERDICT ONLY WHEN THERE IS EVIDENCE FOR ONE. With no transactions yet
     there is nothing to judge, and saying "your approach is working" off zero moves would be
     a sentence with no content behind it. */
  const verdict = !txn.length
    ? `<div class="note"><b>No roster moves yet</b>, so there is nothing to judge. Every slot
       still holds the team you drafted, and the table below is the baseline this will be
       measured against. It becomes useful the first week you drop somebody.</div>`
    : `<div class="note"><b class="${totalEdge > 0.5 ? 'g' : totalEdge < -0.5 ? 'b' : 'y'}">
       ${totalEdge >= 0 ? '+' : ''}${totalEdge.toFixed(1)} points</b> from
       ${txn.length} move${txn.length===1?'':'s'} across ${streamed.length}
       slot${streamed.length===1?'':'s'}, against simply holding what you drafted.
       ${Math.abs(totalEdge) < 0.5
         ? 'That is a wash so far — the churn has neither paid nor cost you.'
         : totalEdge > 0 ? 'The approach is working.'
         : 'The teams you dropped have out-scored the ones you picked up.'}</div>`;

  /* ONE ROW PER TEAM THAT HAS HELD THE SLOT. Casey, 30 Aug 2026: "I think it would be good to
     show each team that I owned in that slot and the points I received from each." They were
     stacked inside one cell, which reads as a footnote rather than as the thing being measured.
     The slot's own line carries the totals; each team it has held gets its own row underneath
     with the weeks it was there and what it earned in them. */
  const body = rows.map(r => {
    const edge = r.edge == null ? '<span class="nolink">—</span>'
      : !r.streamed ? '<span class="d" title="This slot still holds the team you drafted, so there is nothing to compare it with.">held</span>'
      : `<b class="${r.edge > 0.4 ? 'g' : r.edge < -0.4 ? 'b' : 'y'}">${r.edge >= 0 ? '+' : ''}${r.edge.toFixed(1)}</b>`;
    /* COLLAPSED BY DEFAULT. Casey, 30 Aug 2026: "when collapsed I just see one row with the
       totals, when expanded I see what makes it up underneath. Otherwise this could turn into a
       very long table to read." Eleven slots that each accumulate three or four teams is forty
       rows by November, and the totals are what you scan. The detail is one tap away and the
       row says so. */
    const open = OPEN_SLOTS.has(r.slot);
    const head = `<tr class="slot-head clickable${open ? '' : ' closed'}" onclick="toggleSlot(${r.slot})"
        title="${open ? 'Hide' : 'Show'} the ${r.spells.length} team${r.spells.length===1?'':'s'} that ${r.spells.length===1?'has':'have'} held this slot">
      <td class="num d"><b>${r.slot}</b></td>
      <td><span class="pill p-${(r.pool||'fbs').toLowerCase()}">${r.pool}</span>
        <span class="caret">${open ? '▾' : '▸'}</span>
        <b>${r.spells.length === 1 ? r.spells[0].team : r.spells.length + ' teams'}</b>${r.streamed
             ? ` <span class="gtag t-yours">${r.spells.length - 1} move${r.spells.length===2?'':'s'}</span>`
             : ''}</td>
      <td class="num"><b>${r.actual.toFixed(1)}</b></td>
      <td class="num d hide-s">${r.held == null ? '—' : r.held.toFixed(1)}</td>
      <td class="num">${edge}</td></tr>`;
    /* ALWAYS one row per team, even when there is only one. Casey, 30 Aug 2026: "The slots
       table should show every team that held the slot... the table looks like it can only hold
       one team in the slot." Hiding the child row in the common case made the structure
       invisible, so the table did not look capable of what it is for. */
    const kids = !open ? '' : r.spells.map((sp, ki) => `<tr class="slot-kid${ki === r.spells.length - 1 ? ' last' : ''}">
      <td></td>
      <td class="d">↳ ${sp.team} <span class="d">wk ${sp.from_week}${
        sp.to_week == null ? '–now' : '–' + (sp.to_week - 1)}</span></td>
      <td class="num ${(sp.pts||0) > 0 ? 'g' : 'd'}">${sp.pts == null ? '—' : sp.pts.toFixed(1)}</td>
      <td colspan="2"></td></tr>`).join('');
    return head + kids;
  }).join('');

  const txnRows = txn.length ? `<div class="card"><h2>Every move you have made</h2>
    <div class="scr"><table>
      <colgroup><col style="width:14%"><col style="width:12%"><col style="width:37%"><col style="width:37%"></colgroup>
      <thead><tr><th class="num">Wk</th><th class="num">Slot</th><th>Dropped</th><th>Added</th></tr></thead>
      <tbody>${txn.map(t => `<tr><td class="num d">${t.week}</td><td class="num d">${t.slot}</td>
        <td class="b">${t.out}</td><td class="g">${t.in}</td></tr>`).join('')}</tbody></table></div>
    </div>` : '';

  const allOpen = OPEN_SLOTS.size === rows.length && rows.length > 0;
  b.innerHTML = `<div class="card"><h2>Points by roster slot</h2>
    ${verdict}
    <div class="bar"><button class="f" onclick="toggleAllSlots()">${
      allOpen ? 'Collapse all' : 'Expand all'}</button>
      <span class="d" style="align-self:center;font-size:12px">Tap a slot to see the teams that
      have held it.</span></div>
    <div class="scr"><table>
      <colgroup><col style="width:8%"><col style="width:44%"><col style="width:14%"><col style="width:16%"><col style="width:18%"></colgroup>
      <thead><tr><th class="num">#</th><th>Who has held it</th>
        <th class="num" title="Points this SLOT has earned — each team counted only for the weeks it actually occupied the slot.">Pts</th>
        <th class="num hide-s" title="What the team you drafted into this slot would have earned over the same weeks, had you simply held it. The drafted team keeps playing whether you own it or not, so this is a real number and not a projection.">If held</th>
        <th class="num" title="Earned minus If-held. Positive means the moves paid.">Edge</th></tr></thead>
      <tbody>${body}</tbody></table></div>
    ${explain('How the slot numbers work', `<p>A slot is one of your eleven roster positions and keeps its number all season, even as
      the team in it changes. Points are credited <b>only for the weeks the slot actually held
      that team</b> — a team you dropped stops scoring for you the week you drop it.</p>
      <p><b>If held</b> is the counterfactual: what your original draft pick would have earned
      over the same stretch. <b>Edge</b> is the difference, and it is the only number here that
      answers whether the churn was worth doing. A slot you never touched reads <b>held</b>,
      because there is nothing to compare it against.</p>
      <p>${anyPts ? '' : 'Nothing has scored yet — the season has barely started. '}These are
      regular-season points only: wins, ties, blowouts and shutouts. End-of-season bonuses are
      not in them, for the same reason they are not in the standings.</p>`)}</div>${txnRows}`;
}

watchHeader();
computeRerate();
renderChips(); renderFilters(); renderScores(); renderPick(); renderStandings(); renderSlots();
loadScores().then(schedulePoll);
</script></body></html>
